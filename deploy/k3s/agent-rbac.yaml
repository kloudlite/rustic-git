# RBAC for the node controller.
#
# Scope note that is easy to get wrong: a field selector narrows a WATCH, never authorization. The
# controller watches `spec.nodeName=$NODE_NAME`, but these grants are cluster-wide because the CRDs
# are cluster-scoped and Kubernetes RBAC cannot express "only objects whose spec names me". The
# sharding is a correctness property of the controller, not a permission boundary — an agent that
# ignored its field selector would be authorized to reconcile another node's volumes. Narrowing
# that further needs an admission webhook or per-node namespaces, neither of which is worth it
# while every node runs the same trusted binary.
# ponytail: cluster-wide grants sharded only by the controller's own field selector; upgrade path
# is a ValidatingAdmissionPolicy binding the request's node identity to spec.nodeName.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-agent
rules:
  # The work items. `status` is a separate subresource with a separate grant: the controller writes
  # status and must NOT be able to rewrite spec, which is the desired state the API owns. That
  # split is the whole reason the CRDs declare a status subresource.
  #
  # `create` on volumes, snapshotrequests and ownerbindings is the point of this change: a
  # controller that creates a child owns it, and the API lost the same verbs. (`ownerbindings`
  # specifically because the agent that WINS a placement claim is what binds the owner to this node
  # — `claim::ensure_binding`; a losing claimant never creates one.)
  # ponytail: `patch` on the parents' main resource is wider than `heal_labels` needs — a
  # ValidatingAdmissionPolicy refusing a non-label main-resource patch from this SA is the
  # mechanical version.
  - apiGroups: ["rustic-git.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "watch", "patch"]
  # `delete` on snapshotrequests is required: the `stop-{env}` request is deleted after teardown, or
  # the NEXT stop of that environment finds a `done` object under the same fixed name and tears down
  # without pushing at all. The other kinds are never deleted by the agent — a Volume goes by
  # garbage collection through its ownerReference — but RBAC cannot narrow a verb to one name.
  - apiGroups: ["rustic-git.io"]
    resources: ["volumes", "snapshotrequests", "ownerbindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["rustic-git.io"]
    resources:
      ["volumes/status", "workspaces/status", "environments/status",
       "snapshotrequests/status", "ownerbindings/status"]
    verbs: ["get", "patch", "update"]
  # Finalizers are edited on the main resource, but Kubernetes gates them behind their own verb.
  # `snapshotrequests/finalizers` is required: a delete during an in-flight push must wait, or it
  # orphans a btrfs send, a stage file and a blob upload with no object left to record the outcome.
  - apiGroups: ["rustic-git.io"]
    resources:
      ["volumes/finalizers", "workspaces/finalizers", "environments/finalizers",
       "snapshotrequests/finalizers"]
    verbs: ["update"]
  # What the controller materializes. Delete is required: stopping a workspace is expressed by
  # removing its pod, and a namespace's children are reconciled, not accumulated.
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "persistentvolumeclaims", "limitranges"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # PersistentVolumes are cluster-scoped; the controller creates one per subvolume.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Read-only: reconcile reports what it did, and a controller that cannot read a node's readiness
  # cannot explain why a pod is Pending.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # The controller creates a RoleBinding in each workspace namespace so the API can write that
  # namespace's git-token Secret — see api-rbac.yaml for why that is not a cluster-wide grant.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Kubernetes refuses to let a subject grant permissions it does not itself hold, unless it has
  # `bind` on the role being granted. `bind` on THIS ONE ClusterRole is the narrow form: without it
  # the controller would need `secrets: create` cluster-wide to hand out a namespaced secret
  # permission, which is exactly the grant this design exists to avoid.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["rustic-git-api-secrets"]
    verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustic-git-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustic-git-agent
subjects:
  - kind: ServiceAccount
    name: rustic-git-agent
    namespace: kube-system
