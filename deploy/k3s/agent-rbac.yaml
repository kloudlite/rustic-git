# RBAC for the node controller (`kloudlite-git-agent`).
#
# THE TABLE BELOW IS THE ROLE. It is every Kubernetes call the agent makes, enumerated from
# `bins/agent/src/*.rs` (the `crates/workspaces` crate builds objects; it never calls the API
# server). A verb that is not in the table is not in the rules; a call added to the code without a
# row here fails with a 403 that names this file.
#
#   resource (group)                       verb(s)                      call site
#   ------------------------------------------------------------------------------------------------
#   workspaces, environments (kloudlite-git.io)
#                                          get,list,watch               Controller watches; claim
#                                                                       re-read; check_source
#                                          patch                        heal_labels (metadata.labels
#                                                                       ONLY — see the admission
#                                                                       policy); workspaces only:
#                                                                       reconcile_workspace's
#                                                                       finalizer (metadata.
#                                                                       finalizers) on EVERY
#                                                                       workspace and environment
#                                                                       (the delete path decides
#                                                                       whether the Volume detaches
#                                                                       or is collected)
#   volumes (kloudlite-git.io)                get,list,watch               Controller + heartbeat list
#                                          create                       ensure_child_volume (a
#                                                                       parent's child)
#                                          patch                        finalizer (metadata),
#                                                                       detach_volume (metadata.
#                                                                       ownerReferences: a deleted
#                                                                       parent whose Volume still
#                                                                       holds a Ready commit drops
#                                                                       its own ownerReference so
#                                                                       GC keeps the commits),
#                                                                       restore_gate (spec.restoreTo),
#                                                                       resolve_volume (spec.nodeName
#                                                                       owned->'' or ''->node) — the
#                                                                       two spec field exceptions, see
#                                                                       the policy
#                                          delete                       collect_unreferenced_volumes
#                                                                       (peer/sweeps.rs: an ownerless volume
#                                                                       with no worktree and no
#                                                                       snapshot has no
#                                                                       ownerReference left to GC it)
#   ownerbindings (kloudlite-git.io)          get,list,watch               Controller; namespace_ready
#                                          create                       claim::ensure_binding
#   quotas (kloudlite-git.io)                 get,list,watch               binding/environment reconcile:
#                                                                       the owner's effective ceiling,
#                                                                       written into the namespace as
#                                                                       a ResourceQuota. READ ONLY —
#                                                                       a quota is desired state and
#                                                                       the agent never writes one
#   clustersettings (kloudlite-git.io)        get,list,watch               refresh beat reads the single
#   clustersettings/status                 patch                        `default` object every tunable; the ack (observedGeneration) is the one write
#                                                                       (sync/replica/decommission
#                                                                       intervals, timeouts, images)
#                                                                       comes from. READ ONLY — an
#                                                                       admin writes it through /v1
#   snapshots (kloudlite-git.io)              get,list,watch               pull_beat (missing-commit
#                                                                       diff against local_commits);
#                                                                       Controller (cut, retention,
#                                                                       stop-push watch)
#                                          create                       stop_push (stop-{env})
#                                          patch                        record_post_cut_generation
#                                                                       (the synced-generation
#                                                                       annotation, metadata only)
#                                          delete                       snapshot::retain (one sync
#                                                                       point per worktree; a push
#                                                                       is never pruned);
#                                                                       stop_push teardown cleanup;
#                                                                       retire_pass's orphan sweep
#                                                                       (spec.volume names no Volume);
#                                                                       cleanup_parent (a deleted
#                                                                       parent's own transients —
#                                                                       worthless once the worktree
#                                                                       they were cut from is gone)
#   volumereplicas (kloudlite-git.io)         get,list,watch               pull_beat (source selection,
#                                                                       reaper)
#                                          create,patch                 write_replica_status (this
#                                                                       node's own row — the sole
#                                                                       writer)
#                                          delete                       reap_dead_replicas — the
#                                                                       ONE guarded exception, gated
#                                                                       on the row's node being
#                                                                       NotReady past WS_NODE_DEAD_SECS
#   */status (kloudlite-git.io, all six)      patch                        patch_status (apply)
#                                          update                       replace_status (claim CAS)
#   */finalizers (kloudlite-git.io, all four) update                       finalizer on volumes; the
#                                                                       parents for OwnerReferences
#                                                                       PermissionEnforcement on
#                                                                       their children (Snapshot has
#                                                                       none — see its module doc)
#   namespaces                             get,create,patch             ensure (server-side apply); get for the per-node gate
#   limitranges                            create,patch                 ensure (server-side apply)
#   resourcequotas                         create,patch                 ensure (server-side apply)
#   services                               create,patch,delete          ensure; delete removes the ClusterIP of a service whose definition lost its ports
#   networkpolicies                        create,patch                 ensure (incl. both halves of
#                                                                       an attachment grant)
#                                          delete                       delete_ignoring_404 — the
#                                                                       unattached branch of EVERY
#                                                                       workspace pass takes it, and
#                                                                       RBAC refuses with 403, not
#                                                                       404, so without this every
#                                                                       reconcile aborts
#   rolebindings (rbac)                    create,patch                 ensure (api-secrets,
#                                                                       agent-secrets)
#   clusterroles (rbac)                    bind  [named]                the two roles those bindings
#                                                                       grant
#   pods                                   get,list,watch               pod_is_ready; writing_pods;
#                                                                       Controller watches
#                                          create                       create_if_absent
#                                          delete                       delete_ignoring_404 (stop)
#   statefulsets (apps)                    get,list,watch               deployment_status; watch
#                                          create,patch                 ensure; restore_gate scale
#                                          delete                       stop
#   secrets                                get,create                   ensure_ssh — NOT here: bound
#                                                                       per `ws-*` namespace by the
#                                                                       agent itself (below)
#   nodes                                  get,list                     node_roles (startup);
#                                                                       replication rendezvous
#                                                                       (peer/placement.rs) — every agent must
#                                                                       see the same candidate list;
#                                                                       the decommission label
#                                          watch                        each parent Controller
#                                                                       watches THIS node only, so a
#                                                                       label change re-queues every
#                                                                       parent it hosts (run.rs)
#                                          patch                        decommission_beat, THIS
#                                                                       node's own
#                                                                       `kloudlite-git.io/decommission-
#                                                                       status` annotation only
#
# Two things RBAC cannot say, and where the ValidatingAdmissionPolicy in `agent-admission.yaml`
# takes over. Apply both files; the role without the policy is the honest-but-wide version:
#
#   1. `patch` on a main resource is `patch` on all of it. `heal_labels` needs to write
#      `metadata.labels` on the parents, the finalizer helper writes `metadata.finalizers` on the
#      children, and `restore_gate` copies the parent's restore wish into `Volume.spec.restoreTo`;
#      `resolve_volume` clears `spec.nodeName` to pin a takeover or claims it. Kubernetes has no
#      field-level verb, so the policy refuses any other spec change from this account — that is
#      what makes "the controller cannot edit desired state" mechanical.
#   2. `bind` + `rolebindings: create` is "grant these roles to anyone, anywhere". The policy
#      pins the namespace prefix, the roleRef and the subjects of every RoleBinding this account
#      writes.
#
# Scope note that is easy to get wrong: a field selector narrows a WATCH, never authorization. The
# controller watches its own node's objects, but these grants are cluster-wide because the CRDs are
# cluster-scoped and RBAC cannot express "only objects whose status names me". The sharding is a
# correctness property of the controller, not a permission boundary.
# ponytail: cluster-wide grants sharded only by the controller's own field selector; the policy
# could additionally bind the request's node identity to `status.nodeName` if nodes stop being
# equally trusted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudlite-git-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-git-agent
rules:
  - apiGroups: ["kloudlite-git.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "watch", "patch"]
  # `create` on the children: a controller that creates a child owns it, and the API lost the same
  # verbs. `delete` is `collect_unreferenced_volumes` (peer/sweeps.rs): an ownerless Volume with no
  # worktree and no snapshot has no ownerReference left to garbage-collect it, so the sweep is the
  # only thing that can reclaim it — without this verb the beat 403s every pass.
  - apiGroups: ["kloudlite-git.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # `ownerbindings` are created by the agent that WINS a placement claim — `claim::ensure_binding`;
  # a losing claimant never creates one, and nothing ever edits or deletes one.
  - apiGroups: ["kloudlite-git.io"]
    resources: ["ownerbindings"]
    verbs: ["get", "list", "watch", "create"]
  # Read-only, and deliberately so: a `Quota` is DESIRED state, written by a superadmin through
  # /v1. The agent only projects it into the namespace as a `ResourceQuota`, which is why
  # agent-admission.yaml gains nothing for this feature — there is no agent spec write to refuse.
  - apiGroups: ["kloudlite-git.io"]
    resources: ["quotas"]
    verbs: ["get", "list", "watch"]
  # Same read-only reasoning as `quotas` for the SPEC: `ClusterSettings` is admin-written desired
  # state, and the agent's refresh beat only ever reads the single `default` object. The STATUS
  # subresource is the one thing the agent writes back — `observedGeneration`, the ack the admin
  # UI's "pending" marker waits for — and the admission policy fences spec, not status.
  - apiGroups: ["kloudlite-git.io"]
    resources: ["clustersettings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kloudlite-git.io"]
    resources: ["clustersettings/status"]
    verbs: ["patch"]
  # `snapshots`: mostly created by `/v1` (Task 6's `/push`), CR-first per the brief — the agent
  # only cuts the btrfs snapshot and reports status, and `pull_beat` diffs the Ready set against
  # `local_commits` to decide what to fetch. `create` is also `stop_push`'s fixed-name `stop-{env}`
  # CR (Task 8: the stop-before-teardown push is a `Snapshot` now, not the deleted
  # `SnapshotRequest`). `delete` is retention (the
  # worktree's own node keeps ONE sync point per worktree and drops the older ones, converging the
  # subvolume away too — a push is never pruned, only deleted by hand through `/v1`)
  # and `stop_push`'s own teardown cleanup — left behind, the NEXT stop would find the same
  # fixed-name object already `Ready` and tear down without pushing again. `delete` is also
  # `retire_pass`'s orphan sweep, which clears the ownerless baselines minted before
  # `migrate_and_seed_baseline` stamped one; every snapshot made today is GC'd by its owner.
  # `patch` is metadata only (rule 1 below: on a main resource it is `patch` on all of it, and spec
  # stays read-only — agent-admission.yaml does not even match `snapshots`): the commit reconciler
  # re-stamps a sync point's `kloudlite-git.io/synced-generation` with the generation the worktree has
  # AFTER the cut, because a snapshot bumps its own source's generation and the pre-cut value
  # leaves every idle worktree due forever.
  - apiGroups: ["kloudlite-git.io"]
    resources: ["snapshots"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # `volumereplicas`: every node reads every row (source selection walks OTHER nodes' rows, and
  # the reaper reads every node's), but writes only its own — `create`/`patch` for
  # `write_replica_status`'s create-or-update, `delete` for the ONE guarded cross-node exception,
  # `reap_dead_replicas`, gated on the row's `spec.node` being NotReady past `WS_NODE_DEAD_SECS`.
  - apiGroups: ["kloudlite-git.io"]
    resources: ["volumereplicas"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Status is the controller's half of every object. `update` is for `replace_status` — the claim
  # is an optimistic PUT carrying resourceVersion, not a forced apply, so two nodes cannot both win.
  - apiGroups: ["kloudlite-git.io"]
    resources:
      ["volumes/status", "workspaces/status", "environments/status",
       "ownerbindings/status", "volumereplicas/status", "snapshots/status"]
    verbs: ["patch", "update"]
  # Finalizers are edited on the main resource, but Kubernetes gates them behind their own verb.
  # Snapshot has none (see its module doc: content-addressed btrfs, reclaimed by retention or a
  # client, never something to wait in flight for). The parents' entries exist for
  # OwnerReferencesPermissionEnforcement: every child this controller creates carries
  # `blockOwnerDeletion`, and a cluster running that admission plugin checks the creator may
  # update the OWNER's finalizers.
  - apiGroups: ["kloudlite-git.io"]
    resources:
      ["volumes/finalizers", "workspaces/finalizers", "environments/finalizers",
       "ownerbindings/finalizers"]
    verbs: ["update"]
  # What `ensure` materializes, by server-side apply: a PATCH, which the apiserver additionally
  # authorizes as `create` when the object does not exist yet — both verbs are the apply. Nothing
  # in THIS rule is ever deleted by the agent — an ownerReference does that — so no `delete`, and
  # nothing is read back, so no `get`.
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas"]
    verbs: ["create", "patch"]
  # `delete` on services only: a service whose definition dropped its ports gets no ClusterIP any
  # more, and the stale one from the earlier definition has to go — nothing else the agent writes
  # is ever removed except by its owner's garbage collection.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "patch", "delete"]
  # Namespaces are the one thing read back: `namespace_ready` GETs the workspace's own namespace
  # so a node that has never seen a team is gated on the namespace's existence, not on a
  # cluster-scoped condition another node wrote. `get`, never `list` — the agent has no reason to
  # enumerate namespaces it did not make.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]
  # NetworkPolicies are the exception to the "nothing here is ever deleted" rule above: an
  # attachment grant is removed by NAME on detach, because its workspace outlives it. A denied
  # delete comes back 403, not 404, so a missing verb here does not degrade — it aborts every
  # workspace reconcile in the cluster, attached or not.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "patch", "delete"]
  # Pods are created when absent (a Pod is immutable, so never applied), read back for readiness,
  # watched to wake the parent's reconcile, and deleted to stop a workspace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # StatefulSets are applied, scaled (a merge patch on replicas), read back, watched, and deleted on
  # stop.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # `get` is read-only, once, at startup: which pools this node advertises
  # (`kloudlite-git.io/session|env`).
  # `list` joined `get` for replication: the sender computes standby targets by rendezvous over
  # the pooled nodes, and every agent must see the same candidate list or two nodes will disagree
  # about who holds what.
  # `patch` is annotations in practice — the decommission beat writes this node's own
  # `kloudlite-git.io/decommission-status`, which is how an operator watches a drain and learns when
  # the VM is safe to delete. RBAC cannot narrow `patch` to one annotation on one node, and the
  # admission policy does not match `nodes`, so this is a broad verb taken KNOWINGLY: the agent
  # already runs as root with the host PID namespace on that node, so a compromised agent could
  # do anything a node can do regardless of this line. The narrowing that WOULD work — an
  # admission policy binding `request.name` to the agent's own node — is the upgrade if the
  # agent ever stops being root.
  # `watch` is the Workspace and Environment controllers' watch on THIS node's own object
  # (`metadata.name={me}`): a converged parent ends in `await_change()`, so without it a
  # decommission label landing on the Node reached no workspace at all — and removing the label
  # left a stale notice. A field selector narrows the stream, never the grant, so this reads as
  # cluster-wide like the `list` above it and for the same reason.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # The controller creates two RoleBindings in each workspace namespace: one so the API can write
  # that namespace's git-token Secret (see api-rbac.yaml), one so the agent itself can read and
  # create that namespace's host-key Secret (see `kloudlite-git-agent-ws-secrets` below). Kubernetes
  # refuses to let a subject grant permissions it does not itself hold unless it has `bind` on the
  # role being granted; `bind` on exactly these two ClusterRoles is the narrow form. The policy
  # in agent-admission.yaml is what stops this pair being "grant either role to anyone anywhere".
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["kloudlite-git-api-secrets", "kloudlite-git-agent-ws-secrets"]
    verbs: ["bind"]
---
# Secrets are deliberately NOT in the ClusterRole above. The agent reads exactly one Secret per
# workspace — the `ws-ssh-{id}` host key — and creates the one that is missing; it never updates
# one (a host key that changed is indistinguishable from a man in the middle), never lists or
# watches, and the ownerReference does the deleting. Cluster-wide `get` would have covered
# `kloudlite-git-jwt` and the api's credentials in kube-system, so this role is bound per workspace
# namespace by the binding reconciler instead (`k8s::agent_secret_binding`), the same shape as the
# api's grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-git-agent-ws-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudlite-git-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlite-git-agent
subjects:
  - kind: ServiceAccount
    name: kloudlite-git-agent
    namespace: kube-system
