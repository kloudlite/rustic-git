# The region's OpenTelemetry collectors: a DaemonSet that reads what is only readable ON a node,
# and a single Deployment for the one receiver that must not run per node.
#
# The split is forced by the receivers, not by taste. `kubeletstats` and `filelog` see only the
# node they run on, so they must be everywhere; `k8s_cluster` reports the whole cluster from the
# API server, so running it on every node would multiply every cluster metric by the node count.
# The `prometheus` receiver could run either way, and it rides the DaemonSet with a relabel that
# keeps only this node's pods — one scraper per node, each covering its own, so no target is
# scraped twice and no pod is missed.
#
# What `kloudlite-otel-agent` may do in this cluster (the header table IS the role — both
# workloads share one ServiceAccount, because neither reads anything the other may not):
#
# | Resource                          | Verbs            | Why                                    |
# |-----------------------------------|------------------|----------------------------------------|
# | pods                              | get,list,watch   | the prometheus receiver's service      |
# |                                   |                  | discovery, and k8sattributes' pod ->   |
# |                                   |                  | owner/namespace enrichment             |
# | nodes, nodes/proxy, nodes/stats   | get,list,watch   | kubeletstats reads each node's         |
# |                                   |                  | /stats/summary through the kubelet     |
# | nodes/metrics                     | get              | the same, on clusters that gate it     |
# |                                   |                  | separately                             |
# | namespaces, replicasets           | get,list,watch   | k8sattributes resolves a pod's         |
# |                                   |                  | workload through them                  |
# | services, endpoints               | get,list,watch   | prometheus service discovery's other   |
# |                                   |                  | half                                   |
# | daemonsets, deployments,          | get,list,watch   | k8s_cluster's object counts and phases |
# | statefulsets, events,             |                  | — the Deployment below, not the        |
# | resourcequotas, jobs, cronjobs,   |                  | DaemonSet                              |
# | replicationcontrollers, hpa       |                  |                                        |
#
# NOT granted, deliberately: anything in `kloudlite.io` (the CRDs are the API's and the agent's,
# and telemetry has no business reading a workspace's spec), any write verb at all, and secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudlite-otel-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-otel-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  # k8s_cluster counts these too; without the grant it logs a 403 per list forever.
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # The receiver's documented role (k8sclusterreceiver README, v0.109.0) also lists these
  # subresources and the legacy extensions group; a cluster that gates them separately 403s.
  - apiGroups: [""]
    resources: ["namespaces/status", "nodes/spec", "pods/status", "replicationcontrollers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudlite-otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlite-otel-agent
subjects:
  - kind: ServiceAccount
    name: kloudlite-otel-agent
    namespace: kube-system
---
# The per-node half.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kloudlite-otel-agent
  namespace: kube-system
data:
  config.yaml: |
    receivers:
      # Every pod already annotated `prometheus.io/scrape` — the same annotation the retired
      # on-request scrape used, so nothing had to be re-annotated for this.
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 15s
              kubernetes_sd_configs: [{ role: pod }]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                # This pod's node only. Discovery is cluster-wide on every node, so without this
                # each of N collectors would scrape all N nodes' pods and every counter would
                # arrive N times.
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                # Our pods only: every other annotated exporter on the node (cert-manager, the
                # ingress) is somebody else's telemetry.
                - source_labels: [__meta_kubernetes_namespace]
                  action: keep
                  regex: kube-system|kloudlite-system
                - source_labels: [__meta_kubernetes_pod_name]
                  action: keep
                  regex: kloudlite-.*
                # The annotation names the metrics port; without this rewrite discovery would
                # scrape the pod's first declared port, which for most of ours is not 9464.
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: k8s_pod_name
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace_name
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: k8s_node_name
      # Node and pod CPU/memory/filesystem, straight from THIS node's kubelet. This is why the
      # agent exports only the two gauges the kubelet cannot know (btrfs pool, running worktrees).
      kubeletstats:
        collection_interval: 15s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_IP}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      # OUR pods' logs only (the agent and these collectors in kube-system, the gateway in kloudlite-system), so HyperDX has logs beside metrics
      # without ingesting every workspace container on the node. Our binaries keep plain
      # tracing output; `KLOUDLITE_LOG_FORMAT=json` makes them structured here without
      # changing the code.
      # The node's own syslog, kernel lines only: the NFS export not answering, a btrfs error on
      # the pool, the OOM killer — what a pod log can never say about itself.
      filelog/syslog:
        include: [/var/log/syslog, /var/log/messages]
        start_at: end
        operators:
          - type: filter
            expr: 'body not matches "(?i)(nfs|btrfs|out of memory|oom-kill|i/o error|ext4-fs error|hung task)"'
          - type: regex_parser
            regex: '^(?P<time>\S+) (?P<host>\S+) (?P<proc>[^:\[]+)(\[\d+\])?: (?P<message>.*)$'
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999-07:00'
          - type: move
            if: 'attributes.message != nil'
            from: attributes.message
            to: body
          - type: add
            field: attributes["service.name"]
            value: node-syslog
      filelog:
        include: [/var/log/pods/kube-system_kloudlite-*/*/*.log, /var/log/pods/kloudlite-system_*/*/*.log]
        # Not the collectors themselves: "Started watching file" is nobody's signal.
        exclude: [/var/log/pods/*_kloudlite-otel-*/*/*.log]
        include_file_path: true
        operators:
          - type: container
            id: container-parser
          # Our binaries run with KLOUDLITE_LOG_FORMAT=json (one object per event, fields
          # flattened next to `level`/`target`/`message`), so level, module and call-site fields
          # become real columns instead of text inside a coloured string. A line that is not
          # JSON (a panic backtrace, a child process) passes through as plain body.
          - type: json_parser
            id: event
            if: 'body matches "^\\{"'
            parse_from: body
            parse_to: attributes
            severity:
              parse_from: attributes.level
            timestamp:
              parse_from: attributes.timestamp
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: move
            if: 'attributes.message != nil'
            from: attributes.message
            to: body
          - type: move
            if: 'attributes.target != nil'
            from: attributes.target
            to: attributes["code.namespace"]
          - type: remove
            if: 'attributes.level != nil'
            field: attributes.level
          - type: remove
            if: 'attributes.timestamp != nil'
            field: attributes.timestamp

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name, k8s.container.name]
      # `region` is the one label every query in `history/series.rs` and `history/alerts.rs`
      # filters on, and nothing in the telemetry itself knows which region it is in — so it is
      # stamped here, per cluster.
      #
      # `k8s.node.name` is INSERTED (never upserted) from the downward API, and it is correct only
      # because this is a DaemonSet whose receivers all read the local node: every datapoint that
      # reaches this processor without the attribute came from this node, so naming it is a fact,
      # not a guess. The per-node alert rules — `PoolAlmostFull` and `NodeDiskAlmostFull`, which
      # group by `ResourceAttributes['k8s.node.name']` and take the worst node — read exactly this,
      # and `insert` leaves alone the datapoints kubeletstats and k8sattributes already labelled.
      # If this ever becomes a Deployment again, DELETE this line: it would relabel the whole
      # fleet as one node and both rules would silently report one node's disk as everyone's.
      resource:
        attributes:
          - { key: region, value: "${env:KLOUDLITE_REGION}", action: upsert }
          - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: insert }
      # One identity on every log row and metric point, the same four keys everywhere:
      # `service.name` is the WORKLOAD (kloudlite-srv, -api, -admin, -worker, -gateway, -agent),
      # never the container name (the server's container is called `kloudlite`) and never the
      # scrape job; `service.instance.id` is the pod; `tier` says central or region so a query
      # can pick a control plane without listing regions. Resource-level, so it lands beside
      # `region` and the k8s.* keys k8sattributes resolved just before.
      # kubeletstats reports every pod on the node; only ours are wanted (node-level points carry
      # no pod and pass). The same "our services only" line the log tail draws.
      filter/ours:
        error_mode: ignore
        metrics:
          metric:
            - 'resource.attributes["k8s.pod.name"] != nil and not IsMatch(resource.attributes["k8s.pod.name"], "^kloudlite-")'
      transform/identity:
        error_mode: ignore
        log_statements:
          - context: resource
            statements: &identity
              # The workload name is the pod name minus its generated suffix: `-0` on a
              # StatefulSet pod, `-<5>` on a DaemonSet's, `-<hash>-<5>` on a Deployment's.
              # Derived here rather than read from k8s.*.name because k8sattributes fills
              # k8s.daemonset.name only for some pods and the picker must never be blank.
              - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["k8s.pod.name"] != nil
              - replace_pattern(attributes["service.name"], "-[0-9]+$", "")
              - replace_pattern(attributes["service.name"], "(-[a-f0-9]{8,10})?-[a-z0-9]{5}$", "")
              - set(attributes["service.instance.id"], attributes["k8s.pod.name"]) where attributes["k8s.pod.name"] != nil
              - set(attributes["tier"], "central") where attributes["region"] == "central"
              - set(attributes["tier"], "region") where attributes["region"] != "central"
        metric_statements:
          - context: resource
            statements: *identity
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp:
        endpoint: https://otel-dev.kloudlite.io
        headers:
          authorization: "${env:OTEL_INGESTION_KEY}"
        # The collector's own queue is the buffer. Nothing of ours buffers telemetry — a dropped
        # sample is a gap in a chart, and building a durable queue for that would be the most
        # over-engineered thing in this repo.
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        metrics:
          receivers: [prometheus, kubeletstats]
          processors: [k8sattributes, resource, filter/ours, transform/identity, batch]
          exporters: [otlphttp]
        logs:
          receivers: [filelog, filelog/syslog]
          processors: [k8sattributes, resource, transform/identity, batch]
          exporters: [otlphttp]
---
# The cluster-wide half. Same image, same ServiceAccount, one receiver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kloudlite-otel-cluster
  namespace: kube-system
data:
  config.yaml: |
    receivers:
      k8s_cluster:
        collection_interval: 30s
      # Kubernetes events for the platform and every tenant namespace: OOMKilled, image pulls,
      # evictions, FailedScheduling — what a pod's own log never carries.
      k8s_events:
        auth_type: serviceAccount

    processors:
      # Events are rows about pods, not from them: named as their own service so the picker
      # shows `k8s-events` rather than a blank.
      resource/events:
        attributes:
          - { key: service.name, value: k8s-events, action: upsert }
      # `region` only. NO `k8s.node.name` here: these metrics describe every node in the cluster
      # and already carry the right one per datapoint — stamping this pod's would be a lie.
      resource:
        attributes:
          - { key: region, value: "${env:KLOUDLITE_REGION}", action: upsert }
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp:
        endpoint: https://otel-dev.kloudlite.io
        headers:
          authorization: "${env:OTEL_INGESTION_KEY}"
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [resource, batch]
          exporters: [otlphttp]
        logs:
          receivers: [k8s_events]
          processors: [resource, resource/events, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kloudlite-otel-agent
  namespace: kube-system
spec:
  selector:
    matchLabels: { app: kloudlite-otel-agent }
  template:
    metadata:
      labels: { app: kloudlite-otel-agent }
    spec:
      serviceAccountName: kloudlite-otel-agent
      # /var/log/syslog is root:adm 0640; the collector image runs unprivileged, so it joins
      # `adm` (gid 4) to read it — read-only mount, no capability, no root.
      securityContext:
        supplementalGroups: [4]
      # Control-plane nodes run pods too (the gateway), and their logs and kubelet stats
      # are as interesting as any worker's — a collector that skipped them would leave a hole
      # nothing else fills.
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          # Pinned by index digest, like every other image in deploy/. Load-bearing beyond the
          # usual reproducibility argument: `k8s.node.cpu.utilization` and
          # `k8s.node.memory.utilization` — the two metrics the console's `cpu_used` and
          # `memory_used` series are built on — were removed from kubeletstats in a later release.
          # Bumping this tag without rewriting `history::series` empties both charts.
          image: otel/opentelemetry-collector-contrib:0.109.0@sha256:af0f72b2d2493fc17f06cf3bc136548240cd7ebb2c8b1c8a7be6f3eb03068389
          args: ["--config=/conf/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # The kubelet is dialled by IP: a node NAME is not something pod DNS resolves.
            - name: K8S_NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: KLOUDLITE_REGION
              # Edit per region before applying — this is the value every console query filters
              # on, and it must equal the region's `Region` CR id or its charts stay empty.
              value: centralindia-k3s
            - name: OTEL_INGESTION_KEY
              # No `optional: true`: a collector that started without the key would export nothing
              # and look healthy, which is strictly worse than the CrashLoopBackOff a missing
              # Secret gives. Create it first — deploy/clickstack/README.md.
              valueFrom: { secretKeyRef: { name: kloudlite-otel, key: key } }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: varlog, mountPath: /var/log, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: conf
          configMap: { name: kloudlite-otel-agent }
        - name: varlogpods
          hostPath: { path: /var/log/pods }
        - name: varlog
          hostPath: { path: /var/log }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudlite-otel-cluster
  namespace: kube-system
spec:
  # ONE, and it must stay one: `k8s_cluster` reports the whole cluster, so a second replica is a
  # second copy of every cluster metric, not redundancy.
  replicas: 1
  selector:
    matchLabels: { app: kloudlite-otel-cluster }
  template:
    metadata:
      labels: { app: kloudlite-otel-cluster }
    spec:
      serviceAccountName: kloudlite-otel-agent
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.109.0@sha256:af0f72b2d2493fc17f06cf3bc136548240cd7ebb2c8b1c8a7be6f3eb03068389
          args: ["--config=/conf/config.yaml"]
          env:
            - name: KLOUDLITE_REGION
              value: centralindia-k3s
            - name: OTEL_INGESTION_KEY
              valueFrom: { secretKeyRef: { name: kloudlite-otel, key: key } }
          volumeMounts:
            - { name: conf, mountPath: /conf }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: kloudlite-otel-cluster }
