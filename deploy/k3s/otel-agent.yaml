# The region's OpenTelemetry agent collector: it scrapes what this cluster exposes and exports it
# to the ClickStack gateway on AKS. One replica — this is a scraper, not a sidecar, and two would
# double every sample.
#
# ponytail: one Deployment, so `kubeletstats` and `filelog` see only the node this pod lands on —
# node/pod resource usage and pod logs are complete for that node and absent for the others, while
# `prometheus` and `k8s_cluster` cover the whole cluster from anywhere. That is enough for the
# console's fleet charts (the agent's own `node_pool_bytes_*` gauges come through the prometheus
# scrape, cluster-wide). Upgrade path when per-node logs matter: make this a DaemonSet and split
# the cluster-wide receivers into a second, single-replica Deployment, because `k8s_cluster` on
# every node would multiply every cluster metric by the node count.
#
# What `rustic-git-otel-agent` may do in this cluster (the header table IS the role):
#
# | Resource                | Verbs            | Why                                                  |
# |-------------------------|------------------|------------------------------------------------------|
# | pods                    | get,list,watch   | the prometheus receiver's service discovery, and     |
# |                         |                  | k8sattributes' pod -> owner/namespace enrichment     |
# | nodes, nodes/proxy      | get,list,watch   | kubeletstats reads each node's /stats/summary        |
# | nodes/metrics           | get              | the same, on clusters that gate it separately        |
# | namespaces, replicasets | get,list,watch   | k8sattributes resolves a pod's workload through them |
# | services, endpoints     | get,list,watch   | prometheus service discovery's other half            |
#
# NOT granted, deliberately: anything in `rustic-git.io` (the CRDs are the API's and the agent's,
# and telemetry has no business reading a workspace's spec), any write verb at all, and secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-otel-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-otel-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # k8s_cluster's own reads: it reports the cluster's object counts and phases, which is where
  # `nodes_ready` and the pod-phase gauges come from. Read-only, like everything above.
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/stats", "events", "resourcequotas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustic-git-otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustic-git-otel-agent
subjects:
  - kind: ServiceAccount
    name: rustic-git-otel-agent
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustic-git-otel-agent
  namespace: kube-system
data:
  config.yaml: |
    receivers:
      # Every pod already annotated `prometheus.io/scrape` — the same annotation the retired
      # on-request scrape used, so nothing had to be re-annotated for this.
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 15s
              kubernetes_sd_configs: [{ role: pod }]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                # The annotation names the metrics port; without this rewrite discovery would
                # scrape the pod's first declared port, which for most of ours is not 9464.
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: k8s_pod_name
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace_name
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: k8s_node_name
      # Node and pod CPU/memory/filesystem, straight from each kubelet. This is why the agent
      # exports only the two gauges the kubelet cannot know (btrfs pool, running worktrees).
      kubeletstats:
        collection_interval: 15s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      k8s_cluster:
        collection_interval: 30s
      # Pod logs, so HyperDX has logs beside metrics. Our binaries keep plain tracing output;
      # `RUSTIC_GIT_LOG_FORMAT=json` makes them structured here without changing the code.
      filelog:
        include: [/var/log/pods/*/*/*.log]
        include_file_path: true
        operators:
          - type: container
            id: container-parser

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name, k8s.container.name]
      # The one label every query in `history/series.rs` and `history/alerts.rs` filters on. Set
      # here, per cluster, because nothing in the telemetry itself knows which region it is in.
      # `k8s.node.name` is upserted alongside it for the same reason the alert rules group by node:
      # the prometheus receiver's relabelled `k8s_node_name` is a metric label, not a resource
      # attribute, and the per-node rules read the resource.
      resource:
        attributes:
          - { key: region, value: "${env:RUSTIC_GIT_REGION}", action: upsert }
          - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: insert }
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp:
        endpoint: https://otel.dev.kloudlite.io
        headers:
          authorization: "${env:OTEL_INGESTION_KEY}"
        # The collector's own queue is the buffer. Nothing of ours buffers telemetry — a dropped
        # sample is a gap in a chart, and building a durable queue for that would be the most
        # over-engineered thing in this repo.
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        metrics:
          receivers: [prometheus, kubeletstats, k8s_cluster]
          processors: [k8sattributes, resource, batch]
          exporters: [otlphttp]
        logs:
          receivers: [filelog]
          processors: [k8sattributes, resource, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-otel-agent
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustic-git-otel-agent }
  template:
    metadata:
      labels: { app: rustic-git-otel-agent }
    spec:
      serviceAccountName: rustic-git-otel-agent
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.109.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: RUSTIC_GIT_REGION
              # Edit per region before applying — this is the value every console query filters on,
              # and it must equal the region's `Region` CR id or its charts stay empty.
              value: westeurope-k3s
            - name: OTEL_INGESTION_KEY
              # No `optional: true`: a collector that started without the key would export nothing
              # and look healthy, which is strictly worse than the CrashLoopBackOff a missing
              # Secret gives. Create it first — deploy/clickstack/README.md.
              valueFrom: { secretKeyRef: { name: rustic-git-otel, key: key } }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: conf
          configMap: { name: rustic-git-otel-agent }
        - name: varlogpods
          hostPath: { path: /var/log/pods }
