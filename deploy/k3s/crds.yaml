                      }
                    },
                    "required": [
                      "name",
                      "status"
                    ],
                    "type": "object"
                  },
                  "status": {
                    "description": "Empty on purpose: no controller observes a region. It exists so the kind has the same\n`/status` subresource split every sibling has, rather than being the one kind where a status\nwrite would fold into spec.",
                    "nullable": true,
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "Region",
                "type": "object"
