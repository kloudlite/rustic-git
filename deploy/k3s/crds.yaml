            "snap"
          ],
          "singular": "snapshotrequest"
        },
        "scope": "Cluster",
        "versions": [
          {
            "additionalPrinterColumns": [
              {
                "jsonPath": ".spec.volume",
                "name": "Volume",
                "type": "string"
              },
              {
                "jsonPath": ".status.phase",
                "name": "Phase",
                "type": "string"
              },
              {
                "jsonPath": ".status.snapshotId",
                "name": "Snapshot",
                "type": "string"
              },
              {
                "jsonPath": ".metadata.creationTimestamp",
                "name": "Age",
                "type": "date"
              }
            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for SnapshotRequestSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "One push, as an object: the request the user made and, in status, what it produced.\n\nA CR rather than the annotation it replaces, because a push is a wish WITH AN OUTCOME and an\nannotation has nowhere to put the outcome — the old design smuggled it into\n`Volume.status.lastPush.at` by echoing the request's timestamp back.\n\nDeliberately NOT owned by the Volume: a snapshot outlives a deleted workspace, because the\nrecord it names still exists on the server tier. Deleting this object deletes no data — which\nis why the owning node reclaims a `done` one after `controller::SNAPSHOT_REQUEST_TTL`, and why\nnothing user-facing reads these as the list of snapshots.\nponytail: no snapshot (record) deletion or retention yet; the GC sweep for blobs is unchanged.",
                    "properties": {
                      "message": {
                        "nullable": true,
                        "type": "string"
                      },
                      "volume": {
                        "description": "The `Volume` to snapshot, by name. The whole spec: everything else about a push is either a\nfact a controller owns (the node) or an outcome (the record id).",
                        "type": "string"
                      }
                    },
                    "required": [
                      "volume"
                    ],
                    "type": "object"
                  },
                  "status": {
                    "nullable": true,
                    "properties": {
                      "at": {
                        "description": "RFC 3339, when the record landed.",
                        "nullable": true,
                        "type": "string"
                      },
                      "conditions": {
                        "items": {
                          "description": "Condition contains details for one aspect of the current state of this API Resource.",
                          "properties": {
                            "lastTransitionTime": {
                              "description": "lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.",
                              "format": "date-time",
                              "type": "string"
                            },
                            "message": {
                              "description": "message is a human readable message indicating details about the transition. This may be an empty string.",
                              "type": "string"
                            },
                            "observedGeneration": {
                              "description": "observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.",
                              "format": "int64",
                              "type": "integer"
                            },
                            "reason": {
                              "description": "reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.",
                              "type": "string"
                            },
                            "status": {
                              "description": "status of the condition, one of True, False, Unknown.",
                              "type": "string"
                            },
                            "type": {
                              "description": "type of condition in CamelCase or in foo.example.com/CamelCase.",
                              "type": "string"
                            }
                          },
                          "required": [
                            "lastTransitionTime",
                            "message",
                            "reason",
                            "status",
                            "type"
                          ],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "lineageTip": {
                        "nullable": true,
                        "type": "string"
                      },
                      "observedGeneration": {
                        "description": "Mostly a \"seen it\" marker — the spec is immutable in practice, and `phase != done` is the\nreal idempotency guard. Present because every status in this group carries one, and a\nreader who has to check per kind will eventually check wrong.",
                        "format": "int64",
                        "nullable": true,
                        "type": "integer"
                      },
                      "phase": {
                        "description": "`pending` | `working` | `done` | `error`. A request is never re-run past `done`.",
                        "enum": [
                          "creating",
                          "stopped",
                          "error",
                          "pending",
                          "ready",
                          "running",
                          "working",
                          "done"
                        ],
                        "type": "string"
                      },
                      "snapshotId": {
                        "description": "The registry commit record's id — the snapshot itself.",
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "required": [
                      "phase"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "SnapshotRequest",
                "type": "object"
              }
            },
            "served": true,
            "storage": true,
            "subresources": {
              "status": {}
            }
          }
        ]
      }
    },
