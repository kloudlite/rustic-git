          {
            "additionalPrinterColumns": [
              {
                "jsonPath": ".spec.volume",
                "name": "Volume",
                "type": "string"
              },
              {
                "jsonPath": ".status.phase",
                "name": "Phase",
                "type": "string"
              },
              {
                "jsonPath": ".metadata.creationTimestamp",
                "name": "Age",
                "type": "date"
              }
            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for SnapshotSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "One immutable commit: a btrfs RO snapshot, recorded as a CR before the snapshot is cut so a\nretry finds the object and continues rather than orphaning a subvolume.\n\nNever patched once `status.phase == Ready` — a `Snapshot` is a fact about the past, and the\nonly two things that ever remove one are an explicit delete and GC, same discipline as a\nregistry blob. Distinct from `SnapshotRequest` (the older, still-live push-as-annotation kind\nthis replaces): both exist until the cutover task deletes the old one.",
                    "properties": {
                      "message": {
                        "nullable": true,
                        "type": "string"
                      },
                      "owner": {
                        "type": "string"
                      },
                      "parent": {
                        "default": "",
                        "description": "The parent commit's name, or empty for a root. Order comes ONLY from this chain — nothing\nreads creation timestamps to reconstruct history.",
                        "type": "string"
                      },
                      "pinned": {
                        "default": false,
                        "description": "Keeps this commit out of any future retention sweep. Never cleared by a controller.",
                        "type": "boolean"
                      },
                      "volume": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "owner",
                      "volume"
                    ],
                    "type": "object"
                  },
                  "status": {
                    "nullable": true,
                    "properties": {
                      "phase": {
                        "description": "`Working` until the btrfs subvolume is actually cut; `Ready` is the point past which the\nobject is immutable.",
                        "enum": [
                          "creating",
                          "stopped",
                          "error",
                          "pending",
                          "ready",
                          "running",
                          "working",
                          "done"
                        ],
                        "type": "string"
                      },
                      "sizeBytes": {
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      }
                    },
                    "required": [
                      "phase"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "Snapshot",
                "type": "object"
              }
            },
            "selectableFields": [
              {
                "jsonPath": ".spec.volume"
              }
            ],
            "served": true,
            "storage": true,
