                            "ready"
                          ],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "volumeRef": {
                        "description": "The child `Volume`, reported rather than wished for: the reconciler creates it and then\nsays so here.",
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "required": [
                      "phase"
                    ],
                    "type": "object"
