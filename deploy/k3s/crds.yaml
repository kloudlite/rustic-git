    {
      "apiVersion": "apiextensions.k8s.io/v1",
      "kind": "CustomResourceDefinition",
      "metadata": {
        "name": "clustersettings.rustic-git.io"
      },
      "spec": {
        "group": "rustic-git.io",
        "names": {
          "kind": "ClusterSettings",
          "plural": "clustersettings",
          "singular": "clustersettings"
        },
        "scope": "Cluster",
        "versions": [
          {
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for ClusterSettingsSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "One per region, named `default` — the cluster-scoped tunables every agent in that cluster\nreads on its refresh beat. `spec` is desired (admin-written); `status.observedGeneration`\nis the last generation an agent actually applied, so the UI's \"pending\" marker has\nsomething to compare against. Cluster-scoped like every other kind here: there is one\nobject per region's k3s, not per namespace.",
                    "properties": {
                      "basePackages": {
                        "description": "Packages prepended to every workspace's profile, space-separated.",
                        "nullable": true,
                        "type": "string"
                      },
                      "decommissionSecs": {
                        "description": "Decommission-beat interval. 5..=600 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "defaultImage": {
                        "description": "Tenant workspace pod image. **Boot** — the agent reads this at pod-template render\ntime, not per reconcile; a change rolls `rustic-git-agent` (Task 5). `None` = keep\ntoday's env value, so an admin who never opens this row cannot blank a required image.",
                        "nullable": true,
                        "type": "string"
                      },
                      "defaultReplicas": {
                        "description": "Default `Volume.spec.replicas` for a newly created volume. 1..=5.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "gitInitImage": {
                        "description": "The init container that clones a workspace's seed repo over SSH. **Boot**, same reason.",
                        "nullable": true,
                        "type": "string"
                      },
                      "homeCacheGb": {
                        "description": "Home-cache local subvolume quota per (owner, node). 1..=500 GiB.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "maxPerOwner": {
                        "description": "Max workspaces+environments per owner in this region, until `Quota` fully replaces it.\n1..=1000.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "nixTimeoutSecs": {
                        "description": "Nix build timeout. 60..=7200 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "nixpkgs": {
                        "description": "Nixpkgs revision pin (`github:NixOS/nixpkgs/<rev>`). `None` = whatever the agent's own\nenv default is — this field does not carry a built-in default of its own.",
                        "nullable": true,
                        "type": "string"
                      },
                      "nodeDeadSecs": {
                        "description": "How long a node must be observed NotReady before it is declared dead for placement.\n60..=3600 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "peerReceiveSlack": {
                        "description": "Slack added to the receive-side timeout over the serve-side one. 0..=60 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "peerSendTimeoutSecs": {
                        "description": "`btrfs send`-over-HTTP client timeout. 60..=21600 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "peerServeTimeoutSecs": {
                        "description": "The send side's own deadline, deliberately shorter than the client's. 60..=21600 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "quotaGbCeiling": {
                        "description": "Ceiling `clamp_quota` enforces on a requested quota. 10..=5000 GiB.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "replicaSecs": {
                        "description": "Replication pull beat interval. 30..=3600 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "runtimeClass": {
                        "description": "k8s `runtimeClassName` for tenant pods (e.g. `gvisor`); `None` = host kernel. **Boot**.",
                        "nullable": true,
                        "type": "string"
                      },
                      "stopFlushTimeoutSecs": {
                        "description": "Deadline for a stop's flush before the pod is torn down anyway. 5..=300 seconds.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "syncSecs": {
                        "description": "Sync-point cut beat interval. 10..=3600 seconds. `None` = admin never set it — the reader\nfalls back to env, then the built-in default (`AgentSettings::merged_with`).",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "status": {
                    "nullable": true,
                    "properties": {
                      "observedGeneration": {
                        "description": "The generation an agent last successfully applied. Compared against\n`metadata.generation` by the admin UI's pending marker.",
                        "format": "int64",
                        "nullable": true,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "ClusterSettings",
                "type": "object"
              }
            },
            "served": true,
            "storage": true,
            "subresources": {
              "status": {}
            }
          }
        ]
      }
