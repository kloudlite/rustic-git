      "apiVersion": "apiextensions.k8s.io/v1",
      "kind": "CustomResourceDefinition",
      "metadata": {
        "name": "snapshots.rustic-git.io"
      },
      "spec": {
        "group": "rustic-git.io",
        "names": {
          "kind": "Snapshot",
          "plural": "snapshots",
          "shortNames": [
            "snp"
          ],
          "singular": "snapshot"
        },
        "scope": "Cluster",
        "versions": [
          {
            "additionalPrinterColumns": [
              {
                "jsonPath": ".spec.volume",
                "name": "Volume",
                "type": "string"
              },
              {
                "jsonPath": ".status.phase",
                "name": "Phase",
                "type": "string"
              },
              {
                "jsonPath": ".metadata.creationTimestamp",
                "name": "Age",
                "type": "date"
              }
            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for SnapshotSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "One immutable commit: a btrfs RO snapshot, recorded as a CR before the snapshot is cut so a\nretry finds the object and continues rather than orphaning a subvolume.\n\nNever patched once `status.phase == Ready` — a `Snapshot` is a fact about the past, and the\nonly two things that ever remove one are an explicit delete and GC, same discipline as a\nregistry blob. Replaces the older `SnapshotRequest` push-as-annotation kind, which the cutover\ntask has since deleted — this is the only push record left.",
                    "properties": {
                      "message": {
                        "nullable": true,
                        "type": "string"
                      },
                      "owner": {
                        "type": "string"
                      },
                      "parent": {
                        "default": "",
                        "description": "The parent commit's name, or empty for a root. Order comes ONLY from this chain — nothing\nreads creation timestamps to reconstruct history.",
                        "type": "string"
                      },
                      "pinned": {
                        "default": false,
                        "description": "Keeps this commit out of any future retention sweep. Never cleared by a controller.",
                        "type": "boolean"
                      },
                      "transient": {
                        "default": false,
                        "description": "A sync point, not a commit: cut by the agent's sync beat (or a stop) from a live worktree so a\nreplica holds its latest state. Never a `parent` of anything, never a worktree's `head`, and\nretained ONE per worktree — see `snapshot::retain`. `push` never sets this.",
                        "type": "boolean"
                      },
                      "volume": {
                        "type": "string"
                      },
                      "worktree": {
                        "description": "The Workspace/Environment id whose worktree this commit is cut FROM — a volume can have\nmore than one worktree (a workspace plus a clone still attached, say), so `spec.volume`\nalone does not say which one to snapshot; the creator (Task 6's `/push`) names it. The\ncommit reconciler only acts when THIS field's worktree is the one running on its node.\nRequired, no default: `Snapshot` is a brand-new, flag-gated kind — there are no stored\nobjects predating this field, so the usual back-compat exemption does not apply here.",
                        "type": "string"
                      }
                    },
                    "required": [
                      "owner",
                      "volume",
                      "worktree"
                    ],
                    "type": "object"
                  },
                  "status": {
                    "nullable": true,
                    "properties": {
                      "phase": {
                        "description": "`Working` until the btrfs subvolume is actually cut; `Ready` is the point past which the\nobject is immutable.",
                        "enum": [
                          "creating",
                          "stopped",
                          "error",
                          "pending",
                          "ready",
                          "running",
                          "working",
                          "unavailable",
                          "done"
                        ],
                        "type": "string"
                      },
                      "readyAt": {
                        "description": "When `phase` became `Ready`, RFC3339. The instant a replica's `lastSyncAt` is compared\nagainst to decide whether it holds THIS cut — `lastTransitionTime` on a condition would do,\nbut a `Snapshot` has no conditions.",
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "required": [
                      "phase"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "Snapshot",
                "type": "object"
              }
            },
