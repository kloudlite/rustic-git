                            "properties": {
                              "cloneOf": {
                                "description": "A local snapshot of a sibling on the same pool — no registry round trip.\n\nUnder the commit model (`commit: Some(_)`), `volume` names the SOURCE'S OWN volume (not a\ndestination this object owns) and no child `Volume` is ever created for it: the clone is a\nsecond worktree of the same volume, checked out at `commit` — the head the API resolved\nONCE at clone time, so the clone stays pinned to what the caller saw rather than drifting\nwith the source's later pushes. `None` is every clone written before the commit model (and\nflag-off), which still copies bytes into a fresh child `Volume` via `clone_local_ids`.",
                                "properties": {
                                  "commit": {
                                    "nullable": true,
                                    "type": "string"
                                  },
                                  "volume": {
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "volume"
                                ],
                                "type": "object"
                              },
                              "gitRepo": {
                                "description": "A git repository on this platform, cloned at `branch` into the fresh subvolume by the\nworkspace pod's INIT CONTAINER, not by the agent.\n\nNo credential here and none in a Secret either: the clone runs inside the workspace, over\nSSH, as the owner, with the platform key already mounted at `k8s::USER_KEY_PATH`. The old\n`credential_secret` named a Secret nobody ever wrote and the agent had no permission to\nread — the git-seeding path was dead code that looked wired.",
                                "properties": {
                                  "branch": {
                                    "type": "string"
                                  },
                                  "repo": {
                                    "type": "string"
