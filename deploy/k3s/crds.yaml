            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for VolumeReplicaSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "One node's copy of a volume's commit history — the per-node replica state the commit model\ntracks in place of \"the object store has the only bytes\".\n\nWritten only by `spec.node`'s own controller, with two guarded exceptions: deleting a dead\nnode's replica row and clearing a dead node's claims, both gated on that node being NotReady\nfor longer than `WS_NODE_DEAD_SECS`.",
                    "properties": {
                      "node": {
                        "type": "string"
