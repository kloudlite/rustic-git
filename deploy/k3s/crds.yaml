      "apiVersion": "apiextensions.k8s.io/v1",
      "kind": "CustomResourceDefinition",
      "metadata": {
        "name": "snapshots.rustic-git.io"
      },
      "spec": {
        "group": "rustic-git.io",
        "names": {
          "kind": "Snapshot",
          "plural": "snapshots",
          "shortNames": [
            "snp"
          ],
          "singular": "snapshot"
        },
        "scope": "Cluster",
        "versions": [
          {
            "additionalPrinterColumns": [
              {
                "jsonPath": ".spec.volume",
                "name": "Volume",
                "type": "string"
              },
              {
                "jsonPath": ".status.phase",
                "name": "Phase",
                "type": "string"
              },
              {
                "jsonPath": ".metadata.creationTimestamp",
                "name": "Age",
                "type": "date"
              }
            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for SnapshotSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "One immutable cut — a snapshot or a sync point: a btrfs RO subvolume, recorded as a CR before the snapshot is cut so a\nretry finds the object and continues rather than orphaning a subvolume.\n\nNever patched once `status.phase == Ready` — a `Snapshot` is a fact about the past, and the\nonly two things that ever remove one are an explicit delete and GC, same discipline as a\nregistry blob. Replaces the older `SnapshotRequest` push-as-annotation kind, which the cutover\ntask has since deleted — this is the only push record left.",
                    "properties": {
                      "message": {
                        "nullable": true,
                        "type": "string"
                      },
                      "owner": {
                        "type": "string"
                      },
                      "parent": {
                        "default": "",
                        "description": "The parent cut's name, or empty for a root. Order comes ONLY from this chain — nothing\nreads creation timestamps to reconstruct history.",
                        "type": "string"
                      },
                      "state": {
                        "description": "Absent only on a snapshot cut before 2026-09-03; every reader falls back for `None`.\n\nSchema is hand-written as free-form JSON (`preserve_unknown_state`), not `SnapshotState`'s\nown derived schema: kube-core's CRD generation flattens an internally-tagged enum's `oneOf`\nbranches into one object and panics when a shared property (`kind`) carries a different\n`const` per branch — which is the entire point of a tag. A hand-written *discriminated*\nschema would drift from the type the moment a variant changes, so this stays a plain\n`x-kubernetes-preserve-unknown-fields` object instead of trying to describe the union.\n`serde`'s view of the Rust type is untouched, so round-tripping is exact; only the\n*published* OpenAPI schema for this field is permissive. Because the schema can't validate\nit, a value that doesn't parse as `SnapshotState` must not fail the whole `Snapshot` read —\n`lenient_state` drops it to `None` (with a `tracing::warn!`) rather than taking the agent's\nlist/watch down with it.",
                        "type": "object",
                        "x-kubernetes-preserve-unknown-fields": true
                      },
                      "transient": {
                        "default": false,
                        "description": "A sync point, not a push: cut by the agent's sync beat (or a stop) from a live worktree so a\nreplica holds its latest state. Never a `parent` of anything, never a worktree's `head`, and\nretained ONE per worktree — see `snapshot::retain`. `push` never sets this, which is the\nwhole distinction: `!transient` IS a snapshot (`Snapshot::is_snapshot`), and it is the only\none — an older build wrote a second flag alongside it, which serde ignores on the objects\nstored while it existed.",
                        "type": "boolean"
                      },
                      "volume": {
                        "type": "string"
                      },
                      "worktree": {
                        "description": "The Workspace/Environment id whose worktree this cut is taken FROM — a volume can have\nmore than one worktree (a workspace plus a clone still attached, say), so `spec.volume`\nalone does not say which one to snapshot; the creator (`/push`) names it. The\nsnapshot reconciler only acts when THIS field's worktree is the one running on its node.\nRequired, no default: `Snapshot` is a brand-new, flag-gated kind — there are no stored\nobjects predating this field, so the usual back-compat exemption does not apply here.",
                        "type": "string"
                      }
                    },
                    "required": [
                      "owner",
                      "volume",
                      "worktree"
                    ],
                    "type": "object"
                  },
                  "status": {
                    "nullable": true,
                    "properties": {
                      "phase": {
                        "description": "`Working` until the btrfs subvolume is actually cut; `Ready` is the point past which the\nobject is immutable.",
                        "enum": [
                          "creating",
                          "stopped",
                          "error",
                          "pending",
                          "ready",
                          "running",
                          "working",
                          "unavailable",
                          "done"
                        ],
                        "type": "string"
                      },
                      "readyAt": {
                        "description": "When `phase` became `Ready`, RFC3339 — `lastTransitionTime` on a condition would do, but a\n`Snapshot` has no conditions.",
                        "nullable": true,
                        "type": "string"
                      }
                    },
                    "required": [
                      "phase"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "Snapshot",
                "type": "object"
              }
            },
            "selectableFields": [
              {
                "jsonPath": ".spec.volume"
              }
            ],
            "served": true,
            "storage": true,
            "subresources": {
              "status": {}
            }
          }
        ]
      }
    },
