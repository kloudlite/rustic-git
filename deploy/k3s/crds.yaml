              }
            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for VolumeSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "properties": {
                      "nodeName": {
                        "description": "Copied ONCE from the parent's `status.nodeName` when the parent's controller creates this\nchild (`ensure_child_volume`) — the node whose `VolumeReplica` claim won (Synced decides\nplacement now; there is no owner→node pin). A pod's affinity is derived from this and never\nchosen independently — two places allowed to name a node is two places that can disagree\nabout where the data is.",
                        "type": "string"
                      },
                      "owner": {
                        "type": "string"
                      },
                      "quotaGb": {
                        "format": "uint64",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "region": {
                        "type": "string"
                      },
                      "replicas": {
                        "default": 2,
                        "description": "How many nodes should hold a synced copy of this volume's snapshots — the replacement\nfor \"one node has the only bytes\". Defaulted so every `Volume` written\nbefore this field existed keeps parsing; the reconciler that creates `VolumeReplica`\nchildren treats a missing field the same as an explicit 2.",
                        "format": "uint32",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "restoreTo": {
                        "description": "Written by the PARENT's reconciler, never by a user: restoring in place under a running\nservice is how a database ends up with a half-old disk, so the parent scales down first and\nonly then asks for this.",
                        "nullable": true,
                        "properties": {
                          "owner": {
                            "description": "The registry owner LABEL of `volume` (a team slug for a team's environment). Absent means\nthe destination's own owner, which is every personal restore.",
                            "nullable": true,
                            "type": "string"
                          },
                          "region": {
                            "nullable": true,
                            "type": "string"
                          },
                          "requestedAt": {
                            "default": "",
                            "description": "RFC-3339, written by the API. The only thing that distinguishes \"restore this snapshot\nagain\" from \"already done\".",
                            "type": "string"
                          },
                          "snapshotId": {
                            "type": "string"
                          },
                          "volume": {
                            "description": "The volume the RECORD lives under, which is not always the volume being restored INTO — a\nrestore can graft another volume's snapshot in place.",
                            "type": "string"
                          }
                        },
                        "required": [
                          "snapshotId",
                          "volume"
                        ],
                        "type": "object"
                      },
                      "source": {
                        "nullable": true,
                        "oneOf": [
                          {
                            "required": [
                              "cloneOf"
                            ]
                          },
                          {
                            "required": [
                              "seededFrom"
                            ]
                          },
                          {
                            "required": [
                              "gitRepo"
                            ]
                          }
                        ],
                        "properties": {
                          "cloneOf": {
                            "description": "A local snapshot of a sibling on the same pool — no registry round trip.\n\nWith `commit: Some(_)`, `volume` names the SOURCE'S OWN volume (not a\ndestination this object owns) and no child `Volume` is ever created for it: the clone is a\nsecond worktree of the same volume, checked out at `commit` — the graft point the API\nresolved ONCE at clone time, so the clone stays on what the caller saw rather than drifting\nwith the source's later pushes. `None` is every clone written before shared-volume clones\nexisted, which still copies bytes into a fresh child `Volume` via `clone_local_ids`.",
                            "properties": {
                              "commit": {
                                "nullable": true,
                                "type": "string"
                              },
                              "volume": {
                                "type": "string"
                              }
                            },
                            "required": [
                              "volume"
                            ],
                            "type": "object"
                          },
                          "gitRepo": {
                            "description": "A git repository on this platform, cloned at `branch` into the fresh subvolume by the\nworkspace pod's INIT CONTAINER, not by the agent.\n\nNo credential here and none in a Secret either: the clone runs inside the workspace, over\nSSH, as the owner, with the platform key already mounted at `k8s::USER_KEY_PATH`. The old\n`credential_secret` named a Secret nobody ever wrote and the agent had no permission to\nread — the git-seeding path was dead code that looked wired.",
                            "properties": {
                              "branch": {
                                "type": "string"
                              },
                              "repo": {
                                "type": "string"
                              }
                            },
                            "required": [
                              "branch",
                              "repo"
                            ],
                            "type": "object"
                          },
                          "seededFrom": {
                            "description": "A clone of a source whose node is DOWN: its OWN volume, seeded from a read-only copy of\n`snapshot` that the claiming node already holds locally (`{pool}/vol/{volume}/snap/{id}`).\n\n`CloneOf{commit: Some(_)}` cannot serve this case: it makes the clone a second worktree of\nthe SOURCE'S volume, which is pinned to the dead node, so the peer holding the cut settles\n`Degraded=NodeMismatch` and the clone never starts. Here `volume` is read ONLY as the place\nto copy bytes from — the clone owns a fresh child `Volume` on the claiming node and takes no\npin on the source's — which is why the interrupted branch of `/v1`'s clone writes this and\nnothing else does.",
                            "properties": {
                              "snapshot": {
                                "type": "string"
                              },
                              "volume": {
                                "type": "string"
                              }
                            },
                            "required": [
                              "snapshot",
                              "volume"
                            ],
                            "type": "object"
                          }
                        },
                        "type": "object"
                      },
                      "team": {
                        "default": "",
                        "description": "Same meaning as `WorkspaceSpec::team`; carried here because the controller materializes a\nvolume before its workspace exists and needs the namespace for the git credential.",
                        "type": "string"
                      }
                    },
                    "required": [
                      "nodeName",
                      "owner",
                      "quotaGb",
                      "region"
                    ],
                    "type": "object"
                  },
                  "status": {
                    "nullable": true,
                    "properties": {
                      "conditions": {
                        "items": {
                          "description": "Condition contains details for one aspect of the current state of this API Resource.",
                          "properties": {
                            "lastTransitionTime": {
                              "description": "lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.",
                              "format": "date-time",
                              "type": "string"
                            },
                            "message": {
                              "description": "message is a human readable message indicating details about the transition. This may be an empty string.",
                              "type": "string"
                            },
                            "observedGeneration": {
                              "description": "observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.",
                              "format": "int64",
                              "type": "integer"
                            },
                            "reason": {
                              "description": "reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.",
                              "type": "string"
                            },
                            "status": {
                              "description": "status of the condition, one of True, False, Unknown.",
                              "type": "string"
                            },
                            "type": {
                              "description": "type of condition in CamelCase or in foo.example.com/CamelCase.",
                              "type": "string"
                            }
                          },
                          "required": [
                            "lastTransitionTime",
                            "message",
                            "reason",
                            "status",
                            "type"
                          ],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "observedGeneration": {
                        "description": "Stamped from `metadata.generation` so a reconcile can tell \"already done\" from \"not yet\nseen\" — the difference between an idle requeue and a duplicated btrfs send.",
                        "format": "int64",
                        "nullable": true,
                        "type": "integer"
                      },
                      "phase": {
                        "description": "Every lifecycle state any of the five kinds reports, as ONE enum.\n\nAn enum rather than a `String` so schemars emits `enum` and the API server rejects a typo with a\n422. A free-form string is how `running` reached a `WsState` that spells that state `Ready`: the\nprojection's `serde_json::from_value` fell back to its default, so a healthy workspace showed\n\"Creating\" in the UI indefinitely, with nothing failing and nothing logged.\n\nOne enum for five kinds rather than five, because the alternative is five near-identical types\nand a `phase` field whose type a reader has to look up per kind. Which variants are legal for\nwhich kind is the reconciler's business; the schema's job is to refuse a word nobody defined.",
                        "enum": [
                          "creating",
                          "stopped",
                          "error",
                          "pending",
                          "ready",
                          "running",
                          "working",
                          "unavailable",
                          "done"
                        ],
                        "type": "string"
                      },
                      "restoreRequestedAt": {
                        "description": "The `requestedAt` of the wish that put `restoredTo` there. Both halves, or restoring the\nSAME snapshot a second time is a silent no-op — which is exactly what someone does after\nundoing a restore by hand, or after a bad afternoon of changes.",
                        "nullable": true,
                        "type": "string"
                      },
                      "restoredTo": {
                        "description": "The snapshot id last materialized INTO `live`. `spec.restoreTo.snapshotId` == this is the\nwhole \"already done\" test, on both sides: the Volume does not restore again and the parent\nscales its services back up.",
                        "nullable": true,
                        "type": "string"
                      },
                      "subvolumePresent": {
                        "default": false,
                        "type": "boolean"
                      }
                    },
                    "required": [
                      "phase"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "Volume",
                "type": "object"
              }
            },
            "selectableFields": [
