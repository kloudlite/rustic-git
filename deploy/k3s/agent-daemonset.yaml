# The node controller, one pod per worker node.
#
# It is privileged and mounts the host's btrfs pool, which is unusual for a workload and deliberate
# here: this process IS the node's storage driver. It runs `btrfs subvolume create|snapshot|send|
# receive|delete` against `/wspool-prod`, and those calls need real root on the host filesystem, not
# a namespaced approximation.
#
# `mountPropagation: Bidirectional` is the subtle part and the one that fails silently when missing.
# A subvolume this pod creates — or a block image it loop-mounts during a restore — must become
# visible in the HOST's mount namespace, because the kubelet is what binds it into a workspace pod
# afterwards. Without bidirectional propagation those mounts stay private to this container and the
# workspace pod mounts an empty directory: no error anywhere, just missing data.
#
# It lives in kube-system, which is `privileged` under Pod Security Admission by default. The
# namespaces this controller CREATES are `baseline` (see k8s::namespace) — user workloads never get
# what this pod has.
#
# Roll order for the controller-ownership change (2026-08-27), and it is not the usual one:
#
#   1. kubectl delete workspace ws-16980a570dd6eecd   # the stuck one; it predates status.nodeName
#   2. kubectl apply -f deploy/k3s/crds.yaml          # BEFORE the agent, or the new watches 404
#   3. kubectl apply -f deploy/k3s/{agent,api}-rbac.yaml
#   4. kubectl apply -f deploy/k3s/agent-daemonset.yaml
#
# Steps 2 and 4 are ONE step operationally, not two changes with a pause between them: the old
# agent's Workspace/Environment watch 4xx's for the window between them, so the window is made as
# short as a second `kubectl apply` allows.
#
# The CRDs first because the agent's placement watch selects on `.status.nodeName`, which does not
# exist as a selectable field until the CRD carries it — a watch on an undeclared selectable field
# is refused, and the agent would come up converging nothing while reporting healthy. Removing
# `.spec.nodeName` from `selectableFields` while a client still uses that selector answers 400, not
# an empty list, which is the other half of why the agent and the CRDs move together. The agent's
# startup migration adopts existing Volumes and backfills history on its first boot after step 4.
#
# This is RELEASE 1: the CRD still carries `spec.nodeName`/`spec.volumeRef` as optional fields.
# Release 2 (Task 11) drops them, and only after every node has rolled — see that task's gate.
# Release 1 can be rolled back (old agents ignore the new status fields); release 2 cannot.
#
# The full runbook, with the api roll and the post-roll check, is in this directory's README under
# "Release 1: controller ownership".
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kloudlite-agent
  namespace: kube-system
  labels:
    app: kloudlite-agent
spec:
  selector:
    matchLabels:
      app: kloudlite-agent
  template:
    metadata:
      labels:
        app: kloudlite-agent
      # Plain scrape annotations, no Prometheus Operator assumed (a ServiceMonitor would need the
      # CRD installed first; kube-prometheus-stack and the Azure managed agent both honour these).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # `nsenter -t 1` in mount_homes needs to SEE pid 1, so the agent shares the host's pid
      # namespace. Deliberately NOT hostNetwork: the shared-home mount must live in the node's
      # network namespace to outlive an agent restart, but the POD must stay in its own, or the
      # `agent-peer` NetworkPolicy — the only thing restricting the peer listener on 8444 to other
      # agents — stops applying to it. hostPID buys the first without giving up the second.
      hostPID: true
      serviceAccountName: kloudlite-agent
      # Only nodes that carry a btrfs pool. The control plane has none and must not run this.
      nodeSelector:
        kloudlite.io/pool: "true"
      tolerations:
        - key: kloudlite.io/role
          operator: Exists
          effect: NoSchedule
      # A restart must not orphan a btrfs send mid-stream; give it room to finish or be killed
      # cleanly rather than yanked at the default 30s.
      terminationGracePeriodSeconds: 120
      initContainers:
        # "Create a Nix store on the host": the image's own store is copied onto the host's /nix
        # once. After that both containers below mount the HOST store, and the `nix` the agent
        # runs is the one in it — a client that lives outside the store it talks to cannot exist.
        #
        # Pinned by digest, here and on nix-daemon below, the same digest for both: a tag is a
        # pointer Docker Hub can move, and this copy is the ancestor of every workspace's
        # toolchain on the node — two nodes seeded on different days from a moved tag would have
        # different host stores despite the comment on WS_BASE_PACKAGES. The tag stays in the
        # reference for humans; the digest is what the kubelet pulls. Looked up 2026-08-29 with
        #   docker manifest inspect -v nixos/nix:2.24.10 | grep -m1 '"digest"'
        # (linux/amd64 is the only platform the tag publishes, so that is the image digest, not
        # an index). Without docker: `crane digest nixos/nix:2.24.10`, or
        #   TOK=$(curl -s 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:nixos/nix:pull' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
        #   curl -sI -H "Authorization: Bearer $TOK" -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' https://registry-1.docker.io/v2/nixos/nix/manifests/2.24.10 | grep -i docker-content-digest
        # Bumping the nix version means re-running the lookup and changing both lines together.
        #
        # No securityContext: it copies files onto a hostPath and needs nothing beyond the root
        # the image already runs as.
        - name: seed-store
          image: nixos/nix:2.24.10@sha256:9a708cad473e5bdb278b9386c010684c63bfc99ac865d3ae00484ebfc05ad71a
          command: ["/bin/sh", "-c", "if [ ! -e /host-nix/store ]; then cp -a /nix/. /host-nix/; fi; mkdir -p /host-nix/var/kloudlite/profiles"]
          volumeMounts:
            - name: nix
              mountPath: /host-nix
      containers:
        - name: agent
          # Pinned to the commit CI built, not `:latest`. A DaemonSet on `:latest` re-resolves the
          # tag on every pod recreate, so two nodes can silently end up on different builds.
          #
          # No imagePullSecret: the package is public, like the repository. That is deliberate —
          # the image carries no secret, and a cluster-wide pull credential is one more thing to
          # scope, rotate and leak.
          image: ghcr.io/kloudlite/kloudlite-agent:42e27941291d635d1d1088cdb3057c042eff2232@sha256:2e0a4d8c471bb2630250ab1baf61cf440b0515368fe24ccde957b663cc00cded
          # Safe with an immutable SHA tag, and it means kubelet image GC evicting the layers costs
          # one re-pull rather than a broken DaemonSet — which is what the hand-shipped tarball did.
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          # Requests only, no memory limit, on purpose: a restore still reads whole layers into
          # memory (audit P-12), so a limit set without a measured push is an OOM-kill mid-stream
          # — the one failure this pod must never have. Set the limit after measuring
          # `memory.current` through a large restore; the request is what keeps the scheduler
          # from packing tenant pods into the room this one needs.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          env:
            # JSON events, so the collector gets level/module/fields as columns (crates/core/src/log.rs).
            - name: KLOUDLITE_LOG_FORMAT
              value: json
            - name: KLOUDLITE_METRICS_ADDR
              value: 0.0.0.0:9464
            # The shard key. The controller refuses to start without it rather than watching every
            # node's objects — see lib.rs's check.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: WS_POOL
              value: /wspool-prod
            # The region's shared-home NFS export —
            # `run()` mounts it at `{pool}/homes` once at agent startup, before the controller
            # starts. Unset means this node serves no shared home (fail closed, see lib.rs).
            # Azure Files Premium (NFS 4.1), account kloudlite-homes in rustic-git-k3s, reachable
            # only from the `nodes` subnet through its service endpoint. Per region: the homes are
            # region-local by design, so each region gets its own share.
            - name: WS_HOMES_EXPORT
              value: kloudlitegithomes.file.core.windows.net:/kloudlitegithomes/homes
            # `WS_RUNTIME_CLASS=gvisor` is deliberately NOT set here. Unset, tenant pods run under
            # runc and share the host kernel (audit S-29); set, every tenant pod names the
            # `gvisor` RuntimeClass and stays Pending on any node that cannot serve it. So it is
            # per-cluster, and goes in the `kloudlite-agent` Secret next to WS_REGION (an inline
            # env would override envFrom, same as WS_REGION) only once EVERY pool node has had
            # install-gvisor.sh run, carries `kloudlite.io/gvisor=true` (runtimeclass.yaml's
            # nodeSelector) and runtimeclass.yaml is applied. Verify after the agent restarts:
            #   kubectl get pod -n ws-<owner> -o jsonpath='{.items[*].spec.runtimeClassName}'
            # prints `gvisor`, and `dmesg` inside a workspace prints gVisor's banner.
            # Where a `GitRepo` workspace's init container clones from, over SSH, with the
            # owner's platform key. The repo is `owner/name`, never a URL, so this is the only
            # thing that decides which host is reachable — a workspace cannot be pointed at an
            # arbitrary endpoint.
            - name: WS_GIT_SSH_HOST
              value: git.khost.dev
            - name: WS_GIT_SSH_PORT
              value: "22"
            # Pinned, so seeding works whatever image the workspace itself runs.
            - name: WS_GIT_INIT_IMAGE
              value: alpine/git:2.45.2@sha256:16ad8e788e1d3b0c30f18da8dde5c0ace3b187445a62d8af893b003ca1e70592
            # `WS_REGION` comes from the `kloudlite-agent` Secret: it names the region whose blob
            # container this node reads and writes, and is half of an `OwnerBinding`'s identity
            # (controller/mod.rs). A node pointed at the wrong region cannot see snapshots pushed
            # by its neighbours. Never set it inline here — an explicit env silently overrides
            # `envFrom`.
            - name: RUST_BACKTRACE
              value: "1"
            # The nixpkgs every profile on this node is built against. Rolling it rebuilds every
            # workspace's profile on its next pass (a cache download, not a compile).
            - name: WS_NIXPKGS
              value: github:NixOS/nixpkgs/c27cdad491a991b11ed731760aa2ef8db0cb0410
            - name: WS_NIX_TIMEOUT
              value: "1200"
            # Nix's evaluation cache. Without this it lands in the container's overlay and dies
            # with the pod, so the first profile build after every agent roll re-fetches and
            # re-evaluates nixpkgs — measured at 28 s, against 0.3 s warm. `/nix` is a hostPath
            # this container already mounts, so the cache outlives the pod. ~400 MB.
            - name: XDG_CACHE_HOME
              value: /nix/var/kloudlite/cache
            # What every workspace gets before its own list. Explicit here rather than the
            # binary's default so a change is a yaml diff someone reviews, and so the two nodes
            # cannot drift: the set is part of every profile's hash.
            # What `ws-{id}` runs when a workspace names no image: the platform's own image,
            # pinned to the same SHA as this agent by pin.sh. Legacy specs that still say
            # `alpine:3.20` are mapped to it too (`model::is_default_image`).
            - name: WS_DEFAULT_IMAGE
              value: ghcr.io/kloudlite/kloudlite-workspace:42e27941291d635d1d1088cdb3057c042eff2232@sha256:82b7430d030c648e64cc4c557aaf3d30f7713c16c37a8fd7bee98ab973d6099e
            - name: WS_BASE_PACKAGES
              value: "bashInteractive zsh fish starship coreutils git openssh curl less which gnugrep gnused findutils"
            - name: WS_REPLICA_SECS
              value: "300"
            # How often the sync beat checks each running worktree's btrfs generation and cuts a
            # transient Snapshot if it moved — the only thing that gives a replica anything to
            # fetch between pushes (sync.rs). Idle worktrees cost one `btrfs subvolume show` per
            # interval, so this can run far hotter than WS_REPLICA_SECS.
            - name: WS_SYNC_SECS
              value: "60"
            # Bind address for the peer listener (btrfs send over HTTP, agent-to-agent). Port
            # 8444 is a plain hostPath-style pod IP; discovery is by pod IP from the API (agent-peer
            # .yaml), so no ClusterIP Service exists for it. Fail-closed even if this changes: the
            # listener only starts when WS_PEER_SECRET (below) is non-empty — see peer/mod.rs.
            - name: WS_PEER_ADDR
              value: 0.0.0.0:8444
            # WS_NODE_DEAD_SECS (peer/placement.rs) defaults to 180 s — how long another node must be
            # observed NotReady before this one reaps its VolumeReplica rows and takes over.
            # No override here: the code default is the value the cluster runs.
            # How often a node labelled `kloudlite.io/decommission=true` runs the drain beat
            # (decommission.rs): tell its running worktrees the next start lands elsewhere, release
            # each volume as it becomes stopped-and-replicated, and rewrite its own
            # `kloudlite.io/decommission-status` annotation. Every other node pays one node LIST
            # per interval and nothing else, which is why it can be this hot.
            - name: WS_DECOMMISSION_SECS
              value: "30"
            # Ceiling on one btrfs send to a peer; the escape hatch for a stream that hangs rather
            # than fails, so the beat moves on to the next source (peer/pull.rs).
            - name: WS_PEER_SEND_TIMEOUT_SECS
              value: "3600"
            # The SOURCE-side bound on one streamed `btrfs send`. Shorter than the puller's
            # WS_PEER_SEND_TIMEOUT_SECS on purpose: the send lock is per volume, so a stalled
            # puller otherwise blocks that volume's replication fleet-wide for the client's hour.
            - name: WS_PEER_SERVE_TIMEOUT_SECS
              value: "900"
          envFrom:
            # `WS_REGION` (which region this node belongs to, matched against the `Region` CRD)
            # and WS_PEER_SECRET below. Absent keys leave the engine in its dev fallbacks, which is
            # why this is a Secret and not inline.
            #
            # WS_PEER_SECRET lives here too, not as a plain env value: it authenticates the peer
            # listener (btrfs send) AND gates the puller — unset, `lib.rs` never spawns the
            # listener and `peer/pull.rs`'s beat sends nothing, so replication is fail-closed by the
            # same key that would otherwise let any pod on the cluster (peer 8444 is reachable from
            # every namespace absent the NetworkPolicy in agent-peer.yaml) drive a btrfs send.
            #
            # A snapshot is restorable only in the region it was pushed in: this node reads its own
            # region's container and nothing else. Restoring elsewhere means pushing again from a
            # node in the destination region. See README "Two things that bite".
            - secretRef:
                name: kloudlite-agent
                optional: true
          ports:
            - name: peer
              containerPort: 8444
              protocol: TCP
          volumeMounts:
            - name: pool
              mountPath: /wspool-prod
              mountPropagation: Bidirectional
            # btrfs send/receive and loop-mounting a restored block image both need the host's
            # device nodes.
            - name: dev
              mountPath: /dev
            # The host store seeded by seed-store, shared with the nix-daemon container below.
            - name: nix
              mountPath: /nix
            - name: nix-conf
              mountPath: /etc/nix
          livenessProbe:
            # The controller touches this file on every reconcile tick. A watch that silently
            # stopped delivering looks exactly like an idle cluster from outside — this is what
            # tells the two apart. 5 minutes of no tick is well past the 15s requeue interval.
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /wspool-prod/.agent-heartbeat) )) -lt 300
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
        - name: nix-daemon
          # The SAME digest as seed-store: the daemon must be the version that wrote the store.
          image: nixos/nix:2.24.10@sha256:9a708cad473e5bdb278b9386c010684c63bfc99ac865d3ae00484ebfc05ad71a
          command: ["/nix/var/nix/profiles/default/bin/nix-daemon"]
          # Privileged for the build sandbox's user namespaces; the pod already is.
          # ponytail: SYS_ADMIN is the most the sandbox's mount/unshare calls need (audit I-15),
          # but `privileged: false` + `capabilities.add: [SYS_ADMIN]` is untested against the
          # node's seccomp/AppArmor defaults, and a wrong guess breaks every profile build on the
          # node. Try it on one node with a workspace create as the test before changing it here.
          securityContext:
            privileged: true
          # The container that runs builds shares the node with tenant pods, and the agent beside it
          # already carries a request. Unbounded, a profile build starves the workspaces on the node
          # it is building for. The 9Mi we measured on 2026-09-02 was the idle daemon with nothing
          # building; the number that matters is the evaluator's, not the daemon's — a nixpkgs
          # evaluation runs 1.5-3 GiB and nix-conf allows max-jobs = 2, so the limit has to cover
          # two concurrent evaluations. No CPU limit — a throttled build just runs slower, it
          # doesn't need to be killed.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: nix
              mountPath: /nix
            - name: nix-conf
              mountPath: /etc/nix
          livenessProbe:
            exec:
              command: ["/nix/var/nix/profiles/default/bin/nix", "store", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 60
      volumes:
        - name: pool
          hostPath:
            path: /wspool-prod
            # `Directory`, not `DirectoryOrCreate`: if the pool is not mounted, the controller must
            # fail loudly rather than quietly writing workspaces onto the node's root disk.
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: nix
          hostPath:
            path: /nix
            type: DirectoryOrCreate
        - name: nix-conf
          configMap:
            name: kloudlite-nix
