# The StorageClass every workspace and environment volume binds through.
#
# Static, not dynamic: `no-provisioner` means nothing creates storage on demand. The controller
# creates one `local` PersistentVolume per btrfs subvolume it has already made, and the claim binds
# to that PV by name. A dynamic provisioner would pick its own directory, which is precisely what we
# do not want — the whole point is that the volume IS the subvolume the snapshot engine manages.
#
# `WaitForFirstConsumer` is load-bearing. With the default `Immediate`, a claim binds to a PV as
# soon as it is created, before any pod exists — so the scheduler is handed a volume already pinned
# to a node and must work around it. Deferring the bind until a pod is scheduled lets the scheduler
# consider the PV's node affinity as one input among many, and a pod that cannot be placed says so
# instead of binding wrongly and failing later.
#
# `Retain` decides what happens to a user's data when their claim goes away, and it must never be
# `Delete`: reclaiming a subvolume is a deliberate controller action behind the finalizer, not
# something the kubelet does as a side effect of a namespace being cleaned up.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rustic-git-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
