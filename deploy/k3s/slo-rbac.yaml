# The SLO probe's identity on a region cluster. Its kubeconfig is minted from this ServiceAccount
# the way the api tier's is (README, "Rotating the api tier's kubeconfig") and stored on AKS as
# `kloudlite-slo-k3s-kubeconfig`. The header table IS the role: one row per call the probe
# makes on this cluster, and nothing the api tier's own role would let it write.
#
# | Call                                          | Rule                                              |
# | --------------------------------------------- | ------------------------------------------------- |
# | wait for Ready/Replicated, list worktrees     | workspaces, environments: get, list                |
# | volume history, orphan collection             | volumes, snapshots: get, list                      |
# | exec the home write, read /home/kl on 2nd node| pods: get, list · pods/exec: create, get           |
# | wait for an environment's service replica     | statefulsets: get, list                            |
# | the fast suite yields while the agent rolls   | daemonsets: get, list                              |
# | ws.replicated names the peer that holds a cut | volumereplicas: get, list                          |
# | the keys projection lands and the agent acks  | ownerkeys: get, list, watch                        |
# | env.attach.pair reads the attach-{ws} policy  | networkpolicies: get, list                         |
# | cordon (weekly), taint (monthly), drill label | nodes: get, list, patch                            |
# | the namespace quota `owner-quota` is projected| resourcequotas: get, list                          |
# | team.namespace.reaped: the wt- namespace is gone| namespaces: get, list                            |
# | teardown deletes the requests this run opened | requests, quotarequests: get, list, delete         |
# | the roll guard reads gateway/builder-gate     | deployments: get, list                             |
# | sec.agent.spec dry-runs a patch AS the agent  | serviceaccounts: impersonate, the agent SA only    |
#
# There is no `pods: delete`: the monthly dead-node drill is a hard skip
# (`bins/slo/src/stages/monthly/nodes.rs`, `c.skip("drill.dead.node", …)`), so the
# `kloudlite-slo-drill` Role and its binding — delete on every pod in kube-system, the agent
# DaemonSet's included — were a standing grant for a call nothing makes. Restore them with the
# drill, not before.
#
# `pods/exec` is cluster-wide because a workspace pod lives in `ws-slo-probe` and an environment's
# in `env-{id}`, a namespace that exists for one run — a per-namespace Role could not be written
# ahead of time. The probe only ever execs into pods it created (`run-{id}` names).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudlite-slo
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-slo
rules:
  # `volumereplicas`: `ws.replicated` reads the peer's OWN claim — `status.branches[worktree]`
  # naming the cut — rather than trusting the owner's `Replicated` condition, because that field is
  # what `may_claim` reads before it lets a stopped worktree start elsewhere.
  - apiGroups: ["kloudlite.io"]
    resources: ["workspaces", "environments", "volumes", "snapshots", "volumereplicas"]
    verbs: ["get", "list"]
  # Its own rule rather than a sixth resource above: the keys journey WAITS for the agent's ack,
  # so it needs `watch`, and nothing else the probe reads does.
  - apiGroups: ["kloudlite.io"]
    resources: ["ownerkeys"]
    verbs: ["get", "list", "watch"]
  # `requests`/`quotarequests`: a decided request is still an OBJECT — there is no delete on any
  # tier, only a superadmin decision — so teardown deletes the ones this run opened, by recorded id
  # or by a reason carrying the run prefix. Never by owner: another run may be mid-decision. A
  # region had collected 305 of these before this grant existed.
  - apiGroups: ["kloudlite.io"]
    resources: ["requests", "quotarequests"]
    verbs: ["get", "list", "delete"]
  # The dry-run spec patch in `sec.agent.spec` is issued while impersonating the agent, so the
  # verb the probe itself needs on workspaces is `patch` — the admission policy is what refuses
  # it, and that refusal is the sample. A real patch would need the finalizer/label carve-outs
  # the agent has, which the probe does not.
  - apiGroups: ["kloudlite.io"]
    resources: ["workspaces"]
    verbs: ["patch"]
  - apiGroups: [""]
    # `resourcequotas`: `ws.quota.namespace` reads the `owner-quota` the OwnerBinding projects into
    # the owner's namespace — the documented HARD stop for cpu and memory, which nothing proved
    # existed, let alone matched the owner's `Quota`.
    #
    # `namespaces`: `team.namespace.reaped` asserts the `wt-` namespace of the team this run
    # deleted is gone, which means enumerating them cluster-wide. Read-only, and the probe holds
    # no `delete` on one — the api's resync beat is what reaps them.
    resources: ["pods", "resourcequotas", "namespaces"]
    verbs: ["get", "list"]
  # An environment's service is a StatefulSet; `env.create.p95` is done when its replica is ready,
  # which the probe reads from the StatefulSet's status rather than guessing from the pod.
  # `daemonsets`: the fast suite's rollout yield reads `kloudlite-agent`'s
  # updatedNumberScheduled/numberReady against desiredNumberScheduled — a run that starts while the
  # region's agents are rolling would measure the roll, so it skips every id instead.
  # `deployments`: the roll guard reads the region's `kloudlite-gateway` and
  # `kloudlite-builder-gate` before every stage and on every failed step; without this it logged
  # `slo.rollout.check.failed` on every check and never skipped a roll-time sample (2026-09-11).
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    # `get` as well as `create`: the WebSocket exec the kube crate speaks is a GET upgrade, and
    # the API server authorizes it as `get` on pods/exec — `create` alone answers 403.
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # The environment-side half of an attachment is a NetworkPolicy in the environment's own
  # namespace, and `env.attach.pair` is the id that says `delete_ws` removes it — there is no API
  # anywhere that reports one, so it has to be read from Kubernetes. Read-only, and cluster-wide
  # for the same reason `pods/exec` is: `env-{id}` is a namespace that exists for one run.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  # `nodes: patch` is the widest grant on this role and it cannot be narrowed by RBAC: the API
  # server authorizes a patch by resource and name, never by which FIELD or label it touches, and
  # the drills choose their node at run time (`monthly::idle_node`), so there is no `resourceNames`
  # list to write. What bounds it instead lives in the probe: every mutation goes through
  # `bins/slo/src/drill.rs`, which pairs each one with its undo, writes the taint as a JSON patch
  # of the single `kloudlite.io/slo-drill` taint rather than a merge of the whole array, and marks
  # the node with `kloudlite.io/slo-drill={run}` so only the run that made a mark can sweep it
  # (2026-09-12). Fencing this properly needs a ValidatingAdmissionPolicy on nodes, not a role.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # KEPT, deliberately, after batch 2.3 (2026-09-12). The intended replacement was a
  # SelfSubjectAccessReview, and it cannot do this job: SSAR answers what RBAC allows, while
  # `sec.agent.spec` measures what the ValidatingAdmissionPolicy REFUSES — two different layers,
  # and the policy only runs on a real (dry-run) write as the agent. Dropping the grant would turn
  # the id into a permanent skip, which is a security check nobody is making dressed as a tidier
  # role. Narrow it the only way that is left — `resourceNames` pins it to the agent's own
  # ServiceAccount — and revisit if the admission policy ever grows a dry-run-as-me surface.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
    resourceNames: ["kloudlite-agent"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudlite-slo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlite-slo
subjects:
  - kind: ServiceAccount
    name: kloudlite-slo
    namespace: kube-system
