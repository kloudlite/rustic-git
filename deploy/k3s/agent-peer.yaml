# Peer replication listener policy.
#
# Every `kloudlite-agent` pod carries `app: kloudlite-agent` (agent-daemonset.yaml's own pod
# label) and a real routable pod IP — that IP is reachable from every pod in the cluster,
# workspace pods included, until this policy is applied. `WS_PEER_SECRET` (see the daemonset)
# is what authenticates a request that does arrive; this NetworkPolicy is what stops the request
# arriving from an untrusted namespace at all, so the two are meant to land together.
#
# Scope, stated so nobody over-reads it: a NetworkPolicy with `policyTypes: [Ingress]` selecting
# these pods denies ALL other ingress to them, not just what its rules name — so this file must
# list every port the agent serves, and the metrics rule below is not optional decoration: without
# it the `prometheus.io/scrape` on 9464 in the daemonset stops working the moment this is applied.
# NetworkPolicies are additive, so a later policy selecting these pods with a broader `from`
# silently widens this one.
#
# No Service object here, on purpose: the sender discovers standby targets by pod IP straight
# from the Kubernetes API (the same rendezvous-over-`nodes list` the RBAC comment in
# agent-rbac.yaml describes), never through DNS or a ClusterIP. A Service in front of a DaemonSet
# whose members are each other's clients — not a shared frontend — would only be an unused object
# to keep in sync.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-peer
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: kloudlite-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kloudlite-agent
      ports:
        - protocol: TCP
          port: 8444
    # The OTel agent collector (deploy/k3s/otel-agent.yaml) scrapes the agent's 9464. It runs in
    # kube-system, so this selects that namespace and that pod rather than the `monitoring` one
    # that never existed — while that rule stood, nothing could reach 9464 and the agent's gauges
    # went nowhere. Both selectors are in ONE `from` entry on purpose: as two entries they would
    # be OR'd, and `namespaceSelector: kube-system` alone admits every pod in kube-system.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: kloudlite-otel-agent
      ports:
        - protocol: TCP
          port: 9464
