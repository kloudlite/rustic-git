# ZeroFS serves EVERY owner's home in the region over NFSv3, and NFSv3 with AUTH_SYS and `nolock`
# (see `mount_homes`) authenticates nothing at all — so "who can reach 2049" IS the authorization,
# and this policy is what makes that set the cluster's own NODES rather than every pod in it.
# The gateway shares this namespace but is unaffected: its ingress is a node `hostPort`, which
# NetworkPolicy does not gate (see gateway.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zerofs-nfs-from-agents
  namespace: kloudlite-git-system
spec:
  # `app: zerofs` is the SOLE selector for the export pod — nothing else keys off that label.
  podSelector:
    matchLabels:
      app: zerofs
  policyTypes:
    - Ingress
  ingress:
    - from:
        # NOT a podSelector on the agents. `mount_homes` runs the mount under `nsenter -t 1 -n` —
        # pid 1's network namespace — so the client is the NODE, not the agent pod.
        #
        # That gives TWO source addresses, both needed. A mount on the node ZeroFS itself runs on
        # arrives with the node's own subnet address (10.60.1.0/24). A mount from any OTHER node
        # goes node → ClusterIP → remote pod, which flannel masquerades over VXLAN to that node's
        # `flannel.1` address — observed live inside the pod as 10.42.3.0 (session-0), 10.42.4.0
        # (env-0), 10.42.5.0 (session-1), 10.42.0.0 (k3s-cp). A node's pod /24 hands out .1 upwards
        # to pods, so the .0 is only ever that node's own VXLAN endpoint: these /32s admit the
        # nodes and still leave the rest of 10.42.0.0/16 — every tenant pod — locked out, which is
        # what this policy is for.
        #
        # HAND-MAINTAINED: a new node's `flannel.1` /32 must be added here BEFORE its agent first
        # mounts, or the agent wedges on a `hard` mount. It is a step in the node-join runbook
        # beside the labels. Read one off a node with `ip -4 addr show flannel.1`.
        - ipBlock:
            cidr: 10.60.1.0/24
        - ipBlock:
            cidr: 10.42.0.0/32
        - ipBlock:
            cidr: 10.42.3.0/32
        - ipBlock:
            cidr: 10.42.4.0/32
        - ipBlock:
            cidr: 10.42.5.0/32
      ports:
        - protocol: TCP
          port: 2049
