# ZeroFS serves EVERY owner's home in the region over NFSv3, and NFSv3 with AUTH_SYS and `nolock`
# (see `mount_homes`) authenticates nothing at all — so "who can reach 2049" IS the authorization,
# and this policy is what makes that set the agent DaemonSet rather than every pod in the cluster.
# The gateway shares this namespace but is unaffected: its ingress is a node `hostPort`, which
# NetworkPolicy does not gate (see gateway.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zerofs-nfs-from-agents
  namespace: rustic-git-system
spec:
  podSelector:
    matchLabels:
      app: zerofs
  policyTypes:
    - Ingress
  ingress:
    - from:
        # `mount_homes` runs in the agent pod itself, so the mount's client is the agent's pod IP.
        # ONE peer, not two: a `-` before `podSelector` would mean "every pod in kube-system OR
        # every `rustic-git-agent` pod anywhere" (see the `attach_egress` comment in k8s.rs).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app: rustic-git-agent
      ports:
        - protocol: TCP
          port: 2049
