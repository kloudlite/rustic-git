  memoryGb: 80

---
# The hourly suite's second tenant, all zero for the same reason as `slo-other`.
apiVersion: kloudlite.io/v1alpha1
kind: Quota
metadata:
  name: slo-hourly-other
spec:
  workspaces: 0
  environments: 0
  snapshots: 0
  diskGb: 0
  cpu: 0
  memoryGb: 0

