# What RBAC cannot say about the node controller, said as admission policy. Apply with
# agent-rbac.yaml; see the table there for the calls these rules are shaped around.
#
# Plain `admissionregistration.k8s.io/v1` — GA since Kubernetes 1.30, so k3s v1.30+ takes it with
# no feature gate. Both policies match on the AGENT's identity only; `/v1` (the api's account),
# operators with kubectl and the garbage collector are untouched.
#
# 1. A controller that has `patch` on a main resource can, as far as RBAC knows, rewrite spec.
#    The agent needs that verb for three metadata-only writes (`heal_labels` on the parents'
#    labels, the finalizer on the children) and ONE spec field: `restore_gate` copies the
#    Environment's restore wish into `Volume.spec.restoreTo` once the services are down — the
#    child is the agent's own object, authored by it, and the wish is desired state by nature (the
#    API cannot write the child; see `crd::RestoreWish`).
#    (`detach_volume` needs nothing here either: it edits `metadata.ownerReferences`, and the rule
#    below compares `spec` alone — metadata is the agent's already, same as labels and finalizers.)
#    # ponytail: metadata is unconstrained, so nothing here stops the agent rewriting ANY Volume's
#    ownerReferences — adding one, or emptying a Volume it has no business touching — where the
#    code only ever drops its own dead parent's entry. Ceiling accepted while the agent's token is
#    already root-on-a-node and equal-trust with this policy's other metadata writes; if that token
#    ever becomes a lower-trust boundary, add a Volume-UPDATE CEL check that the new
#    ownerReferences list is a subset of the old one (`object.metadata.ownerReferences.all(o,
#    o in oldObject.metadata.ownerReferences)`), which admits a removal and refuses every addition.
#    There used to be a second exception —
#    `Volume.spec.quotaGb` on a Volume an `OwnerBinding` owns, for the per-node btrfs home's
#    quota — and it is gone with the home itself: the shared NFS home has no Volume and no qgroup,
#    so no agent writes that field any more. Everything else in spec is `/v1`'s, and
#    this is what refuses the agent a write to it: "RBAC, not convention" is this file plus the
#    `/status` subresource split.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rustic-git-agent-spec-is-read-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # Main resources only: `workspaces` does not match `workspaces/status`, which is the
      # controller's half and is meant to change on every reconcile. `snapshots` and
      # `volumereplicas` are here because the agent holds `patch` on both: a Snapshot's `parent` is
      # the history chain `/v1` reads back at `GET /v1/volumes/{name}/history`, so an unchecked
      # patch grafts that chain.
      #
      # Accepted residual, alongside DELETE below: on CREATE only `Volume` is checked, so the agent
      # may author a Snapshot with an arbitrary `spec.parent`. That is deliberate — the sync beat
      # and `stop_push` legitimately create transient Snapshots naming a parent, so denying a
      # non-empty parent would break both. The chain `/v1` reads back is `!transient` only, and a
      # transient never becomes one, so a forged parent on a transient never enters the history.
      - apiGroups: ["rustic-git.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workspaces", "environments", "volumes", "ownerbindings", "snapshots", "volumereplicas"]
  matchConditions:
    - name: from-the-agent
      expression: "request.userInfo.username == 'system:serviceaccount:kube-system:rustic-git-agent'"
  validations:
    # A create has no oldObject, so it gets its own arm. The only Volume the agent authors is a
    # PARENT'S CHILD (`ensure_child_volume`, which sets an ownerReference and lets garbage
    # collection do the deleting); a free-standing Volume with an arbitrary region, quota or source
    # is `/v1`'s to write, never the controller's.
    - expression: >-
        request.operation == 'CREATE'
          ? (object.kind != 'Volume'
             || (has(object.metadata.ownerReferences) && size(object.metadata.ownerReferences) > 0))
          : (object.kind == 'Volume'
               ? (object.spec.all(k, k == 'restoreTo'
                                     || (k == 'nodeName' && (oldObject.spec.nodeName == '' || object.spec.nodeName == ''))
                                     || (k in oldObject.spec && object.spec[k] == oldObject.spec[k]))
                  && oldObject.spec.all(k, k == 'restoreTo' || k in object.spec))
               : object.spec == oldObject.spec)
      message: "rustic-git-agent writes status, not spec (exceptions: Volume.spec.restoreTo, Volume.spec.nodeName owned->'' or ''->node, and a created Volume must be a parent's child)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: rustic-git-agent-spec-is-read-only
spec:
  policyName: rustic-git-agent-spec-is-read-only
  validationActions: ["Deny"]
---
# 2. `bind` on a ClusterRole plus `rolebindings: create` is, to RBAC, "grant that role to any
#    subject in any namespace" — including the agent itself in kube-system, which would be
#    `secrets` there. The same shape is true of `pods: create`, which the role holds cluster-wide:
#    a privileged `hostPath: /` pod in kube-system turns root-on-one-node into root-on-the-cluster
#    and mints any user's token, and the pod fence in workspace-admission.yaml cannot refuse it
#    because that binding is scoped to namespaces carrying `rustic-git.io/kind`. So this pins EVERY
#    namespaced kind the agent writes — pods, statefulsets, services, networkpolicies, limitranges,
#    secrets, rolebindings — to the tenant namespaces it makes (`ws-`/`wt-` for workspaces, `env-`
#    for environments; `wt-` is the team pair, see `crd::ws_namespace`), every RoleBinding to the
#    two roles and two subjects the design names, and every Secret to the host key it creates.
#    Any other kind reaching this policy is denied outright: a new write in the code needs a row
#    in agent-rbac.yaml AND a branch here.
#
#    DELETE is covered too, by a SECOND validation entry keyed on `request.operation`: `object` is
#    null on a delete and `oldObject` holds the doomed object, so the two operations cannot share
#    an expression. The fence is the same one CREATE gets — the namespace must be `ws-`/`wt-`/
#    `env-`. It is not cosmetic: a Service is not recreated by any kubelet, so deleting `kube-dns`
#    in kube-system or `kubernetes` in default is a durable cluster-wide outage, and deleting the
#    tenant egress NetworkPolicies would take the isolation model with them.
#
#    Still not covered: cluster-scoped kinds the agent writes — `nodes: patch`, and its own
#    `namespaces: get,create,patch`. `nodes` is the broad grant already marked `ponytail:` in
#    agent-rbac.yaml, and namespace CREATE/UPDATE is fenced by the expression below.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rustic-git-agent-tenant-namespaces-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces", "secrets", "pods", "services", "limitranges"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
      # DELETE is matched separately from CREATE/UPDATE: `object` is null on a delete and
      # `oldObject` carries the doomed object, so the two need different expression shapes and
      # must not share a rule. `namespaces` is absent on purpose — the agent holds no
      # `namespaces: delete`, so there is nothing to fence.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["services", "pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["statefulsets"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["DELETE"]
        resources: ["networkpolicies"]
  matchConditions:
    - name: from-the-agent
      expression: "request.userInfo.username == 'system:serviceaccount:kube-system:rustic-git-agent'"
  validations:
    # A delete the agent legitimately makes is always inside a namespace it reconciles: a
    # workspace pod, an environment's StatefulSets and Services, an attachment NetworkPolicy.
    # Deleting `kube-dns` or the `kubernetes` Service is a durable cluster-wide outage that no
    # kubelet repairs, which is why DELETE is fenced here and not left as an accepted residual.
    # `oldObject` IS populated on a delete (`object` is null), so this must be its own entry —
    # folding it into the expression below would dereference a null `object.kind`.
    - expression: >-
        request.operation != 'DELETE'
          || oldObject.metadata.namespace.startsWith('ws-')
          || oldObject.metadata.namespace.startsWith('wt-')
          || oldObject.metadata.namespace.startsWith('env-')
      message: "rustic-git-agent may only delete namespaced objects in ws-/wt-/env- namespaces"
    - expression: >-
        request.operation == 'DELETE' ? true :
        object.kind == 'Namespace'
          ? (object.metadata.name.startsWith('ws-')
             || object.metadata.name.startsWith('wt-')
             || object.metadata.name.startsWith('env-'))
        : object.kind == 'Secret'
          ? ((object.metadata.namespace.startsWith('ws-') || object.metadata.namespace.startsWith('wt-'))
             && object.metadata.name.startsWith('ws-ssh-'))
        : object.kind == 'RoleBinding'
          ? ((object.metadata.namespace.startsWith('ws-')
              || object.metadata.namespace.startsWith('wt-')
              || object.metadata.namespace.startsWith('env-'))
             && object.roleRef.kind == 'ClusterRole'
             && object.roleRef.name in ['rustic-git-api-secrets', 'rustic-git-agent-ws-secrets']
             && has(object.subjects)
             && object.subjects.all(s, s.kind == 'ServiceAccount'
                                       && s.namespace == 'kube-system'
                                       && s.name in ['rustic-git-api', 'rustic-git-agent']))
        : (object.kind in ['Pod', 'StatefulSet', 'Service', 'NetworkPolicy', 'LimitRange'])
          ? (object.metadata.namespace.startsWith('ws-')
             || object.metadata.namespace.startsWith('wt-')
             || object.metadata.namespace.startsWith('env-'))
        : false
      message: "rustic-git-agent may only write ws-/wt-/env- namespaces and namespaced objects inside them, ws-ssh-* Secrets, and the two api/agent secret RoleBindings"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: rustic-git-agent-tenant-namespaces-only
spec:
  policyName: rustic-git-agent-tenant-namespaces-only
  validationActions: ["Deny"]
