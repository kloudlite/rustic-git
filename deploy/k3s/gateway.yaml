# The workspace SSH gateway.
#
# One replica per pool node, each holding `hostPort: 80` on that node's public interface: the
# Cloudflare A records for `ws-<region>.khost.dev` point at those nodes, and `harden-node.sh`
# admits 80 from Cloudflare's ranges only. TLS terminates at the edge (the hostname's SSL mode
# is Flexible), so the edge→node hop is plaintext over a port nothing but the edge can reach.
# Moving to Full (strict) later is an Origin CA certificate in a `gateway-tls` Secret plus
# `GATEWAY_TLS_DIR` — the binary already serves 443 when that is set; no code changes.
#
# This is a Deployment with a required
# anti-affinity rather than a DaemonSet — a DaemonSet would also schedule onto a node whose IP is
# in no DNS record, and `hostPort` makes two pods per node unschedulable anyway.
#
# Its own namespace, `kloudlite-system` (`k8s::GATEWAY_NAMESPACE` — the workspace NetworkPolicy
# admits port 22 from `app=kloudlite-gateway` pods in THAT namespace and nowhere else, so the two
# must agree). Not `kube-system`: this is the one process that accepts unauthenticated internet
# connections, and it has no business sharing a namespace with the agent's credential Secret.
# Anything it needs from AKS (`kloudlite-jwt`, the optional `gateway-tls`) is copied here.
apiVersion: v1
kind: Namespace
metadata:
  name: kloudlite-system
  labels:
    # `privileged`, honestly: the built-in Pod Security Admission's `baseline` refuses any
    # `hostPort`, and the hostPort IS this deployment. The tenant namespaces the agent creates are
    # `baseline` (see k8s::namespace); this one is not a tenant.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudlite-gateway
  namespace: kloudlite-system
---
# `get` and nothing else, on two kinds. The gateway reads placement (`status.podRef`) and an
# address (`status.podIP`); it never writes, never lists, and holds no user credential — a token
# it is handed is spent on connect and names one workspace.
#
# Pods are cluster-wide because RBAC cannot express "namespaces matching `ws-*`" — there is no
# globbing in a rule, and the alternative is one RoleBinding per workspace namespace, written by
# something. `get` alone (no list, no watch) is the narrowing that is actually expressible: this
# SA can read a pod it can already name, and cannot enumerate the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-gateway
rules:
  - apiGroups: ["kloudlite.io"]
    resources: ["workspaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudlite-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlite-gateway
subjects:
  - kind: ServiceAccount
    name: kloudlite-gateway
    namespace: kloudlite-system
---
# The region this gateway serves. It MUST equal `WS_REGION` in the agent's Secret in kube-system
# (the region name the api mints session tokens for): the gateway verifies a token's region
# locally and refuses another region's. A ConfigMap rather than a secretKeyRef on the agent's
# Secret because a Secret is not readable across namespaces — and a region name is not a secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kloudlite-gateway
  namespace: kloudlite-system
data:
  WS_REGION: centralindia-k3s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudlite-gateway
  namespace: kloudlite-system
  labels:
    app: kloudlite-gateway
spec:
  # One per pool node: `session-0` and `env-0`. Raising this past the node count leaves pods
  # Pending on `hostPort`.
  # ONE replica, and not a preference: the gateway counts open tunnels per workspace (10), per
  # owner (100) and the connect tokens it has spent IN MEMORY (`bins/gateway/src/tunnel.rs`). Two
  # replicas behind one Service made every one of those per pod — the weekly's `gw.caps` opened an
  # eleventh tunnel through the other pod, and a spent token could be replayed against it. Raise
  # this only once the counts live somewhere every replica reads (a per-workspace Lease on the
  # k3s API, or the api as the counter); `the_gateway_runs_one_replica_while_it_counts_in_memory`
  # in the gateway crate pins it. A restart is a few seconds of "reconnect", nothing more.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kloudlite-gateway
  template:
    metadata:
      labels:
        app: kloudlite-gateway
      # Plain scrape annotations, no Prometheus Operator assumed (a ServiceMonitor would need the
      # CRD installed first; kube-prometheus-stack and the Azure managed agent both honour these).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kloudlite-gateway
      nodeSelector:
        kloudlite.io/pool: "true"
      tolerations:
        - key: kloudlite.io/role
          operator: Exists
      affinity:
        podAntiAffinity:
          # Required, not preferred: two replicas on one node is one CrashLoop and one silently
          # unreachable node, which reads as "Cloudflare is flaky" rather than as a scheduling bug.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kloudlite-gateway
              topologyKey: kubernetes.io/hostname
      # fsGroup only, and only so the projected `secrets` volume below lands root:1001 rather
      # than root:root — the container's own runAsUser/runAsGroup are unchanged.
      securityContext:
        fsGroup: 1001
      containers:
        - name: gateway
          # Pinned by commit SHA like the agent, never `:latest` — the tag is what says which
          # code is running, and `IfNotPresent` on an immutable tag means image GC costs a
          # re-pull rather than a silent version change.
          # No imagePullSecret: the package is public, like the repository.
          image: ghcr.io/kloudlite/kloudlite-gateway:bc5a506229c95db5d4ae20b423618c90020a6268@sha256:cfb31e6d22f39885769a0db7909eebd206b5a9369dd6fc0d44063677306e8c80
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              # The whole point: the edge connects to the NODE, not through a Service.
              hostPort: 80
          env:
            # JSON events, so the collector gets level/module/fields as columns (crates/core/src/log.rs).
            - name: KLOUDLITE_LOG_FORMAT
              value: json
            # A separate listener: 8080 and 443 are the internet-facing ones. NOT a hostPort.
            - name: KLOUDLITE_METRICS_ADDR
              value: 0.0.0.0:9464
            # KLOUDLITE_JWT_SECRET is not here: it is a file in the `secrets` volume below
            # (2026-09-12 review #70). It is the same secret the api mints session tokens with —
            # verification is local, so the gateway needs no call to AKS on the connect path.
            # Copied into this cluster at rollout; the pod fails closed without it.
            - name: WS_REGION
              valueFrom:
                configMapKeyRef:
                  name: kloudlite-gateway
                  key: WS_REGION
            - name: RUST_BACKTRACE
              value: "1"
          # Headroom above the request, not equal to it (2026-09-12 review #73): this process
          # counts open tunnels per workspace and per owner, and the connect tokens it has spent,
          # IN MEMORY (`bins/gateway/src/tunnel.rs`) — an OOM-kill drops every one of those, so a
          # burst of tunnels must be throttled by the scheduler's request, never killed at the
          # limit. Raise the request, not the limit, if it is ever seen steady above 256Mi.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          # Readiness as well as liveness (2026-09-12 review #65): with `Recreate` and one
          # replica the Service's endpoint is this pod, and without a readiness gate it is
          # published the instant the container starts — a connect arriving in that window is
          # refused rather than queued.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            # The container binds 8080 (the hostPort mapping to 80 is the CNI's), so nothing here
            # needs to bind a privileged port — but the binary carries a NET_BIND_SERVICE FILE
            # capability (`setcap` in the Dockerfile, for the 443 path), and execve of such a file
            # fails with EPERM when the bounding set lacks that capability. Keep it granted.
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - { name: secrets, mountPath: /var/run/secrets/kloudlite, readOnly: true }
      volumes:
        # Every secret this pod needs as FILES, not env (2026-09-12 review #70). A process's
        # environment is readable in `kubectl describe pod`, in a core dump, in /proc — and, the
        # reason it mattered here, it is inherited by every child, and this fleet spawns plenty
        # (the worker runs `git`, the agent runs `btrfs` and `nix`). The `path` under `items` IS
        # the env var name `kloudlite_core::secret::read` asks for, so nothing has to learn a
        # second naming scheme, and its env fallback keeps a laptop run working unchanged.
        # 0440 with this pod's `fsGroup: 1001`: the files land root:1001.
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: kloudlite-jwt
                  items:
                    - { key: secret, path: KLOUDLITE_JWT_SECRET }
---
# Cluster-internal only: the health check and tests. Real traffic arrives on the node's 80.
apiVersion: v1
kind: Service
metadata:
  name: kloudlite-gateway
  namespace: kloudlite-system
spec:
  selector:
    app: kloudlite-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
