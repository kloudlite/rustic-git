# What `kloudlite-api` may do in this cluster.
#
# The API tier runs elsewhere and reaches this cluster with a kubeconfig, so this is the whole of
# its authority here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudlite-api
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-api
rules:
  # Spec is the API's to write. It never writes status — that is the controller's, and the split is
  # what stops the two overwriting each other's view of the same object. No `watch`: nothing in the
  # API watches — every read is a one-shot list on a request. No `update`: every write is a
  # server-side `patch`, never a whole-object replace.
  - apiGroups: ["kloudlite.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # A Bench, like a workspace, is spec the API writes and status the agent writes. No `delete`: a
  # member leaving is a pause, then a `kloudlite.io/delete-after` mark the keys beat writes, and the
  # cluster controller's GC (controller-rbac.yaml) is what deletes a due bench.
  - apiGroups: ["kloudlite.io"]
    resources: ["benches"]
    verbs: ["get", "list", "create", "patch"]
  # A person's space environment (`/v1/me/environments`): spec the api writes by server-side apply
  # (`create` + `patch`); `delete` is the person's DELETE and `delete_env`'s by-label sweep (a
  # departed member's choice is the controller's GC, not this).
  - apiGroups: ["kloudlite.io"]
    resources: ["spaceenvironments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # Read-only, one object: the migration clears the retired `attachedEnvironment` only once the
  # agent DaemonSet has fully rolled a template carrying `kloudlite.io/space-env`.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["kloudlite-agent"]
    verbs: ["get"]
  # A push, the history/refs listings behind it, and `DELETE /v1/volumes/{name}/snapshots/{id}` —
  # the one explicit way a snapshot ever goes away, now that retention never prunes one. No
  # `watch`: nothing in the API watches — every read is a one-shot list on a request. `create` and
  # `delete` but deliberately NO `/status`: the outcome of a push is the agent's to write, and an
  # API that could write it could report a push that never happened.
  - apiGroups: ["kloudlite.io"]
    resources: ["snapshots"]
    verbs: ["get", "list", "create", "delete"]
  # Reads for projections, plus `delete` — and `delete` ONLY because a volume can now outlive
  # every parent: `cleanup_parent` detaches one that still holds a snapshot, so nothing's
  # ownerReference points at it any more and GC will never take it. `DELETE /v1/volumes/{name}`
  # and the last-snapshot arm of `DELETE .../snapshots/{id}` are the two callers, both refusing
  # while a live parent names it. `create` stays with the agent (a controller owns the children it
  # authors); the API's parent delete is still one call to the Workspace.
  - apiGroups: ["kloudlite.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "delete"]
  # The claiming agent creates `ownerbindings`; the keys beat's prune (`api::keys::prune_bindings`)
  # deletes one whose TEAM owner no Workspace, Bench or Environment names any more. Every agent
  # re-applied each of 109 dead probe-team bindings ~36 times per 30 min until it did.
  - apiGroups: ["kloudlite.io"]
    resources: ["ownerbindings"]
    verbs: ["list", "delete"]
  # Read for enforcement (`guard_alloc` needs the owner's effective limit) and for `GET /v1/quota`;
  # no create, patch or delete — writing a Quota is the admin role's alone.
  - apiGroups: ["kloudlite.io"]
    resources: ["quotas"]
    verbs: ["get", "list"]
  # The api is the ONLY writer of a key set — it projects the directory into one object per owner
  # namespace by server-side apply, which the apiserver authorizes as `create` + `patch`.
  # `delete` is the resync beat's prune (`api::keys::project_all`): an owner no Workspace names
  # any more has no pod reading its file, and without this verb every team a probe run ever made
  # lived on forever — 27 of them by 2026-09-08, each retried as a forbidden delete every beat.
  # An owner losing their last KEY is still an empty file, not a delete; only losing their last
  # WORKSPACE removes the object.
  - apiGroups: ["kloudlite.io"]
    resources: ["ownerkeys"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # A person or a team admin may open a request for themselves; deciding it is not a /v1 verb.
  - apiGroups: ["kloudlite.io"]
    resources: ["quotarequests"]
    verbs: ["get", "list", "create"]
  # The generic request queue. Same reach as `quotarequests` and for the same reason: a person or
  # a team admin may OPEN one for themselves, and deciding it is not a /v1 verb — no `patch`, and
  # no `requests/status` at all, so this role cannot mark its own request approved.
  - apiGroups: ["kloudlite.io"]
    resources: ["requests"]
    verbs: ["get", "list", "create"]
  # Read-only, for ONE question: cloning an INTERRUPTED workspace. Its node is down, so nothing can
  # be cut there and the clone has to graft onto a sync point some OTHER node already holds — and
  # `status.branches` is the only record of who holds what. `get`/`list` and nothing else: the
  # replica row is the pulling agent's to write, always.
  - apiGroups: ["kloudlite.io"]
    resources: ["volumereplicas"]
    verbs: ["get", "list"]
  # Read-only: registering a region is `POST /admin/regions` now, and `/v1/regions` keeps only the
  # active-region GET every workspace/environment create already calls to validate `region`.
  - apiGroups: ["kloudlite.io"]
    resources: ["regions"]
    verbs: ["get", "list"]
  # One policy, one moment: deleting an ATTACHED workspace. Nothing stamps a finalizer on a
  # Workspace, so its deletion is garbage collection the agent never observes, and the
  # environment-side half of the attach grant lives in the environment's namespace where the
  # workspace's ownerReference cannot reach it. `delete` only — the API never authors a policy.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["delete"]
  # `list` to find which workspace namespaces an owner has: an ssh key add or remove must rewrite
  # the `user-key` Secret in every one of them, and the namespaces themselves are the controller's
  # to create. Namespace metadata carries no secrets.
  #
  # `delete` is the resync beat's namespace prune (`api::keys::prune_namespaces`), and the code is
  # what bounds it — RBAC cannot express a name prefix: ONLY a `wt-` namespace (a person's own
  # `ws-` one is never a candidate), only when no Workspace resolves to it, only when it is older
  # than a beat, and only when it holds no pod. Without it a deleted team left its namespace
  # behind forever — 101 empty ones by 2026-09-08, one per hourly probe run.
  #
  # `get`: a refused `user-key` install reads its namespace to tell a terminating or brand-new one
  # (expected, deferred) from a real fault (`workspaces::keys::write_user_key`).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "get", "delete"]
  # The prune's last guard reads pods in the namespace it is about to delete; unreadable counts as
  # occupied, so this is the verb that lets a delete be refused rather than waved through. RBAC
  # cannot scope a list to a name prefix, so this IS cluster-wide pod read — every namespace,
  # `kube-system` included. Only pod metadata is used (does this namespace hold any), never a spec.
  # `get`: `GET /v1/workspaces/{id}/tools` (api/workspaces/mod.rs `ws_tools`) reads the one pod its
  # workspace names for `status.podIP`. Without it that route answered 500 to every caller from the
  # day it shipped (e781c44a) — found 2026-09-15 when the bench tool round trip first reached it.
  # `list` already reads every pod, so `get` adds no visibility.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudlite-admin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-admin
rules:
  # `watch` on every read below is the history layer's, not the console's: `history::watch` runs
  # one reflector per kind per region in the admin process and turns the transitions it sees into
  # `kloudlite.events` rows (crates/workspaces/src/history/watch.rs). Without it each watch retries
  # forever behind a backoff and the console's charts stay empty while every other admin surface
  # works — the one failure mode this rule exists to prevent. It adds no authority: a `watch` is a
  # streamed `list`, and nothing here gained a write verb.
  #
  # The only role that may create, patch or delete a Quota, a QuotaRequest or a Region — the
  # design doc's whole point: RBAC, not a claim check inside a shared process, is what stops the
  # user-role process writing one of these, because that process's ServiceAccount cannot.
  - apiGroups: ["kloudlite.io"]
    resources: ["quotas"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["kloudlite.io"]
    resources: ["quotarequests"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["kloudlite.io"]
    resources: ["quotarequests/status"]
    verbs: ["patch", "update"]
  # Deciding a request: `patch`/`update` on the status subresource, which is where every decision
  # is written. `create` is here because the one-shot migration (`POST /admin/requests/migrate`)
  # authors a Request per legacy QuotaRequest. No `patch` or `delete` on the object itself — no
  # route edits or removes a request's spec, and a decision that could rewrite what was asked for
  # is not a decision.
  - apiGroups: ["kloudlite.io"]
    resources: ["requests"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["kloudlite.io"]
    resources: ["requests/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["kloudlite.io"]
    resources: ["regions"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # No `delete`: `ClusterSettings` is never removed, only its fields reset to defaults by
  # omission — the object itself (named `default`) is expected to always exist once created.
  - apiGroups: ["kloudlite.io"]
    resources: ["clustersettings"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # The decommission view and the cross-owner list/stop/delete surfaces both need the full object,
  # not the read the user role keeps for its own owner-scoped routes.
  - apiGroups: ["kloudlite.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  # A bench is one more per-owner object the Owners detail lists; without this the whole owner
  # page 403s (hourly admin.screens, 2026-09-22).
  - apiGroups: ["kloudlite.io"]
    resources: ["benches"]
    verbs: ["get", "list", "watch"]
  # Read-only, and not optional: Owners, Clusters and Overview all compute their numbers from
  # these on the request path (usage is never a cached counter), so without this rule those three
  # areas answer 403 rather than degrading.
  - apiGroups: ["kloudlite.io"]
    resources: ["volumes", "snapshots", "volumereplicas"]
    verbs: ["get", "list", "watch"]
  # `quota::usage` lists Benches for an owner's allocation (Owners, Overview). No `watch`:
  # `history::watch` runs no Bench reflector.
  - apiGroups: ["kloudlite.io"]
    resources: ["benches"]
    verbs: ["get", "list"]
  # Read-only: which environment a person's space follows, for the Owners area.
  - apiGroups: ["kloudlite.io"]
    resources: ["spaceenvironments"]
    verbs: ["get", "list"]
  # `patch` is the Clusters area's drain / undrain / decommission: the decommission LABEL, the
  # status annotation undrain clears, and `spec.unschedulable`. A node cannot be name-restricted
  # in RBAC (no `resourceNames` on a cluster-scoped list of one), so the scoping is in the handler
  # — `client_for_region` answers only for a node this region's cluster actually has, and every
  # write names exactly one node and carries a reason onto the audit row. Still no `delete`: the
  # console never removes a Node object, and never the VM behind it.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # admin::workloads' per-region half: rolling this region's own kloudlite-agent DaemonSet
  # (kube-system), kloudlite-gateway Deployment (kloudlite-system, deploy/k3s/gateway.yaml) and
  # kloudlite-controller Deployment (kube-system, deploy/k3s/controller.yaml).
  # No `create`/`delete` — same reasoning as the central Role in deploy/kloudlite.yaml, a roll
  # only ever patches an object that already exists. Every name in `KNOWN_PER_REGION` must appear
  # here: `list_workloads` GETs each one, and a 403 on any of them fails the WHOLE
  # `/admin/workloads` listing, not merely that row (a 404 does not — that is a skipped row).
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["kloudlite-agent"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kloudlite-gateway", "kloudlite-controller"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudlite-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlite-admin
subjects:
  - kind: ServiceAccount
    name: kloudlite-admin
    namespace: kube-system
---
# Secrets are NOT in the ClusterRole above, and this one is NOT bound cluster-wide.
#
# The API needs to write exactly one Secret — the owner's platform-issued git key
# (`k8s::USER_KEY_SECRET`) — into exactly one namespace, theirs. Granting `secrets: create`
# cluster-wide to get that would hand the API every Secret in the cluster, including the agent's
# own credentials.
#
# So it is bound per namespace instead: the controller creates a RoleBinding to this ClusterRole in
# each workspace namespace it makes (see `k8s::api_secret_binding`). The API can therefore write a
# Secret in a namespace the controller has vouched for, and nowhere else.
#
#   Secret       verbs                      written by
#   user-key     get update patch           keys beat, workspace/bench create
#   bench-tool   get patch delete           /v1/bench/tool-token, stop_bench
#   (any name)   create                     first apply of either
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudlite-api-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Named, not the whole namespace: the same namespace holds the agent's `ws-ssh-{id}` host key,
    # which the agent creates once and NEVER updates because a host key that changed is
    # indistinguishable from a man in the middle (see agent-rbac.yaml). Without `resourceNames` the
    # api could rewrite it, and `kl` adopts whatever key the api hands back — an api compromise
    # would MITM every workspace ssh session silently. `resourceNames` cannot restrict `create` (the
    # name is not known at authorization time), so the api may still create an arbitrarily named
    # Secret in a workspace namespace; it may not touch an existing `ws-ssh-*` one, which is the
    # finding this closes.
    # bench-engine sits beside user-key: same per-namespace apply, named for the same reason —
    # it holds the platform's engine credentials, which no workspace pod may ever mount.
    resourceNames: ["user-key", "bench-engine"]
    # `patch` is what server-side apply needs; without it the key install fails with a 403 that
    # reads like a missing binding. No `delete`: the Secret carries an ownerReference and is
    # reclaimed with its namespace.
    verbs: ["get", "update", "patch"]
  # `bench-tool`: the bench pod's 15-minute platform token (`k8s::BENCH_TOOL_SECRET`), applied by
  # `POST /v1/bench/tool-token` and deleted by its DELETE and by `stop_bench`. Named for the same
  # host-key reason as above; `delete` is here and not on `user-key` because a stopped bench must
  # not keep a token lying in its namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bench-tool"]
    verbs: ["get", "patch", "delete"]
  # `create` is a SEPARATE rule with no `resourceNames`, because a name-restricted rule can never
  # authorize a create (the object's name does not exist yet at authorization time) — folding it in
  # above silently removed `create`, so a new owner's very first `user-key` apply 403'd.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudlite-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudlite-api
subjects:
  - kind: ServiceAccount
    name: kloudlite-api
    namespace: kube-system
---
# `history::watch`'s leader rows (`controller.leader`): one watch per region cluster on the
# controller's own Lease. A Role in kube-system, not a ClusterRole rule, and named: the admin process
# reads exactly one Lease, never the kubelet heartbeats beside it. `resourceNames` holds for
# `list`/`watch` only because the watch sets the `metadata.name` field selector. No write verb —
# the controller alone renews it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kloudlite-admin-leader
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kloudlite-controller"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kloudlite-admin-leader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kloudlite-admin-leader
subjects:
  - kind: ServiceAccount
    name: kloudlite-admin
    namespace: kube-system
---
# `api::keys::renew_beat`: the keys beat's heartbeat Lease, which the controller's removal GC reads
# before deleting anything. Server-side apply, so `patch` by name; `create` cannot be scoped by
# name in RBAC and is only exercised on the first beat of a region.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kloudlite-api-keys-beat
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kloudlite-keys-beat"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kloudlite-api-keys-beat
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kloudlite-api-keys-beat
subjects:
  - kind: ServiceAccount
    name: kloudlite-api
    namespace: kube-system
