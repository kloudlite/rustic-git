# What `rustic-git-api` may do in this cluster.
#
# The API tier runs elsewhere and reaches this cluster with a kubeconfig, so this is the whole of
# its authority here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-api
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-api
rules:
  # Spec is the API's to write. It never writes status — that is the controller's, and the split is
  # what stops the two overwriting each other's view of the same object.
  - apiGroups: ["rustic-git.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # A push. No `watch`: nothing in the API watches — every read is a one-shot list on a
  # request. `create` and `delete` but deliberately NO `/status`: the outcome of a push is the
  # agent's to write, and an API that could write it could report a snapshot that never happened.
  - apiGroups: ["rustic-git.io"]
    resources: ["snapshotrequests"]
    verbs: ["get", "list", "create", "delete"]
  # Read-only, for projections. `create` went to the agent (a controller owns the children it
  # authors) and `delete` went with it — the API's delete handler is now one call to the Workspace,
  # and garbage collection follows the ownerReference to the Volume. `ownerbindings` are gone from
  # this file entirely: the claiming agent creates them now.
  - apiGroups: ["rustic-git.io"]
    resources: ["volumes"]
    verbs: ["get", "list"]
  # One policy, one moment: deleting an ATTACHED workspace. Nothing stamps a finalizer on a
  # Workspace, so its deletion is garbage collection the agent never observes, and the
  # environment-side half of the attach grant lives in the environment's namespace where the
  # workspace's ownerReference cannot reach it. `delete` only — the API never authors a policy.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["delete"]
  # List only, and only to find which workspace namespaces an owner has: an ssh key add or remove
  # must rewrite the `user-key` Secret in every one of them, and the namespaces themselves are the
  # controller's to create. Namespace metadata carries no secrets.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
# Secrets are NOT in the ClusterRole above, and this one is NOT bound cluster-wide.
#
# The API needs to write exactly two Secrets — a short-lived git token for a workspace being seeded
# from a repository, and the owner's platform-issued git key — into exactly one namespace, theirs. Granting `secrets: create`
# cluster-wide to get that would hand the API every Secret in the cluster, including the agent's
# own credentials.
#
# So it is bound per namespace instead: the controller creates a RoleBinding to this ClusterRole in
# each workspace namespace it makes (see `k8s::api_secret_binding`). The API can therefore write a
# Secret in a namespace the controller has vouched for, and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-api-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # `patch` is what server-side apply needs; without it the key install fails with a 403 that
    # reads like a missing binding.
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustic-git-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustic-git-api
subjects:
  - kind: ServiceAccount
    name: rustic-git-api
    namespace: kube-system
