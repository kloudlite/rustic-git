# What `rustic-git-api` may do in this cluster.
#
# The API tier runs elsewhere and reaches this cluster with a kubeconfig, so this is the whole of
# its authority here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-api
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-api
rules:
  # Spec is the API's to write. It never writes status — that is the controller's, and the split is
  # what stops the two overwriting each other's view of the same object. No `watch`: nothing in the
  # API watches — every read is a one-shot list on a request. No `update`: every write is a
  # server-side `patch`, never a whole-object replace.
  - apiGroups: ["rustic-git.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # A push, the history/refs listings behind it, and `DELETE /v1/volumes/{name}/snapshots/{id}` —
  # the one explicit way a snapshot ever goes away, now that retention never prunes one. No
  # `watch`: nothing in the API watches — every read is a one-shot list on a request. `create` and
  # `delete` but deliberately NO `/status`: the outcome of a push is the agent's to write, and an
  # API that could write it could report a push that never happened.
  - apiGroups: ["rustic-git.io"]
    resources: ["snapshots"]
    verbs: ["get", "list", "create", "delete"]
  # Reads for projections, plus `delete` — and `delete` ONLY because a volume can now outlive
  # every parent: `cleanup_parent` detaches one that still holds a snapshot, so nothing's
  # ownerReference points at it any more and GC will never take it. `DELETE /v1/volumes/{name}`
  # and the last-snapshot arm of `DELETE .../snapshots/{id}` are the two callers, both refusing
  # while a live parent names it. `create` stays with the agent (a controller owns the children it
  # authors); the API's parent delete is still one call to the Workspace. `ownerbindings` are gone
  # from this file entirely: the claiming agent creates them now.
  - apiGroups: ["rustic-git.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "delete"]
  # Read for enforcement (`guard_alloc` needs the owner's effective limit) and for `GET /v1/quota`;
  # no create, patch or delete — writing a Quota is the admin role's alone.
  - apiGroups: ["rustic-git.io"]
    resources: ["quotas"]
    verbs: ["get", "list"]
  # A person or a team admin may open a request for themselves; deciding it is not a /v1 verb.
  - apiGroups: ["rustic-git.io"]
    resources: ["quotarequests"]
    verbs: ["get", "list", "create"]
  # The generic request queue. Same reach as `quotarequests` and for the same reason: a person or
  # a team admin may OPEN one for themselves, and deciding it is not a /v1 verb — no `patch`, and
  # no `requests/status` at all, so this role cannot mark its own request approved.
  - apiGroups: ["rustic-git.io"]
    resources: ["requests"]
    verbs: ["get", "list", "create"]
  # Read-only, for ONE question: cloning an INTERRUPTED workspace. Its node is down, so nothing can
  # be cut there and the clone has to graft onto a sync point some OTHER node already holds — and
  # `status.branches` is the only record of who holds what. `get`/`list` and nothing else: the
  # replica row is the pulling agent's to write, always.
  - apiGroups: ["rustic-git.io"]
    resources: ["volumereplicas"]
    verbs: ["get", "list"]
  # Read-only: registering a region is `POST /admin/regions` now, and `/v1/regions` keeps only the
  # active-region GET every workspace/environment create already calls to validate `region`.
  - apiGroups: ["rustic-git.io"]
    resources: ["regions"]
    verbs: ["get", "list"]
  # One policy, one moment: deleting an ATTACHED workspace. Nothing stamps a finalizer on a
  # Workspace, so its deletion is garbage collection the agent never observes, and the
  # environment-side half of the attach grant lives in the environment's namespace where the
  # workspace's ownerReference cannot reach it. `delete` only — the API never authors a policy.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["delete"]
  # List only, and only to find which workspace namespaces an owner has: an ssh key add or remove
  # must rewrite the `user-key` Secret in every one of them, and the namespaces themselves are the
  # controller's to create. Namespace metadata carries no secrets.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-admin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-admin
rules:
  # The only role that may create, patch or delete a Quota, a QuotaRequest or a Region — the
  # design doc's whole point: RBAC, not a claim check inside a shared process, is what stops the
  # user-role process writing one of these, because that process's ServiceAccount cannot.
  - apiGroups: ["rustic-git.io"]
    resources: ["quotas"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["rustic-git.io"]
    resources: ["quotarequests"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["rustic-git.io"]
    resources: ["quotarequests/status"]
    verbs: ["patch", "update"]
  # Deciding a request: `patch`/`update` on the status subresource, which is where every decision
  # is written. `create` is here because the one-shot migration (`POST /admin/requests/migrate`)
  # authors a Request per legacy QuotaRequest. No `patch` or `delete` on the object itself — no
  # route edits or removes a request's spec, and a decision that could rewrite what was asked for
  # is not a decision.
  - apiGroups: ["rustic-git.io"]
    resources: ["requests"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["rustic-git.io"]
    resources: ["requests/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["rustic-git.io"]
    resources: ["regions"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # No `delete`: `ClusterSettings` is never removed, only its fields reset to defaults by
  # omission — the object itself (named `default`) is expected to always exist once created.
  - apiGroups: ["rustic-git.io"]
    resources: ["clustersettings"]
    verbs: ["get", "create", "patch"]
  # The decommission view and the cross-owner list/stop/delete surfaces both need the full object,
  # not the read the user role keeps for its own owner-scoped routes.
  - apiGroups: ["rustic-git.io"]
    resources: ["workspaces", "environments"]
    verbs: ["get", "list", "patch", "delete"]
  # Read-only, and not optional: Owners, Clusters and Overview all compute their numbers from
  # these on the request path (usage is never a cached counter), so without this rule those three
  # areas answer 403 rather than degrading.
  - apiGroups: ["rustic-git.io"]
    resources: ["volumes", "snapshots", "volumereplicas"]
    verbs: ["get", "list"]
  # `patch` is the Clusters area's drain / undrain / decommission: the decommission LABEL, the
  # status annotation undrain clears, and `spec.unschedulable`. A node cannot be name-restricted
  # in RBAC (no `resourceNames` on a cluster-scoped list of one), so the scoping is in the handler
  # — `client_for_region` answers only for a node this region's cluster actually has, and every
  # write names exactly one node and carries a reason onto the audit row. Still no `delete`: the
  # console never removes a Node object, and never the VM behind it.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # admin::workloads' per-region half: rolling this region's own rustic-git-agent DaemonSet
  # (kube-system) and rustic-git-gateway Deployment (rustic-git-system, deploy/k3s/gateway.yaml).
  # No `create`/`delete` — same reasoning as the central Role in deploy/rustic-git.yaml, a roll
  # only ever patches an object that already exists.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: ["rustic-git-agent"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["rustic-git-gateway"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustic-git-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustic-git-admin
subjects:
  - kind: ServiceAccount
    name: rustic-git-admin
    namespace: kube-system
---
# Secrets are NOT in the ClusterRole above, and this one is NOT bound cluster-wide.
#
# The API needs to write exactly one Secret — the owner's platform-issued git key
# (`k8s::USER_KEY_SECRET`) — into exactly one namespace, theirs. Granting `secrets: create`
# cluster-wide to get that would hand the API every Secret in the cluster, including the agent's
# own credentials.
#
# So it is bound per namespace instead: the controller creates a RoleBinding to this ClusterRole in
# each workspace namespace it makes (see `k8s::api_secret_binding`). The API can therefore write a
# Secret in a namespace the controller has vouched for, and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-api-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Named, not the whole namespace: the same namespace holds the agent's `ws-ssh-{id}` host key,
    # which the agent creates once and NEVER updates because a host key that changed is
    # indistinguishable from a man in the middle (see agent-rbac.yaml). Without `resourceNames` the
    # api could rewrite it, and `kl` adopts whatever key the api hands back — an api compromise
    # would MITM every workspace ssh session silently. `resourceNames` cannot restrict `create` (the
    # name is not known at authorization time), so the api may still create an arbitrarily named
    # Secret in a workspace namespace; it may not touch an existing `ws-ssh-*` one, which is the
    # finding this closes.
    resourceNames: ["user-key"]
    # `patch` is what server-side apply needs; without it the key install fails with a 403 that
    # reads like a missing binding. No `delete`: the Secret carries an ownerReference and is
    # reclaimed with its namespace.
    verbs: ["get", "update", "patch"]
  # `create` is a SEPARATE rule with no `resourceNames`, because a name-restricted rule can never
  # authorize a create (the object's name does not exist yet at authorization time) — folding it in
  # above silently removed `create`, so a new owner's very first `user-key` apply 403'd.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustic-git-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustic-git-api
subjects:
  - kind: ServiceAccount
    name: rustic-git-api
    namespace: kube-system
