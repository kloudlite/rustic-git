# The region's shared-home NFS export: ZeroFS serves one S3-backed filesystem over NFSv3, and
# every pool node's agent mounts it at `{pool}/homes` (bins/agent/src/lib.rs, mount_homes). This
# replaces the old per-node btrfs home volume with one region-shared store.
#
# Namespace `kloudlite-git-system` already exists (created by gateway.yaml) — not redeclared here.
#
# SINGLE REPLICA ON PURPOSE. ZeroFS's metadata tree is SlateDB underneath (LSM tree on the object
# store), and SlateDB is single-writer with epoch fencing — the exact invariant the repo databases
# already run on (see this repo's README, "The one invariant everything hangs off"). A second
# ZeroFS replica pointed at the same bucket prefix does not load-balance; it fences the first one's
# writer and both start failing writes. Scale this by raising resources, never replicas>1.
#
# Availability ruling (from the shared-home spec): a down ZeroFS hangs every `/home/kl` in the
# region until Kubernetes reschedules this pod — accepted, because the alternative (per-node
# btrfs homes) is what this migration removes. `hard,nolock` on the agent's mount keeps a flapping
# ZeroFS from corrupting instead of just blocking (see mount_homes's comment).
# The `zerofs-store` Secret is deliberately NOT in this file. It used to be, carrying REPLACE-ME
# placeholders — which meant every `kubectl apply -f zerofs.yaml` silently overwrote the real
# credentials with placeholders and the pod crash-looped on `Invalid Access Key`, with nothing in
# the diff to suggest the apply had touched them. A manifest that is re-applied on every rollout
# must not carry secret material at all.
#
# Create it once, from the region's EXISTING storage credential (see deploy/k3s/README.md, step 1
# of "Shared home"); it needs AZURE_STORAGE_ACCOUNT_NAME, AZURE_STORAGE_ACCOUNT_KEY,
# ZEROFS_CONTAINER, ZEROFS_PREFIX and ZEROFS_PASSWORD.
---
# zerofs.toml: TOML with `${VAR}` substitution from the container's env (the Secret above).
# `[cache]`,
# `[storage]`, `[servers]` are required by ZeroFS itself.
#
# UNVERIFIED until the first real cluster apply: that ZeroFS expands `${VAR}` in this file at all
# (rather than wanting the values inline or as flags). The BACKEND is settled — upstream documents
# `azure://container/path` with an `[azure]` section taking `storage_account_name`/
# `storage_account_key`, and documents env substitution for exactly these keys. If the pod
# crash-loops on config, read its logs and check the
# upstream README's config example before assuming the Secret values are wrong.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zerofs-config
  namespace: kloudlite-git-system
data:
  zerofs.toml: |
    [cache]
    dir = "/var/cache/zerofs"
    disk_size_gb = 10.0
    memory_size_gb = 1.0

    [storage]
    # Azure Blob, not S3: this platform's object storage IS the blob account every other tier
    # already writes to (`KLOUDLITE_GIT_S3_URL=az://rustic-git`), so ZeroFS points at the same
    # account. `azure://{container}/{prefix}` — the prefix keeps the homes LSM tree in its own
    # keyspace inside a container the rest of the platform also uses, so no container has to be
    # created by hand and nothing here can collide with registry blobs or repo databases.
    url = "azure://${ZEROFS_CONTAINER}/${ZEROFS_PREFIX}"
    # NOT optional and NOT rotatable: every extent is encrypted with a key derived from this, so
    # losing it loses every home in the region. It lives in the `zerofs-store` Secret beside the
    # storage credentials — back BOTH up somewhere the cluster's own loss cannot take with it.
    encryption_password = "${ZEROFS_PASSWORD}"

    [azure]
    storage_account_name = "${AZURE_STORAGE_ACCOUNT_NAME}"
    storage_account_key = "${AZURE_STORAGE_ACCOUNT_KEY}"

    [servers.nfs]
    addresses = ["0.0.0.0:2049"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerofs
  namespace: kloudlite-git-system
  labels:
    app: zerofs
spec:
  replicas: 1 # see header: SlateDB single-writer, never raise this
  # Recreate, not the default RollingUpdate: a rolling update surges a SECOND pod against the same
  # SlateDB prefix before the old one terminates, and that is the exact two-writer fencing the
  # header forbids — `replicas: 1` does not prevent surge. A brief outage on every edit is the
  # price, and the availability ruling above already accepts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zerofs
  template:
    metadata:
      labels:
        app: zerofs
    spec:
      # Pinned to the control plane on purpose: it hosts no workspaces, so it is the node a
      # dead-node drill or a pool-node reboot never touches. A worker dying with ZeroFS on it
      # moved the export mid-flight once and left every other node's NFS mount answering EIO
      # (stale handles from the old server) until the agents were restarted. The taint the
      # control plane carries is tolerated here and nowhere else.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: zerofs
          # Pinned to the latest release as of 2026-09-01 (github.com/Barre/ZeroFS). Never
          # `:latest` — see agent-daemonset.yaml's comment on the same class of bug (two pods
          # silently on different builds).
          #
          # NOTE the tag has NO `v`: upstream's SOURCE tags are `v2.3.2` but the published image
          # tags are `2.3.2`, and `ghcr.io/barre/zerofs:v2.3.2` 404s. The `@sha256:` suffix — not
          # the tag — is now the pin: a tag upstream can move would put an unreviewed build in
          # front of every owner's home directory.
          image: ghcr.io/barre/zerofs:2.3.2@sha256:3e55849c76a9243253660c3479ac2c96c7e69843dc3432512212650004a821ae
          command: ["zerofs", "run", "-c", "/etc/zerofs/zerofs.toml"]
          env:
            # ZeroFS logs through `tracing` too: no colour codes in the collector's body, and the
            # per-connection accept line (one per NFS client reconnect) is not a signal.
            - { name: NO_COLOR, value: "1" }
            - { name: RUST_LOG, value: "info,zerofs_nfsserve::tcp=warn" }
          envFrom:
            - secretRef:
                name: zerofs-store
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # No CPU limit on purpose — a throttled NFS server stalls every home in the region
              # rather than shedding load. The MEMORY limit is the point: this pod is pinned to the
              # control plane, so an unbounded working set pushes the node into pressure and takes
              # the API server with it. zerofs.toml pins memory_size_gb = 1.0 (the process's own
              # in-memory cache), so a 1Gi limit OOM-kills it as that cache warms — the limit has to
              # cover the cache PLUS the process's own RSS. 1 GiB cache + ~1 GiB headroom for
              # SlateDB buffers and NFS I/O = 2Gi.
              memory: 2Gi
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          # The Service must not route to a pod that has not opened its SlateDB yet (a cold start
          # replays the LSM tree): an agent's `mount` would get a connection refused and the whole
          # node's homes would fail to mount. A TCP accept on 2049 is exactly "NFS is serving".
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 5
            periodSeconds: 10
          # ponytail: no liveness probe — neither rpcinfo nor nc is in this image, and a bare TCP
          # connect only duplicates the readiness probe above while adding a way to restart the
          # single pod every home in the region depends on. Add one (a real NULL RPC, e.g.
          # `rpcinfo -T tcp 127.0.0.1 100003 3`) the day the image carries rpcinfo.
          volumeMounts:
            - name: config
              mountPath: /etc/zerofs
              readOnly: true
            # The container runs as uid 1001 and needs this writable — see upstream README.
            - name: cache
              mountPath: /var/cache/zerofs
      volumes:
        - name: config
          configMap:
            name: zerofs-config
        # Cache, not the durable copy — the durable copy is the S3 bucket above. Losing this
        # volume on a reschedule costs a cold cache, not data.
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zerofs
  namespace: kloudlite-git-system
spec:
  selector:
    app: zerofs
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
