# Everything on AKS. The ownership map's writer is elected by lease (`ownership::lease`), so there
# is no leader StatefulSet, no order between the objects here, and `deploy/roll.sh` is one apply.
apiVersion: v1
kind: Namespace
metadata:
  name: rustic-git
---
# Stable identity per pod is the point of a StatefulSet here, not just the disks: a Deployment's
# rolling update briefly runs the old and new pod together, and for the repos they share that
# means the new pod fences the old one mid-request. A StatefulSet never runs two pods with the
# same ordinal, so a repo's database is handed over rather than contended.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustic-git-srv
  namespace: rustic-git
spec:
  serviceName: rustic-git
  # Every ordinal holds repositories, and every ordinal is a candidate for the ownership map's
  # writer: whichever pod holds the lease at `cluster/leader` opens the map, the rest follow it
  # read-only. There is no preferred ordinal — the object store's conditional put decides.
  replicas: 3
  selector:
    matchLabels: { app: rustic-git, role: server }
  template:
    metadata:
      labels: { app: rustic-git, role: server }
      # Plain scrape annotations, no Prometheus Operator assumed (a ServiceMonitor would need the
      # CRD installed first; kube-prometheus-stack and the Azure managed agent both honour these).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # None of these pods talks to THIS cluster's API server (the api tier reaches the k3s
      # cluster with its own mounted kubeconfig), so a projected token is a credential with no
      # user — and one an RCE in the git server would otherwise find at a well-known path.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90 # 15s preStop sleep + pool.close() flush + drain
      # uid 1001 is the image's `rustic` user. fsGroup is what makes the mounted Secret readable
      # and the emptyDir writable without root: the kubelet chowns volume contents to this group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      affinity:
        # Spread the fleet across hosts so one node's failure takes one pod with it: pods packed
        # onto one host would all go at once, and every repo they hold with them.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: rustic-git } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rustic-git
          image: ghcr.io/kloudlite/rustic-git:77fb1fc4dc385f2a832b6c019c6bce0847d95048@sha256:8335693ab96b92ca664daf7312fb098eeb88f3a230f2ea53711eae0ffd72b312
          args: ["serve"]
          env:
            # Tokio sizes its pool from the NODE's cores — 64 threads inside a
            # 100m-CPU pod. Four matches what the request can actually run.
            - name: TOKIO_WORKER_THREADS
              value: "4"
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # Close a repo's database once nobody has touched it for this long. Reopening costs
            # a few object-store round trips; holding it costs a memtable. 5 minutes is the
            # default in code, set explicitly here so it is visible where it is operated.
            - name: RUSTIC_GIT_WARM_TTL_SECS
              value: "300"
            # Hard ceiling on simultaneously open databases, so a burst across many repos cannot
            # pin one memtable each. The least recently used is closed once this is passed.
            # Kept well under the memory limit: SlateDB's memtable can reach l0_sst_size_bytes
            # (64MB) per database, so 16 bounds the worst case at 1GB against a 4GB limit. Real
            # usage is far lower — refs are 40-byte strings — but the ceiling should not equal
            # the limit, because exceeding it is an OOMKill rather than an eviction.
            - name: RUSTIC_GIT_MAX_WARM
              value: "16"
            # Where the registry's auth challenge tells a client to fetch its token.
            # It must be a URL the CLIENT can reach, not this pod's address — a
            # `docker login` follows the realm verbatim, so the in-code default
            # (localhost:8080) sends every client somewhere it cannot go.
            - name: RUSTIC_GIT_EXTERNAL_URL
              value: https://cr.khost.dev
            # Signs the registry's bearer tokens. Every node must share ONE key: `/v2/token` is
            # answered by whichever node the request lands on, while the push that presents the
            # token routes to the node owning the image. Unset, each pod invents its own secret at
            # startup, so a token minted by one is refused by the other and every push 401s after
            # a successful login.
            - name: RUSTIC_GIT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-jwt, key: secret } }
            - name: RUSTIC_GIT_HOST_KEY
              value: /etc/rustic-git/host_key
            - name: RUSTIC_GIT_CACHE_DIR
              value: /var/cache/rustic-git
            # Each region's agent token is only honoured from that region's node addresses (the k3s
            # VMs' public IPs — see deploy/k3s/README.md). A leaked token is useless elsewhere.
            - name: RUSTIC_GIT_AGENT_SOURCES
              value: "centralindia-k3s=40.80.82.158/32,20.219.22.61/32"
            - name: RUSTIC_GIT_PEER_SVC
              value: rustic-git.rustic-git.svc.cluster.local
            - name: RUSTIC_GIT_SELF
              valueFrom: { fieldRef: { fieldPath: metadata.name } }   # the stable pod name, which the lease records as the holder
            # This cluster runs networkPolicy: none, so anything on the pod network can reach the
            # peer ports; the shared secret is what keeps a stray client from forwarding traffic in.
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # The git nodes are where invalidation happens: a push drops the repo's `refs` entry,
            # and a visibility flip or delete bumps its generation. Without this the api tier caches
            # answers that nothing can ever purge, and `set-visibility private` silently orphans
            # nothing — a disabled cache reports success, because for reads that is the correct
            # behaviour. Same secret the api tier reads.
            - name: RUSTIC_GIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # The owning node copies a repo's pre-move pull requests out of the directory on first
            # touch, so THIS is where the migration reads from. Deliberately NOT `optional: true`:
            # an absent variable is indistinguishable from "single-node, nothing to migrate", and
            # that path records the repo as migrated with zero changes -- orphaning every existing
            # pull request and restarting numbering at 1 into collisions. A missing secret must
            # stop the pod, not quietly empty the repositories. Configured-but-unreachable is the
            # other case and is already loud: git keeps serving, pull routes fail until restart.
            # Removable once every repo carries `meta/pulls_migrated` and `pulls_for` is deleted.
            - name: RUSTIC_GIT_MONGO_URI
              valueFrom: { secretKeyRef: { name: rustic-git-mongo, key: uri } }
            # Sized from measurement, not taste. The receive path buffers the whole pack, and peak
            # memory ran about 3x the pack size: a 500MB push peaked at 1.46Gi. The default cap is
            # 2GiB, which is well past what the 4Gi limit survives — a 1.5GB push OOMKilled the pod
            # (exit 137) and took every repo it owned down with it, answering the client 502.
            # 512MB keeps the peak near 1.5Gi and turns that crash into a clean 413. Raise it only
            # after the receive path streams to storage instead of buffering.
            - name: RUSTIC_GIT_MAX_BODY
              value: "536870912"
            # Metrics on a port of their own: 8081 requires the peer secret, which Prometheus
            # cannot present, and the scrape text enumerates every repo this node has touched.
            - name: RUSTIC_GIT_METRICS_ADDR
              value: 0.0.0.0:9464
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ssh, containerPort: 2222 }
            - { name: peer, containerPort: 8081 }
            - { name: peer-stream, containerPort: 8082 }
            - { name: metrics, containerPort: 9464 }
          # On termination Kubernetes removes the pod from endpoints and sends SIGTERM at once.
          # Sleep first so endpoint removal reaches every node's DNS (TTL 5s) plus every node's
          # membership cache (TTL 2s) plus margin, so no peer forwards into a dying pod. Then the
          # SIGTERM handler RELEASES the pool first — so the peer that is next sent one of this
          # pod's repos claims and opens it without fencing us — and only then drains the listeners.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          # Readiness gates DNS membership: a pod is in the headless Service only while Ready, so
          # this is what puts a restarted pod back into every peer's view. 5s keeps that gap short
          # without hammering /healthz.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          # Liveness must not police STARTUP, only a process that has gone bad after it was
          # serving. Without a startup allowance it did both: a pod that wins the lease replays the ownership
          # map's WAL before it can grant, that replay outgrew the probe window, and liveness
          # killed the pod mid-replay — every time, so it could never finish and never recover.
          # An hour-long crash loop that no amount of restarting could clear.
          # startupProbe holds liveness off until the process answers once (40 x 15s = 10 minutes of
          # grace); after that liveness takes over unchanged. failureThreshold on liveness is
          # raised too, so one slow /healthz under load is not a kill on its own.
          #
          # Ten minutes, not the 150s it used to be, because the lease holder replays the ownership map's
          # WAL before it can answer and 150s was tighter than that work: at 25,000 WAL objects it
          # was killed mid-replay every time, restarted, and never finished -- a crash loop caused
          # by the probe rather than by the process. The WAL is bounded again, so a healthy pod
          # now takes the writer in about 30 seconds; this budget exists for the case where something makes
          # it slow again, and it should only ever be wrong in the forgiving direction.
          # periodSeconds is the RESOLUTION of readiness, not just the polling cost: at 15s a
          # process that is listening in 1.8s still sat un-Ready for 15, and a three-pod ordered
          # rollout paid that per pod for nothing. 5s x 120 keeps the same 10-minute ceiling while
          # letting a healthy pod be Ready in about five seconds.
          #
          # The two KILLING probes answer on /livez, not /healthz. /healthz is un-ready whenever
          # no live leader exists — a correct readiness answer, and a catastrophic liveness one:
          # it is the same bit on every pod at the same time, so a leaderless minute (a lapsed
          # lease, an election that has not settled) would restart the whole fleet at once and
          # take the election with it. /livez answers only "can this process still reach the
          # object store", which is per-pod and is what a restart can actually fix.
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 30
            failureThreshold: 5
          # The REQUEST is a scheduling floor, not a budget: it is what the scheduler subtracts from
          # a node whether or not the pod ever uses it. At 1Gi x 3 this fleet could not place its
          # third pod on a cluster with ample real headroom — measured usage is 5-8Mi idle, and the
          # nodes were ~77% *requested* while barely used. 384Mi covers idle plus the warm
          # memtables of a normally busy node with room to spare.
          #
          # The LIMIT stays 4Gi and must: the receive path buffers a whole pack, and a 500MB push
          # was measured peaking at 1.46Gi (see RUSTIC_GIT_MAX_BODY above). Lowering the limit to
          # match the request would turn that push into an OOMKill, taking every repo the pod owns
          # with it. Burst is exactly what the gap between request and limit is for.
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: hostkey, mountPath: /etc/rustic-git, readOnly: true }
            - { name: cache, mountPath: /var/cache/rustic-git }
          # The image's RUSTIC_GIT_CACHE_DIR pins /var/cache/rustic-git, so the mount must land
          # exactly there — with a read-only root the directory has to be a mount.
      volumes:
        # One SSH host key shared by every pod. Per-pod keys would make each pod a different
        # host to ssh, and clients would report a changed host key depending on where they land.
        - name: hostkey
          secret:
            secretName: rustic-git-hostkey
            # 0440, not 0400: the file is root-owned and the process is uid 1001 — group read via
            # fsGroup is the only way a non-root process opens it.
            defaultMode: 0440
        # Pack cache: local and disposable. Every byte is re-fetchable from blob storage, and the
        # pods must be free to land on any node instantly. This was a per-pod ReadWriteOnce disk;
        # on the first roll under load a pod was rescheduled across nodes and waited 33 seconds
        # for the disk to detach from the old node and attach to the new one (Multi-Attach
        # error), during which every repo it owned had no owner. A warm cache is not worth a
        # 30-second outage per reschedule.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
---
# A drain may take one server at a time. Each server owns repos; losing two at once doubles the
# set of repos that must be force-claimed by the survivors, and the rolling update already moves
# them one ordinal at a time — this makes eviction obey the same pace.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rustic-git-srv
  namespace: rustic-git
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: rustic-git, role: server }
---
# Headless: gives each pod a stable DNS name (rustic-git-0.rustic-git.rustic-git.svc) and, more
# importantly, makes the pod endpoints individually addressable for the ingress's hash routing.
apiVersion: v1
kind: Service
metadata:
  name: rustic-git
  namespace: rustic-git
spec:
  clusterIP: None
  # Peers must resolve each other the moment the process binds, not when the readiness probe first
  # succeeds. Gating peer DNS on readiness left a restarted pod unreachable to its peers for ~20s —
  # longer than LEASE_TTL — so claims failed and leases lapsed while it was merely starting. Safe:
  # the peer port is secret-guarded, ownership is decided by the map rather than by reachability,
  # and a node that cannot serve already answers 503 on its own health check.
  publishNotReadyAddresses: true
  selector: { app: rustic-git }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: ssh, port: 2222, targetPort: ssh }
    - { name: peer, port: 8081, targetPort: peer }   # named so it resolves; the code queries _peer._tcp.rustic-git.rustic-git.svc.cluster.local:8081
---
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-http
  namespace: rustic-git
spec:
  # Cluster-local HTTP for the two Ingress objects (git smart HTTP on the app's host, /v2 on the
  # registry's). Every pod serves; the role selector is kept so a future non-serving role can opt out.
  selector: { app: rustic-git, role: server }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-lb
  namespace: rustic-git
spec:
  type: LoadBalancer
  # Every pod serves; the role selector is kept so a future non-serving role can opt out.
  selector: { app: rustic-git, role: server }
  # SSH only. HTTP used to be published here too, straight to the internet with no TLS, which
  # let Basic credentials travel in the clear past both ingresses; HTTP now reaches the fleet
  # only through rustic-git-http behind an Ingress. SSH has no ingress to hide behind.
  ports:
    # Port 22 is what `git@host:owner/repo.git` means — scp-style remotes carry no
    # port, so anything else forces every user to write `ssh://…:2222/…` instead.
    # The load balancer does the mapping; the container still listens on 2222 and
    # needs no privileged bind.
    - { name: ssh, port: 22, targetPort: ssh }
    # Kept so remotes already written against 2222 keep working.
    - { name: ssh-alt, port: 2222, targetPort: ssh }
---
# Kept for a cluster that enforces NetworkPolicy; this one (networkPolicy: none) does not, which
# is why the peer ports also require a secret.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustic-git-peers-only
  namespace: rustic-git
spec:
  podSelector:
    matchLabels: { app: rustic-git }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: rustic-git }
      ports:
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 8082 }
    # The api tier fronts these nodes and every cache miss goes to the peer listener, so it needs
    # 8081 — and only 8081: it takes no part in leases or routing (8082).
    - from:
        - podSelector:
            matchLabels: { app: rustic-git-api }
      ports:
        - { protocol: TCP, port: 8081 }
    # The merge worker asks the owning node to move a ref, which is a peer route.
    # Also 8081 only: it holds no lease and takes no part in routing either.
    - from:
        - podSelector:
            matchLabels: { app: rustic-git-worker }
      ports:
        - { protocol: TCP, port: 8081 }
    - ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 2222 }
    # Prometheus presents no secret, so metrics have their own port — and a rule with no `from:`
    # would open it to every pod in the cluster. Only the monitoring namespace may scrape it.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 9464 }
---
# The read API: no repo state, no ownership, no local packs. A Deployment, not a StatefulSet —
# this tier owns no repo and holds no lease, so pods are interchangeable and any of them can
# answer any request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-api
  namespace: rustic-git
spec:
  replicas: 2
  selector:
    matchLabels: { app: rustic-git-api }
  template:
    metadata:
      labels: { app: rustic-git-api }
      # Plain scrape annotations, no Prometheus Operator assumed (a ServiceMonitor would need the
      # CRD installed first; kube-prometheus-stack and the Azure managed agent both honour these).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # None of these pods talks to THIS cluster's API server (the api tier reaches the k3s
      # cluster with its own mounted kubeconfig), so a projected token is a credential with no
      # user — and one an RCE in the git server would otherwise find at a well-known path.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      affinity:
        # Preferred, not required: with two replicas and a small node pool a required rule would
        # leave the second pod Pending during a node's absence, which is worse than two on a host.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: rustic-git-api } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/kloudlite/rustic-git:77fb1fc4dc385f2a832b6c019c6bce0847d95048@sha256:8335693ab96b92ca664daf7312fb098eeb88f3a230f2ea53711eae0ffd72b312
          # Its own binary, not a subcommand: this process cannot open a repository
          # for writing, because none of that code is linked into it.
          command: ["rustic-git-api"]
          ports:
            - { name: http, containerPort: 8090 }
          env:
            # Tokio sizes its pool from the NODE's cores — 64 threads inside a
            # 100m-CPU pod. Four matches what the request can actually run.
            - name: TOKIO_WORKER_THREADS
              value: "4"
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # Browse routes live on the git nodes' PEER listener (8081), never the public one, so
            # this must point at the peer Service, not the LoadBalancer.
            - name: RUSTIC_GIT_UPSTREAM
              value: http://rustic-git:8081
            - name: RUSTIC_GIT_API_ADDR
              value: 0.0.0.0:8090
            # A separate listener: 8090 is what the ingress forwards /v1 to.
            - name: RUSTIC_GIT_METRICS_ADDR
              value: 0.0.0.0:9464
            # Who may register regions (admin-gated route); everything else is owner-scoped.
            - name: RUSTIC_GIT_WORKSPACES_ADMINS
              value: karthik@kloudlite.io
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # Optional: without it every request still answers, just always from a git node
            # instead of the cache. See the Redis Deployment/config below for the policy this
            # relies on.
            - name: RUSTIC_GIT_REDIS_URL
              # `optional` is what makes the comment above true: without it a missing secret keeps
              # the pod out of Ready forever, which is not "answers without the cache".
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # Teams and users live in Cosmos (Mongo API). Optional for the same reason
            # the cache is: without it the browse routes still answer and only /v1/*
            # reports unavailable. A database outage must not stop reads.
            - name: RUSTIC_GIT_MONGO_URI
              valueFrom: { secretKeyRef: { name: rustic-git-mongo, key: uri, optional: true } }
            - name: RUSTIC_GIT_MONGO_DB
              value: kloudlite
            # Signs the identity tokens the web app presents — and, on the git
            # nodes, the registry's bearer tokens. One key across every process
            # that mints or verifies one. Required: a pod that starts without it
            # mints tokens nobody else can verify, which is a silent outage.
            - name: RUSTIC_GIT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-jwt, key: secret } }
            # The workspace CRDs live in the k3s workload cluster, not this one. `Config::infer`
            # tries a kubeconfig BEFORE in-cluster config, so pointing KUBECONFIG at the mounted
            # file is what makes /v1 write to that cluster instead of this pod's own API server —
            # which has none of the CRDs and would 404 every create.
            #
            # ponytail: one kubeconfig, so one workload cluster. The pull design
            # (docs/superpowers/specs/2026-08-26-cluster-sync-design.md) replaces this with each
            # cluster syncing its own desired state, and this Secret goes away with it.
            - name: KUBECONFIG
              value: /etc/rustic-git/k3s/config
            # ClickStack. Optional by design: without these the admin process runs exactly as
            # before and every /admin/history route answers 503 (crates/workspaces/src/history).
            # verify: the ClickHouse Service is created by the ClickHouse OPERATOR from the CR,
            # not by a chart template, so `helm template` cannot prove this name. Confirm it with
            # `kubectl -n clickstack get svc` before the first roll — a wrong host here is a
            # silent 503 on every /admin/history route, which is exactly what an unset variable
            # looks like.
            - name: RUSTIC_GIT_CLICKHOUSE_URL
              value: http://clickstack-clickhouse.clickstack.svc:8123
            - name: RUSTIC_GIT_CLICKHOUSE_USER
              valueFrom: { secretKeyRef: { name: rustic-git-clickhouse, key: user, optional: true } }
            - name: RUSTIC_GIT_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: rustic-git-clickhouse, key: password, optional: true } }
            # Only for the "Open in HyperDX" link — unset means no link, never a dead one.
            - name: RUSTIC_GIT_HYPERDX_URL
              value: https://hyperdx.dev.kloudlite.io
            # The region the MOUNTED KUBECONFIG points at, and the label that cluster's watch
            # stamps on its event rows — this process's own cluster is always `central`, hard-coded
            # in bins/api/src/main.rs, so this is never that. It must equal the `RUSTIC_GIT_REGION`
            # on that region's deploy/k3s/otel-agent.yaml, or a chart joins telemetry to events
            # from a different region and neither side looks wrong.
            - name: RUSTIC_GIT_REGION
              value: westeurope-k3s
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          # /healthz on this tier is a constant 200 (api/mod.rs): cheap to poll, and it still
          # proves the process is accepting connections, which is what a wedged runtime loses.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/rustic-git }
            - { name: k3s-kubeconfig, mountPath: /etc/rustic-git/k3s, readOnly: true }
      volumes:
        # The image's RUSTIC_GIT_CACHE_DIR points here and the root filesystem is read-only, so
        # the directory must be a mount even though this tier reads repos through the git nodes
        # and writes almost nothing locally. Small on purpose.
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        # A ServiceAccount token for the k3s cluster, scoped to the rustic-git.io CRDs plus
        # read-only nodes/pods for placement. Not optional: without it /v1 workspace routes answer
        # 503, which reads as "feature missing" rather than "misconfigured".
        - name: k3s-kubeconfig
          secret:
            secretName: rustic-git-k3s-kubeconfig
            defaultMode: 0400
---
# A drain may not evict both api pods at once: this tier is the whole browse API and every /v1
# write, and without the budget a two-node drain is a reschedule-long outage of both.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rustic-git-api
  namespace: rustic-git
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: rustic-git-api }
---
# The merge worker. Scale it with `replicas`, freely: every job is claimed
# atomically, so two pods can never take the same one. Each pod also runs several
# lanes (RUSTIC_GIT_WORKER_CONCURRENCY), which is the same mechanism — to the
# database a lane and a pod are indistinguishable. Reach for lanes first: they
# cost a task, where a pod costs a container.
#
# It owns no repo and holds no lease. It reads objects from the same bucket the
# git nodes use and adds packs to it — content-addressed, so any process may — but
# it never writes a ref. The ref move is asked of the node that owns the repo,
# which is what keeps one writer per repo and keeps branch protection in force.
#
# Listing index markers (index/{public|private}/{repo|img}/{owner}/{name}) are
# reconciled here: the GC sweep heals structural drift (missing/orphaned markers,
# stale stats) within one sweep period; visibility drift (accuracy of the
# public/private marker) heals when the owning node next opens the repo or on
# its ~30s warm-repo reconcile lane.
#
# It also consumes the `events` Redis stream (XREADGROUP/XACK, XAUTOCLAIM for
# crashed consumers) to get nudged about merge work quickly, but the stream is
# never the record: a periodic ~60s pull_to_check Mongo sweep is the actual
# floor, verified to still find all queued work with Redis entirely down. That
# floor is what protects this worker from the Redis instance's eviction
# policy: verified against the live rustic-git-redis (Azure Managed Redis,
# Enterprise tier) via `az redisenterprise database list`, since Azure blocks
# CONFIG GET on this SKU — the policy is VolatileLRU, not noeviction. Stream
# keys carry no TTL, so VolatileLRU currently leaves them alone (it only
# evicts keys with an expire set), but nothing enforces that going forward —
# any dropped stream entry is fine because the sweep below still finds the work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-worker
  namespace: rustic-git
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustic-git-worker }
  # Surge, never dip: with one replica the default 25%/25% rounds to "kill the old pod, then
  # start the new one", and every merge clicked in that window waits for the stranded-job
  # re-announce instead of running. The two pods overlapping is fine — jobs are claimed atomically.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: rustic-git-worker }
      # Plain scrape annotations, no Prometheus Operator assumed (a ServiceMonitor would need the
      # CRD installed first; kube-prometheus-stack and the Azure managed agent both honour these).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # None of these pods talks to THIS cluster's API server (the api tier reaches the k3s
      # cluster with its own mounted kubeconfig), so a projected token is a credential with no
      # user — and one an RCE in the git server would otherwise find at a well-known path.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ghcr.io/kloudlite/rustic-git:77fb1fc4dc385f2a832b6c019c6bce0847d95048@sha256:8335693ab96b92ca664daf7312fb098eeb88f3a230f2ea53711eae0ffd72b312
          command: ["rustic-git-worker"]
          env:
            - name: RUSTIC_GIT_METRICS_ADDR
              value: 0.0.0.0:9464
            # Tokio sizes its pool from the NODE's cores — 64 threads inside a
            # 100m-CPU pod. Four matches what the request can actually run.
            - name: TOKIO_WORKER_THREADS
              value: "4"
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # The peer listener, like the api tier: the merge route is peer-only.
            - name: RUSTIC_GIT_UPSTREAM
              value: http://rustic-git:8081
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            - name: RUSTIC_GIT_CACHE_DIR
              value: /var/cache/rustic-git
            # Optional here too (see api/git tiers): without it a lane still runs, just on
            # `SWEEP_EVERY` alone instead of the stream nudge — see the startup warning in
            # `worker.rs` for why that is now a performance regression worth noticing, not a
            # silent default.
            - name: RUSTIC_GIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # Jobs are mostly waiting — on the fleet, on the database — so a lane
            # is cheap. Raise it before adding replicas.
            #
            # CEILING 64: worker.rs clamps this to 1..64, but the liveness probe below
            # compares against the raw value it reads here. Set it above 64 and the
            # worker runs 64 lanes, writes 64 heartbeat files, and the probe demands
            # more than that forever — a restart loop. Keep it within 1..64.
            - name: RUSTIC_GIT_WORKER_CONCURRENCY
              value: "4"
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          # The worker has no listener, so liveness counts heartbeat files instead: each lane
          # touches worker-alive.{i} at the top of every loop and again before EVERY event it
          # handles (see `lane` in worker.rs), and this fails unless ALL
          # RUSTIC_GIT_WORKER_CONCURRENCY of them are fresh — so one lane wedging restarts the pod
          # rather than hiding behind its siblings.
          #
          # The window is sized by the one silence a lane is allowed: a single merge job. The
          # worker kills a job itself at RUSTIC_GIT_MERGE_JOB_TIMEOUT (25 min by default, see
          # `merge_worker.rs`), so a lane that has not touched its file in 30 minutes is not
          # running a slow job — it is stuck somewhere no ceiling covers (a hung Redis call, a
          # deadlock), and the restart is the only cure. Lowering this below the job ceiling
          # restarts the pod mid-merge for nothing. One failure is enough: file mtimes are not a
          # flaky signal, and three strikes only pushed the restart to 33 minutes.
          #
          # $RUSTIC_GIT_WORKER_CONCURRENCY, not $(...): kubelet expands $(VAR) in a container's
          # command/args but NOT in a probe's exec command, so the value has to come from the
          # shell reading the container's own environment — which is the same env block below,
          # and stays correct if that number is changed in one place.
          livenessProbe:
            exec:
              command: ["sh", "-c", "test \"$(find /var/cache/rustic-git -maxdepth 1 -name 'worker-alive.*' -mmin -30 2>/dev/null | wc -l)\" -ge \"$RUSTIC_GIT_WORKER_CONCURRENCY\""]
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/rustic-git }
      volumes:
        # Scratch only: packs are read from and written to object storage, and
        # anything here can be rebuilt by fetching again. Bounded so a leak here
        # evicts this pod rather than filling the node's disk.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
---
# Redis provisioning note (no manifest here — this cluster uses a managed instance): it MUST run
# `maxmemory-policy volatile-lru`, and this is load-bearing, not tuning. Data keys all carry a
# TTL; the per-repo generation counters that guard them carry none. Under volatile-lru only keys
# with an expiry are eviction candidates, so a counter is never evicted while the entries it
# guards still exist. Under allkeys-lru an evicted counter reads back as generation 1 — the
# pre-purge value — and every stale entry it was meant to orphan becomes visible again. Whoever
# provisions the Redis instance must set this.
#
# Two things this Service does NOT fix, both load-bearing on how it's exposed:
#   - loadBalancerSourceRanges below MUST be restricted to Cloudflare's published ranges, or the
#     WAF/rate-limiting in front of it is one direct `curl` to the LB IP away from irrelevant.
#   - SSH (port 2222, on the rustic-git-lb Service above) does not go through Cloudflare at all —
#     it is unrated and unshielded on the LoadBalancer regardless of this restriction.
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-api
  namespace: rustic-git
spec:
  # ClusterIP until Cloudflare fronts this tier. Switching to LoadBalancer without the WAF in
  # front of it exposes the browse API with no rate limiting at all; restore `type: LoadBalancer`
  # together with the real loadBalancerSourceRanges below, not before.
  type: ClusterIP
  # NOT A CIDR, ON PURPOSE. The API server validates every entry of loadBalancerSourceRanges as a
  # CIDR (pkg/apis/core/validation/validation.go, IsValidCIDRForLegacyField) and rejects the object
  # if one doesn't parse — so this placeholder makes `kubectl apply` fail closed with a clear
  # error instead of silently applying with the field empty, which would open this LoadBalancer to
  # 0.0.0.0/0 and make the Cloudflare WAF above bypassable by anyone who curls the LB IP directly.
  # Replace with Cloudflare's published ranges (https://www.cloudflare.com/ips/) before applying.
  # Do not delete this field to "fix" the apply error — an absent field is silently open, which is
  # worse than a loud rejection.
  # loadBalancerSourceRanges: ["<cloudflare-cidrs>"]   # required when type becomes LoadBalancer
  selector: { app: rustic-git-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The admin process's authority over ITS OWN cluster (AKS) — distinct from the k3s ClusterRole
# `rustic-git-admin` already holds in deploy/k3s/api-rbac.yaml, which is a different cluster
# entirely. Scoped tightly: get/list/patch, only on the five Deployments/StatefulSet
# `admin::workloads::KNOWN_CENTRAL` names — not create or delete, because a roll only ever
# patches an object that already exists, and resourceNames so a bug here cannot touch any other
# workload in the namespace (rustic-git-web lives in this same namespace too, see
# deploy/rustic-git-web.yaml, hence it is on this list rather than needing a second Role).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-admin
  namespace: rustic-git
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rustic-git-admin-workloads
  namespace: rustic-git
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["rustic-git-srv"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["rustic-git-api", "rustic-git-worker", "rustic-git-web", "rustic-git-admin"]
    verbs: ["get", "list", "patch"]
  # The Monitoring page scrapes each pod's own /metrics (deploy/alerts.md) instead of assuming a
  # Prometheus, so it needs the pod list to find the IPs and the annotations — and the same list
  # carries `restartCount`, which is the restarts column. Read-only, no `resourceNames` (a list
  # cannot be name-restricted), and namespaced to `rustic-git`: pod metadata here names no Secret,
  # and nothing on this page ever writes.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rustic-git-admin-workloads
  namespace: rustic-git
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rustic-git-admin-workloads
subjects:
  - kind: ServiceAccount
    name: rustic-git-admin
    namespace: rustic-git
---
# The superadmin-only surface. Same image and binary as rustic-git-api, one env apart
# (RUSTIC_GIT_API_ROLE=admin) — see CLAUDE.md "Admin APIs live on their own server". One replica:
# losing this pod for a few minutes during a roll is acceptable (nothing here is on any ordinary
# request's path), and two would mean two places RUSTIC_GIT_WORKSPACES_ADMINS seeds from, which
# is harmless but pointless. No podAntiAffinity: with exactly one pod a spread rule can never fire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-admin
  namespace: rustic-git
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustic-git-admin }
  template:
    metadata:
      labels: { app: rustic-git-admin }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      # Unlike rustic-git-api: this process ALSO talks to its own cluster now
      # (admin::workloads' central-scope rolls), over a projected ServiceAccount token — nothing
      # to rotate, unlike the mounted k3s kubeconfig Secret it still uses for region CRDs. Bound
      # to the rustic-git-admin ServiceAccount and its namespaced Role below, get/list/patch on
      # exactly the workloads in admin::workloads::KNOWN_CENTRAL.
      serviceAccountName: rustic-git-admin
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: admin
          image: ghcr.io/kloudlite/rustic-git:77fb1fc4dc385f2a832b6c019c6bce0847d95048@sha256:8335693ab96b92ca664daf7312fb098eeb88f3a230f2ea53711eae0ffd72b312
          command: ["rustic-git-api"]
          ports:
            - { name: http, containerPort: 8090 }
          env:
            - name: TOKIO_WORKER_THREADS
              value: "2"
            # The only line that turns this binary into the admin process: mounts
            # api::admin::router() instead of api::router() and runs the superadmin bootstrap.
            - name: RUSTIC_GIT_API_ROLE
              value: admin
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            - name: RUSTIC_GIT_UPSTREAM
              value: http://rustic-git:8081
            - name: RUSTIC_GIT_API_ADDR
              value: 0.0.0.0:8090
            - name: RUSTIC_GIT_METRICS_ADDR
              value: 0.0.0.0:9464
            # The bootstrap: seeds these addresses into the directory's superadmins collection at
            # boot (Task 10). Unset here and the admin process starts with no administrator except
            # whoever the directory already lists — fine after the first boot, fatal on a fresh
            # cluster, so this must be set on THIS Deployment's first rollout.
            - name: RUSTIC_GIT_WORKSPACES_ADMINS
              value: karthik@kloudlite.io
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            - name: RUSTIC_GIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            - name: RUSTIC_GIT_MONGO_URI
              valueFrom: { secretKeyRef: { name: rustic-git-mongo, key: uri, optional: true } }
            - name: RUSTIC_GIT_MONGO_DB
              value: kloudlite
            - name: RUSTIC_GIT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-jwt, key: secret } }
            # Its own kubeconfig, bound to the rustic-git-admin ServiceAccount (Task 10) rather
            # than rustic-git-api's — the split RBAC only means something if the admin process
            # authenticates as the admin SA. Secret not created by this task; see
            # deploy/k3s/README.md for the rotation recipe rustic-git-k3s-kubeconfig already
            # documents, repeated for this name.
            - name: KUBECONFIG
              value: /etc/rustic-git/k3s/config
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/rustic-git }
            - { name: k3s-kubeconfig, mountPath: /etc/rustic-git/k3s, readOnly: true }
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: k3s-kubeconfig
          secret:
            secretName: rustic-git-admin-k3s-kubeconfig
            defaultMode: 0400
---
# rustic-git-admin has no repo-request path, so no PodDisruptionBudget: an eviction during a
# drain is exactly the "a few minutes' outage is fine" tradeoff replicas:1 above already made.
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-admin
  namespace: rustic-git
spec:
  type: ClusterIP
  selector: { app: rustic-git-admin }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# No admin Ingress on purpose: the admin api is reached only server-side by the web
# (RUSTIC_GIT_ADMIN_API_URL=http://rustic-git-admin) — the superadmin pages live on the app host
# at /superadmin. Nothing outside the cluster needs this process, so it has no public name.
---
# The registry gets a hostname of its own rather than a path on the app's.
#
# A registry client asks for `/v2/` and follows `Location` headers the server writes
# — all under `/v2/`, which is why that one prefix is the whole rule below. Sharing a
# host with an app would mean carving those paths out of the app's namespace and
# keeping them carved. A separate name
# also means the app's ingress annotations — body limits, buffering, timeouts — stay
# tuned for an app, while these stay tuned for pushing layers.
#
# TLS is terminated HERE, by a cert-manager certificate, and cr.khost.dev is a DNS-only
# record — deliberately NOT behind Cloudflare's proxy. It was proxied at first, and the
# edge refused what real clients send: buildx/containerd stream blobs over HTTP/2 with
# no declared length, which the free plan answers with 413 before this ingress ever
# sees the request, and anything over 100MB dies the same way. docker's own pushes
# (HTTP/1.1, Content-Length) worked, which is what made the gap easy to miss.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustic-git-registry
  namespace: rustic-git
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # NOT "true": despite the paragraph above, `dig cr.khost.dev` resolves to Cloudflare today, and
    # the proxy fetches the origin over plain HTTP — so a redirect here loops (308 → itself; it
    # took the registry down for ~2 minutes on 2026-08-23). Credentials are protected by the
    # edge's TLS, not ours. If the record ever goes DNS-only again, flip this to "true".
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # A layer is one request. The default 1m ceiling turns any real image into a 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # A large layer takes longer than 60s to receive.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Buffering a layer in nginx before passing it on doubles the disk it touches and
    # delays the first byte the registry sees.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Per client IP (real IP via deploy/ingress-nginx-config.yaml). A docker push is a handful of
    # large requests, not many small ones, so 50 r/s with a 5x burst never touches a real client;
    # a scraper hammering /v2 does. The region agents are exempt: they are the platform — this
    # list is the node addresses in RUSTIC_GIT_AGENT_SOURCES above, and must move with them.
    # (A third address, 4.224.42.0/32, sat here from 146b604 with no record of what it was and
    # no place in AGENT_SOURCES; dropped 2026-08-29 — being rate-limited is the worst it can
    # suffer, and a 429 from it is how we learn its name.)
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-whitelist: "40.80.82.158/32,20.219.22.61/32"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cr.khost.dev]
      secretName: rustic-git-registry-tls
  rules:
    - host: cr.khost.dev
      http:
        paths:
          # Only the container registry, `/v2/`. The git smart-HTTP surface and /healthz have no
          # business on this hostname; they stay on the app's ingress.
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: rustic-git-http
                port:
                  number: 80
---
# The AKS collectors: deploy/k3s/otel-agent.yaml, copied, with THREE changes and no others — keep
# it that way, and diff the two files when either is edited:
#
#   1. namespace `rustic-git` instead of `kube-system` (this cluster has no pooled nodes, so the
#      agent's DaemonSet namespace is meaningless here and the workloads it scrapes live here).
#   2. `RUSTIC_GIT_REGION: central` — the label bins/api hard-codes for this, its own, cluster.
#   3. the exporters point at the gateway's ClusterIP, not `otel.dev.kloudlite.io`: the gateway
#      runs in this same cluster, so leaving through the ingress would cost a TLS handshake and a
#      round trip through nginx to arrive back three namespaces away.
#
# The DaemonSet/Deployment split and the header table in the k3s file are this role too; neither
# is repeated.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rustic-git-otel-agent
  namespace: rustic-git
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rustic-git-otel-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy", "nodes/stats"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events", "resourcequotas"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rustic-git-otel-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rustic-git-otel-agent
subjects:
  - kind: ServiceAccount
    name: rustic-git-otel-agent
    namespace: rustic-git
---
# The per-node half.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustic-git-otel-agent
  namespace: rustic-git
data:
  config.yaml: |
    receivers:
      # Every pod already annotated `prometheus.io/scrape` — the same annotation the retired
      # on-request scrape used, so nothing had to be re-annotated for this.
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 15s
              kubernetes_sd_configs: [{ role: pod }]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                # This pod's node only. Discovery is cluster-wide on every node, so without this
                # each of N collectors would scrape all N nodes' pods and every counter would
                # arrive N times.
                - source_labels: [__meta_kubernetes_pod_node_name]
                  action: keep
                  regex: ${env:K8S_NODE_NAME}
                # The annotation names the metrics port; without this rewrite discovery would
                # scrape the pod's first declared port, which for most of ours is not 9464.
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: k8s_pod_name
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: k8s_namespace_name
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: k8s_node_name
      # Node and pod CPU/memory/filesystem, straight from THIS node's kubelet. This is why the
      # agent exports only the two gauges the kubelet cannot know (btrfs pool, running worktrees).
      kubeletstats:
        collection_interval: 15s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container]
      # Pod logs, so HyperDX has logs beside metrics. Our binaries keep plain tracing output;
      # `RUSTIC_GIT_LOG_FORMAT=json` makes them structured here without changing the code.
      filelog:
        include: [/var/log/pods/*/*/*.log]
        include_file_path: true
        operators:
          - type: container
            id: container-parser

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.node.name, k8s.deployment.name, k8s.container.name]
      # `region` is the one label every query in `history/series.rs` and `history/alerts.rs`
      # filters on, and nothing in the telemetry itself knows which region it is in — so it is
      # stamped here, per cluster.
      #
      # `k8s.node.name` is INSERTED (never upserted) from the downward API, and it is correct only
      # because this is a DaemonSet whose receivers all read the local node: every datapoint that
      # reaches this processor without the attribute came from this node, so naming it is a fact,
      # not a guess. The per-node alert rules — `PoolAlmostFull` and `NodeDiskAlmostFull`, which
      # group by `ResourceAttributes['k8s.node.name']` and take the worst node — read exactly this,
      # and `insert` leaves alone the datapoints kubeletstats and k8sattributes already labelled.
      # If this ever becomes a Deployment again, DELETE this line: it would relabel the whole
      # fleet as one node and both rules would silently report one node's disk as everyone's.
      resource:
        attributes:
          - { key: region, value: "${env:RUSTIC_GIT_REGION}", action: upsert }
          - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: insert }
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp:
        endpoint: http://clickstack-otel-collector.clickstack.svc:4318
        headers:
          authorization: "${env:OTEL_INGESTION_KEY}"
        # The collector's own queue is the buffer. Nothing of ours buffers telemetry — a dropped
        # sample is a gap in a chart, and building a durable queue for that would be the most
        # over-engineered thing in this repo.
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        metrics:
          receivers: [prometheus, kubeletstats]
          processors: [k8sattributes, resource, batch]
          exporters: [otlphttp]
        logs:
          receivers: [filelog]
          processors: [k8sattributes, resource, batch]
          exporters: [otlphttp]
---
# The cluster-wide half. Same image, same ServiceAccount, one receiver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustic-git-otel-cluster
  namespace: rustic-git
data:
  config.yaml: |
    receivers:
      k8s_cluster:
        collection_interval: 30s

    processors:
      # `region` only. NO `k8s.node.name` here: these metrics describe every node in the cluster
      # and already carry the right one per datapoint — stamping this pod's would be a lie.
      resource:
        attributes:
          - { key: region, value: "${env:RUSTIC_GIT_REGION}", action: upsert }
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp:
        endpoint: http://clickstack-otel-collector.clickstack.svc:4318
        headers:
          authorization: "${env:OTEL_INGESTION_KEY}"
        retry_on_failure: { enabled: true }
        sending_queue: { enabled: true, queue_size: 5000 }

    service:
      pipelines:
        metrics:
          receivers: [k8s_cluster]
          processors: [resource, batch]
          exporters: [otlphttp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rustic-git-otel-agent
  namespace: rustic-git
spec:
  selector:
    matchLabels: { app: rustic-git-otel-agent }
  template:
    metadata:
      labels: { app: rustic-git-otel-agent }
    spec:
      serviceAccountName: rustic-git-otel-agent
      # Control-plane nodes run pods too (the gateway, ZeroFS), and their logs and kubelet stats
      # are as interesting as any worker's — a collector that skipped them would leave a hole
      # nothing else fills.
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          # Pinned by index digest, like every other image in deploy/. Load-bearing beyond the
          # usual reproducibility argument: `k8s.node.cpu.utilization` and
          # `k8s.node.memory.utilization` — the two metrics the console's `cpu_used` and
          # `memory_used` series are built on — were removed from kubeletstats in a later release.
          # Bumping this tag without rewriting `history::series` empties both charts.
          image: otel/opentelemetry-collector-contrib:0.109.0@sha256:af0f72b2d2493fc17f06cf3bc136548240cd7ebb2c8b1c8a7be6f3eb03068389
          args: ["--config=/conf/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: RUSTIC_GIT_REGION
              # Edit per region before applying — this is the value every console query filters
              # on, and it must equal the region's `Region` CR id or its charts stay empty.
              value: central
            - name: OTEL_INGESTION_KEY
              # No `optional: true`: a collector that started without the key would export nothing
              # and look healthy, which is strictly worse than the CrashLoopBackOff a missing
              # Secret gives. Create it first — deploy/clickstack/README.md.
              valueFrom: { secretKeyRef: { name: rustic-git-otel, key: key } }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: conf
          configMap: { name: rustic-git-otel-agent }
        - name: varlogpods
          hostPath: { path: /var/log/pods }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-otel-cluster
  namespace: rustic-git
spec:
  # ONE, and it must stay one: `k8s_cluster` reports the whole cluster, so a second replica is a
  # second copy of every cluster metric, not redundancy.
  replicas: 1
  selector:
    matchLabels: { app: rustic-git-otel-cluster }
  template:
    metadata:
      labels: { app: rustic-git-otel-cluster }
    spec:
      serviceAccountName: rustic-git-otel-agent
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.109.0@sha256:af0f72b2d2493fc17f06cf3bc136548240cd7ebb2c8b1c8a7be6f3eb03068389
          args: ["--config=/conf/config.yaml"]
          env:
            - name: RUSTIC_GIT_REGION
              value: central
            - name: OTEL_INGESTION_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-otel, key: key } }
          volumeMounts:
            - { name: conf, mountPath: /conf }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: rustic-git-otel-cluster }
