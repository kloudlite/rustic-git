apiVersion: v1
kind: Namespace
metadata:
  name: rustic-git
---
# Stable identity per pod is the point of a StatefulSet here, not just the disks: a Deployment's
# rolling update briefly runs the old and new pod together, and for the repos they share that
# means the new pod fences the old one mid-request. A StatefulSet never runs two pods with the
# same ordinal, so a repo's database is handed over rather than contended.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustic-git-leader
  namespace: rustic-git
spec:
  serviceName: rustic-git
  # THE LEADER, ALONE. It writes the ownership map and holds no repositories — already true when
  # it shared this StatefulSet, since servers() skipped ordinal zero. Splitting it out is what
  # stops a server rollout from bouncing the writer, and lets the two halves be sized and probed
  # independently.
  #
  # The name is the writer's identity, so changing it is the one edit here that costs an outage:
  # while no pod answers to it the map has no writer, no lease can renew, and git operations fail.
  # Renaming was done deliberately in a watched window, and any future rename needs the same.
  #
  # ponytail: this pod spec is duplicated wholesale in rustic-git-srv. Two copies beat introducing
  # kustomize for one fork — but env changes must be made in BOTH. Template it at a third copy.
  replicas: 1
  selector:
    matchLabels: { app: rustic-git, role: leader }
  template:
    metadata:
      labels: { app: rustic-git, role: leader }
    spec:
      terminationGracePeriodSeconds: 90 # 15s preStop sleep + pool.close() flush + drain
      # uid 1001 is the image's `rustic` user. fsGroup is what makes the mounted Secret readable
      # and the emptyDir writable without root: the kubelet chowns volume contents to this group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      affinity:
        # Spread the fleet across hosts so one node's failure takes one pod with it: pods packed
        # onto one host would all go at once, and every repo they hold with them.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: rustic-git } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rustic-git
          image: ghcr.io/kloudlite/rustic-git:577feed3de8e18abbb8da190a36db0f89877f7cb
          args: ["serve"]
          env:
            # Tokio sizes its pool from the NODE's cores — 64 threads inside a
            # 100m-CPU pod. Four matches what the request can actually run.
            - name: TOKIO_WORKER_THREADS
              value: "4"
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # Close a repo's database once nobody has touched it for this long. Reopening costs
            # a few object-store round trips; holding it costs a memtable. 5 minutes is the
            # default in code, set explicitly here so it is visible where it is operated.
            - name: RUSTIC_GIT_WARM_TTL_SECS
              value: "300"
            # Hard ceiling on simultaneously open databases, so a burst across many repos cannot
            # pin one memtable each. The least recently used is closed once this is passed.
            # Kept well under the memory limit: SlateDB's memtable can reach l0_sst_size_bytes
            # (64MB) per database, so 16 bounds the worst case at 1GB against a 4GB limit. Real
            # usage is far lower — refs are 40-byte strings — but the ceiling should not equal
            # the limit, because exceeding it is an OOMKill rather than an eviction.
            - name: RUSTIC_GIT_MAX_WARM
              value: "16"
            # Where the registry's auth challenge tells a client to fetch its token.
            # It must be a URL the CLIENT can reach, not this pod's address — a
            # `docker login` follows the realm verbatim, so the in-code default
            # (localhost:8080) sends every client somewhere it cannot go.
            - name: RUSTIC_GIT_EXTERNAL_URL
              value: https://cr.khost.dev
            # Signs the registry's bearer tokens. Every node must share ONE key: `/v2/token` is
            # answered by whichever node the request lands on, while the push that presents the
            # token routes to the node owning the image. Unset, each pod invents its own secret at
            # startup, so a token minted by one is refused by the other and every push 401s after
            # a successful login.
            - name: RUSTIC_GIT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-jwt, key: secret } }
            - name: RUSTIC_GIT_HOST_KEY
              value: /etc/rustic-git/host_key
            - name: RUSTIC_GIT_CACHE_DIR
              value: /var/cache/rustic-git
            # WHO WRITES THE MAP. Name derivation cannot cross a StatefulSet boundary, so it
            # becomes configuration — and these two values must be identical on every pod of BOTH
            # StatefulSets. Two nodes disagreeing about the writer open the map twice, which fences
            # whichever one was legitimately serving.
            - name: RUSTIC_GIT_LEADER
              value: rustic-git-leader-0
            - name: RUSTIC_GIT_SERVER_PREFIX
              value: rustic-git-srv
            - name: RUSTIC_GIT_PEER_SVC
              value: rustic-git.rustic-git.svc.cluster.local
            - name: RUSTIC_GIT_SELF
              valueFrom: { fieldRef: { fieldPath: metadata.name } }   # the stable pod name; RUSTIC_GIT_LEADER above names the writer, not a derivation from this
            # This cluster runs networkPolicy: none, so anything on the pod network can reach the
            # peer ports; the shared secret is what keeps a stray client from forwarding traffic in.
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # The git nodes are where invalidation happens: a push drops the repo's `refs` entry,
            # and a visibility flip or delete bumps its generation. Without this the api tier caches
            # answers that nothing can ever purge, and `set-visibility private` silently orphans
            # nothing — a disabled cache reports success, because for reads that is the correct
            # behaviour. Same secret the api tier reads.
            - name: RUSTIC_GIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # The owning node copies a repo's pre-move pull requests out of the directory on first
            # touch, so THIS is where the migration reads from. Deliberately NOT `optional: true`:
            # an absent variable is indistinguishable from "single-node, nothing to migrate", and
            # that path records the repo as migrated with zero changes -- orphaning every existing
            # pull request and restarting numbering at 1 into collisions. A missing secret must
            # stop the pod, not quietly empty the repositories. Configured-but-unreachable is the
            # other case and is already loud: git keeps serving, pull routes fail until restart.
            # Removable once every repo carries `meta/pulls_migrated` and `pulls_for` is deleted.
            - name: RUSTIC_GIT_MONGO_URI
              valueFrom: { secretKeyRef: { name: rustic-git-mongo, key: uri } }
            # Workspaces control plane (vol-agent job surface + sweep): Cosmos-backed; absent
            # secret leaves the routes answering 503 and the feature dark — pods still boot.
            - name: COSMOS_ENDPOINT
              valueFrom: { secretKeyRef: { name: rustic-git-cosmos, key: endpoint, optional: true } }
            - name: COSMOS_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-cosmos, key: key, optional: true } }
            - name: COSMOS_DB
              value: workspaces
            - name: RUSTIC_GIT_VOL_AGENT_TOKENS
              valueFrom: { secretKeyRef: { name: rustic-git-cosmos, key: vol-agent-token, optional: true } }
            # How many serving pods the leader may hand a repo to: rustic-git-srv-0 .. N-1. Must
            # equal rustic-git-srv's spec.replicas, and must be identical on the leader and every
            # server. The leader itself holds no repositories.
            - name: RUSTIC_GIT_REPLICAS
              value: "3"
            # Sized from measurement, not taste. The receive path buffers the whole pack, and peak
            # memory ran about 3x the pack size: a 500MB push peaked at 1.46Gi. The default cap is
            # 2GiB, which is well past what the 4Gi limit survives — a 1.5GB push OOMKilled the pod
            # (exit 137) and took every repo it owned down with it, answering the client 502.
            # 512MB keeps the peak near 1.5Gi and turns that crash into a clean 413. Raise it only
            # after the receive path streams to storage instead of buffering.
            - name: RUSTIC_GIT_MAX_BODY
              value: "536870912"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ssh, containerPort: 2222 }
            - { name: peer, containerPort: 8081 }
            - { name: peer-stream, containerPort: 8082 }
          # On termination Kubernetes removes the pod from endpoints and sends SIGTERM at once.
          # Sleep first so endpoint removal reaches every node's DNS (TTL 5s) plus every node's
          # membership cache (TTL 2s) plus margin, so no peer forwards into a dying pod. Then the
          # SIGTERM handler RELEASES the pool first — so the peer that is next sent one of this
          # pod's repos claims and opens it without fencing us — and only then drains the listeners.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          # Readiness gates DNS membership: a pod is in the headless Service only while Ready, so
          # this is what puts a restarted pod back into every peer's view. 5s keeps that gap short
          # without hammering /healthz.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          # Liveness must not police STARTUP, only a process that has gone bad after it was
          # serving. Without a startup allowance it did both: the leader replays the ownership
          # map's WAL before it binds :8080, that replay outgrew the probe window, and liveness
          # killed the pod mid-replay — every time, so it could never finish and never recover.
          # An hour-long crash loop that no amount of restarting could clear.
          # startupProbe holds liveness off until the process answers once (40 x 15s = 10 minutes of
          # grace); after that liveness takes over unchanged. failureThreshold on liveness is
          # raised too, so one slow /healthz under load is not a kill on its own.
          #
          # Ten minutes, not the 150s it used to be, because the leader replays the ownership map's
          # WAL before it can answer and 150s was tighter than that work: at 25,000 WAL objects it
          # was killed mid-replay every time, restarted, and never finished -- a crash loop caused
          # by the probe rather than by the process. The WAL is bounded again, so a healthy leader
          # now starts in about 30 seconds; this budget exists for the case where something makes
          # it slow again, and it should only ever be wrong in the forgiving direction.
          # periodSeconds is the RESOLUTION of readiness, not just the polling cost: at 15s a
          # process that is listening in 1.8s still sat un-Ready for 15, and a three-pod ordered
          # rollout paid that per pod for nothing. 5s x 120 keeps the same 10-minute ceiling while
          # letting a healthy pod be Ready in about five seconds.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            # 60 not 120: the servers' budget covers replaying a repo database, which the leader
            # does not have. It opens one small map and is ready in about two seconds, so ten
            # minutes of startup grace only delays noticing a leader that will never come up —
            # and while it is down, no lease can renew.
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          # The REQUEST is a scheduling floor, not a budget: it is what the scheduler subtracts from
          # a node whether or not the pod ever uses it. At 1Gi x 3 this fleet could not place its
          # third pod on a cluster with ample real headroom — measured usage is 5-8Mi idle, and the
          # nodes were ~77% *requested* while barely used. 384Mi covers idle plus the warm
          # memtables of a normally busy node with room to spare.
          #
          # The LIMIT stays 4Gi and must: the receive path buffers a whole pack, and a 500MB push
          # was measured peaking at 1.46Gi (see RUSTIC_GIT_MAX_BODY above). Lowering the limit to
          # match the request would turn that push into an OOMKill, taking every repo the pod owns
          # with it. Burst is exactly what the gap between request and limit is for.
          # Sized for the leader specifically, which is the point of it having its own StatefulSet.
          # It holds no repositories and the load balancer excludes it, so it never buffers a pack
          # — the thing the servers' 4Gi limit exists for. Measured at 8Mi/11m in steady state on
          # this cluster; 96Mi requested is ~12x that, and the 512Mi limit still leaves an order of
          # magnitude for the compactor and a burst of claims.
          #
          # No CPU limit here or on any other pod in this file, on purpose. A CPU limit is
          # enforced by throttling, and a pack receive or a clone that gets throttled turns into
          # a client timeout; the request already bounds what the scheduler must reserve, and
          # burst on a node with idle cores is free. Memory limits stay because exceeding memory
          # is an OOMKill either way.
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: hostkey, mountPath: /etc/rustic-git, readOnly: true }
            - { name: cache, mountPath: /var/cache/rustic-git }
          # The image's RUSTIC_GIT_CACHE_DIR pins /var/cache/rustic-git, so the mount must land
          # exactly there — with a read-only root the directory has to be a mount.
      volumes:
        # One SSH host key shared by every pod. Per-pod keys would make each pod a different
        # host to ssh, and clients would report a changed host key depending on where they land.
        - name: hostkey
          secret:
            secretName: rustic-git-hostkey
            # 0440, not 0400: the file is root-owned and the process is uid 1001 — group read via
            # fsGroup is the only way a non-root process opens it.
            defaultMode: 0440
        # Pack cache: local and disposable. Every byte is re-fetchable from blob storage, and the
        # pods must be free to land on any node instantly. This was a per-pod ReadWriteOnce disk;
        # on the first roll under load a pod was rescheduled across nodes and waited 33 seconds
        # for the disk to detach from the old node and attach to the new one (Multi-Attach
        # error), during which every repo it owned had no owner. A warm cache is not worth a
        # 30-second outage per reschedule.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
