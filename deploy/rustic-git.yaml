apiVersion: v1
kind: Namespace
metadata:
  name: rustic-git
---
# Stable identity per pod is the point of a StatefulSet here, not just the disks: a Deployment's
# rolling update briefly runs the old and new pod together, and for the repos they share that
# means the new pod fences the old one mid-request. A StatefulSet never runs two pods with the
# same ordinal, so a repo's database is handed over rather than contended.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustic-git
  namespace: rustic-git
spec:
  serviceName: rustic-git
  # Serving capacity is replicas - 1: pod zero holds the ownership map, not repositories. Keep
  # this and RUSTIC_GIT_REPLICAS below in step — the leader uses that count to decide which nodes
  # it can hand a repo to. Three fits because the memory requests below are sized to measured
  # usage rather than to the burst limit; at the old 1Gi request the third pod could not schedule
  # and, because a StatefulSet rolls in order, it blocked the update of pods 0 and 1 behind it.
  replicas: 3
  selector:
    matchLabels: { app: rustic-git }
  template:
    metadata:
      labels: { app: rustic-git }
    spec:
      terminationGracePeriodSeconds: 90 # 15s preStop sleep + pool.close() flush + drain
      affinity:
        # Spread the fleet across hosts so one node's failure takes one pod with it: pods packed
        # onto one host would all go at once, and every repo they hold with them.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: rustic-git } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rustic-git
          image: ghcr.io/kloudlite/rustic-git:c0899d097013a9f96f3fb8637feffd703563e8b1
          args: ["serve"]
          env:
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # Close a repo's database once nobody has touched it for this long. Reopening costs
            # a few object-store round trips; holding it costs a memtable. 5 minutes is the
            # default in code, set explicitly here so it is visible where it is operated.
            - name: RUSTIC_GIT_WARM_TTL_SECS
              value: "300"
            # Hard ceiling on simultaneously open databases, so a burst across many repos cannot
            # pin one memtable each. The least recently used is closed once this is passed.
            # Kept well under the memory limit: SlateDB's memtable can reach l0_sst_size_bytes
            # (64MB) per database, so 16 bounds the worst case at 1GB against a 4GB limit. Real
            # usage is far lower — refs are 40-byte strings — but the ceiling should not equal
            # the limit, because exceeding it is an OOMKill rather than an eviction.
            - name: RUSTIC_GIT_MAX_WARM
              value: "16"
            # Where the registry's auth challenge tells a client to fetch its token.
            # It must be a URL the CLIENT can reach, not this pod's address — a
            # `docker login` follows the realm verbatim, so the in-code default
            # (localhost:8080) sends every client somewhere it cannot go.
            - name: RUSTIC_GIT_EXTERNAL_URL
              value: https://cr.khost.dev
            # Signs the registry's bearer tokens. Every node must share ONE key: `/v2/token` is
            # answered by whichever node the request lands on, while the push that presents the
            # token routes to the node owning the image. Unset, each pod invents its own secret at
            # startup, so a token minted by one is refused by the other and every push 401s after
            # a successful login.
            - name: RUSTIC_GIT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-jwt, key: secret, optional: true } }
            - name: RUSTIC_GIT_HOST_KEY
              value: /etc/rustic-git/host_key
            - name: RUSTIC_GIT_CACHE_DIR
              value: /var/cache/rustic-git
            - name: RUSTIC_GIT_PEER_SVC
              value: rustic-git.rustic-git.svc.cluster.local
            - name: RUSTIC_GIT_SELF
              valueFrom: { fieldRef: { fieldPath: metadata.name } }   # the stable pod name; the leader is this with the ordinal replaced by 0
            # This cluster runs networkPolicy: none, so anything on the pod network can reach the
            # peer ports; the shared secret is what keeps a stray client from forwarding traffic in.
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # The git nodes are where invalidation happens: a push drops the repo's `refs` entry,
            # and a visibility flip or delete bumps its generation. Without this the api tier caches
            # answers that nothing can ever purge, and `set-visibility private` silently orphans
            # nothing — a disabled cache reports success, because for reads that is the correct
            # behaviour. Same secret the api tier reads.
            - name: RUSTIC_GIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # The owning node copies a repo's pre-move pull requests out of the directory on first
            # touch, so THIS is where the migration reads from. Deliberately NOT `optional: true`:
            # an absent variable is indistinguishable from "single-node, nothing to migrate", and
            # that path records the repo as migrated with zero changes -- orphaning every existing
            # pull request and restarting numbering at 1 into collisions. A missing secret must
            # stop the pod, not quietly empty the repositories. Configured-but-unreachable is the
            # other case and is already loud: git keeps serving, pull routes fail until restart.
            # Removable once every repo carries `meta/pulls_migrated` and `pulls_for` is deleted.
            - name: RUSTIC_GIT_MONGO_URI
              valueFrom: { secretKeyRef: { name: rustic-git-mongo, key: uri } }
            # Pod zero stores the ownership map and holds no repositories, so the leader needs to
            # know how many pods exist to hand a repo to. Keep in step with spec.replicas above:
            # serving capacity is replicas - 1.
            - name: RUSTIC_GIT_REPLICAS
              value: "3"
            # Sized from measurement, not taste. The receive path buffers the whole pack, and peak
            # memory ran about 3x the pack size: a 500MB push peaked at 1.46Gi. The default cap is
            # 2GiB, which is well past what the 4Gi limit survives — a 1.5GB push OOMKilled the pod
            # (exit 137) and took every repo it owned down with it, answering the client 502.
            # 512MB keeps the peak near 1.5Gi and turns that crash into a clean 413. Raise it only
            # after the receive path streams to storage instead of buffering.
            - name: RUSTIC_GIT_MAX_BODY
              value: "536870912"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ssh, containerPort: 2222 }
            - { name: peer, containerPort: 8081 }
            - { name: peer-stream, containerPort: 8082 }
          # On termination Kubernetes removes the pod from endpoints and sends SIGTERM at once.
          # Sleep first so endpoint removal reaches every node's DNS (TTL 5s) plus every node's
          # membership cache (TTL 2s) plus margin, so no peer forwards into a dying pod. Then the
          # SIGTERM handler RELEASES the pool first — so the peer that is next sent one of this
          # pod's repos claims and opens it without fencing us — and only then drains the listeners.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          # Readiness gates DNS membership: a pod is in the headless Service only while Ready, so
          # this is what puts a restarted pod back into every peer's view. 5s keeps that gap short
          # without hammering /healthz.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          # Liveness must not police STARTUP, only a process that has gone bad after it was
          # serving. Without a startup allowance it did both: the leader replays the ownership
          # map's WAL before it binds :8080, that replay outgrew the probe window, and liveness
          # killed the pod mid-replay — every time, so it could never finish and never recover.
          # An hour-long crash loop that no amount of restarting could clear.
          # startupProbe holds liveness off until the process answers once (10 x 15s = 150s of
          # grace); after that liveness takes over unchanged. failureThreshold on liveness is
          # raised too, so one slow /healthz under load is not a kill on its own.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          # The REQUEST is a scheduling floor, not a budget: it is what the scheduler subtracts from
          # a node whether or not the pod ever uses it. At 1Gi x 3 this fleet could not place its
          # third pod on a cluster with ample real headroom — measured usage is 5-8Mi idle, and the
          # nodes were ~77% *requested* while barely used. 384Mi covers idle plus the warm
          # memtables of a normally busy node with room to spare.
          #
          # The LIMIT stays 4Gi and must: the receive path buffers a whole pack, and a 500MB push
          # was measured peaking at 1.46Gi (see RUSTIC_GIT_MAX_BODY above). Lowering the limit to
          # match the request would turn that push into an OOMKill, taking every repo the pod owns
          # with it. Burst is exactly what the gap between request and limit is for.
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: hostkey, mountPath: /etc/rustic-git, readOnly: true }
            - { name: cache, mountPath: /var/cache/rustic-git }
          # RUSTIC_GIT_CACHE_DIR defaults to ./cache in the container; point it at the mount.
      volumes:
        # One SSH host key shared by every pod. Per-pod keys would make each pod a different
        # host to ssh, and clients would report a changed host key depending on where they land.
        - name: hostkey
          secret:
            secretName: rustic-git-hostkey
            defaultMode: 0400
        # Pack cache: local and disposable. Every byte is re-fetchable from blob storage, and the
        # pods must be free to land on any node instantly. This was a per-pod ReadWriteOnce disk;
        # on the first roll under load a pod was rescheduled across nodes and waited 33 seconds
        # for the disk to detach from the old node and attach to the new one (Multi-Attach
        # error), during which every repo it owned had no owner. A warm cache is not worth a
        # 30-second outage per reschedule.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
---
# Headless: gives each pod a stable DNS name (rustic-git-0.rustic-git.rustic-git.svc) and, more
# importantly, makes the pod endpoints individually addressable for the ingress's hash routing.
apiVersion: v1
kind: Service
metadata:
  name: rustic-git
  namespace: rustic-git
spec:
  clusterIP: None
  # Peers must resolve each other the moment the process binds, not when the readiness probe first
  # succeeds. Gating peer DNS on readiness left the leader unreachable for ~20s after a restart —
  # longer than LEASE_TTL — so claims failed and leases lapsed while it was merely starting. Safe:
  # the peer port is secret-guarded, ownership is decided by the map rather than by reachability,
  # and a node that cannot serve already answers 503 on its own health check.
  publishNotReadyAddresses: true
  selector: { app: rustic-git }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: ssh, port: 2222, targetPort: ssh }
    - { name: peer, port: 8081, targetPort: peer }   # named so it resolves; the code queries _peer._tcp.rustic-git.rustic-git.svc.cluster.local:8081
---
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-lb
  namespace: rustic-git
spec:
  type: LoadBalancer
  selector: { app: rustic-git }
  ports:
    - { name: http, port: 80, targetPort: http }
    # Port 22 is what `git@host:owner/repo.git` means — scp-style remotes carry no
    # port, so anything else forces every user to write `ssh://…:2222/…` instead.
    # The load balancer does the mapping; the container still listens on 2222 and
    # needs no privileged bind.
    - { name: ssh, port: 22, targetPort: ssh }
    # Kept so remotes already written against 2222 keep working.
    - { name: ssh-alt, port: 2222, targetPort: ssh }
---
# Kept for a cluster that enforces NetworkPolicy; this one (networkPolicy: none) does not, which
# is why the peer ports also require a secret.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rustic-git-peers-only
  namespace: rustic-git
spec:
  podSelector:
    matchLabels: { app: rustic-git }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: rustic-git }
      ports:
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 8082 }
    # The api tier fronts these nodes and every cache miss goes to the peer listener, so it needs
    # 8081 — and only 8081: it takes no part in leases or routing (8082).
    - from:
        - podSelector:
            matchLabels: { app: rustic-git-api }
      ports:
        - { protocol: TCP, port: 8081 }
    # The merge worker asks the owning node to move a ref, which is a peer route.
    # Also 8081 only: it holds no lease and takes no part in routing either.
    - from:
        - podSelector:
            matchLabels: { app: rustic-git-worker }
      ports:
        - { protocol: TCP, port: 8081 }
    - ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 2222 }
---
# The read API: no repo state, no ownership, no local packs. A Deployment, not a StatefulSet —
# this tier owns no repo and holds no lease, so pods are interchangeable and any of them can
# answer any request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-api
  namespace: rustic-git
spec:
  replicas: 2
  selector:
    matchLabels: { app: rustic-git-api }
  template:
    metadata:
      labels: { app: rustic-git-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/kloudlite/rustic-git:c0899d097013a9f96f3fb8637feffd703563e8b1
          # Its own binary, not a subcommand: this process cannot open a repository
          # for writing, because none of that code is linked into it.
          command: ["rustic-git-api"]
          ports:
            - { name: http, containerPort: 8090 }
          env:
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # Browse routes live on the git nodes' PEER listener (8081), never the public one, so
            # this must point at the peer Service, not the LoadBalancer.
            - name: RUSTIC_GIT_UPSTREAM
              value: http://rustic-git:8081
            - name: RUSTIC_GIT_API_ADDR
              value: 0.0.0.0:8090
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # Optional: without it every request still answers, just always from a git node
            # instead of the cache. See the Redis Deployment/config below for the policy this
            # relies on.
            - name: RUSTIC_GIT_REDIS_URL
              # `optional` is what makes the comment above true: without it a missing secret keeps
              # the pod out of Ready forever, which is not "answers without the cache".
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # Teams and users live in Cosmos (Mongo API). Optional for the same reason
            # the cache is: without it the browse routes still answer and only /v1/*
            # reports unavailable. A database outage must not stop reads.
            - name: RUSTIC_GIT_MONGO_URI
              valueFrom: { secretKeyRef: { name: rustic-git-mongo, key: uri, optional: true } }
            - name: RUSTIC_GIT_MONGO_DB
              value: kloudlite
            # Signs the identity tokens the web app presents — and, on the git
            # nodes, the registry's bearer tokens. One key across every process
            # that mints or verifies one.
            - name: RUSTIC_GIT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-jwt, key: secret, optional: true } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
---
# The merge worker. Scale it with `replicas`, freely: every job is claimed
# atomically, so two pods can never take the same one. Each pod also runs several
# lanes (RUSTIC_GIT_WORKER_CONCURRENCY), which is the same mechanism — to the
# database a lane and a pod are indistinguishable. Reach for lanes first: they
# cost a task, where a pod costs a container.
#
# It owns no repo and holds no lease. It reads objects from the same bucket the
# git nodes use and adds packs to it — content-addressed, so any process may — but
# it never writes a ref. The ref move is asked of the node that owns the repo,
# which is what keeps one writer per repo and keeps branch protection in force.
#
# Listing index markers (index/{public|private}/{repo|img}/{owner}/{name}) are
# reconciled here: the GC sweep heals structural drift (missing/orphaned markers,
# stale stats) within one sweep period; visibility drift (accuracy of the
# public/private marker) heals when the owning node next opens the repo or on
# its ~30s warm-repo reconcile lane.
#
# It also consumes the `events` Redis stream (XREADGROUP/XACK, XAUTOCLAIM for
# crashed consumers) to get nudged about merge work quickly, but the stream is
# never the record: a periodic ~60s pull_to_check Mongo sweep is the actual
# floor, verified to still find all queued work with Redis entirely down. That
# floor is what protects this worker from the Redis instance's eviction
# policy: verified against the live rustic-git-redis (Azure Managed Redis,
# Enterprise tier) via `az redisenterprise database list`, since Azure blocks
# CONFIG GET on this SKU — the policy is VolatileLRU, not noeviction. Stream
# keys carry no TTL, so VolatileLRU currently leaves them alone (it only
# evicts keys with an expire set), but nothing enforces that going forward —
# any dropped stream entry is fine because the sweep below still finds the work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-worker
  namespace: rustic-git
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustic-git-worker }
  template:
    metadata:
      labels: { app: rustic-git-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/kloudlite/rustic-git:c0899d097013a9f96f3fb8637feffd703563e8b1
          command: ["rustic-git-worker"]
          env:
            - name: RUSTIC_GIT_S3_URL
              value: az://rustic-git
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: account } }
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-storage, key: key } }
            # The peer listener, like the api tier: the merge route is peer-only.
            - name: RUSTIC_GIT_UPSTREAM
              value: http://rustic-git:8081
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # NOT optional here, unlike the api tier: the worker's entire job list
            # lives in this database. Without it there is nothing to do, and a pod
            # that silently idles forever is worse than one that will not start.
            # (The worker no longer reads the directory: discovery and merges moved to the
            # owning node, so it only consumes the event stream and sweeps storage.)
            - name: RUSTIC_GIT_MONGO_DB
              value: kloudlite
            - name: RUSTIC_GIT_CACHE_DIR
              value: /var/cache/rustic-git
            # Optional here too (see api/git tiers): without it a lane still runs, just on
            # `SWEEP_EVERY` alone instead of the stream nudge — see the startup warning in
            # `worker.rs` for why that is now a performance regression worth noticing, not a
            # silent default.
            - name: RUSTIC_GIT_REDIS_URL
              valueFrom: { secretKeyRef: { name: rustic-git-redis, key: url, optional: true } }
            # Jobs are mostly waiting — on the fleet, on the database — so a lane
            # is cheap. Raise it before adding replicas.
            - name: RUSTIC_GIT_WORKER_CONCURRENCY
              value: "4"
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/rustic-git }
      volumes:
        # Scratch only: packs are read from and written to object storage, and
        # anything here can be rebuilt by fetching again.
        - { name: cache, emptyDir: {} }
---
# Redis provisioning note (no manifest here — this cluster uses a managed instance): it MUST run
# `maxmemory-policy volatile-lru`, and this is load-bearing, not tuning. Data keys all carry a
# TTL; the per-repo generation counters that guard them carry none. Under volatile-lru only keys
# with an expiry are eviction candidates, so a counter is never evicted while the entries it
# guards still exist. Under allkeys-lru an evicted counter reads back as generation 1 — the
# pre-purge value — and every stale entry it was meant to orphan becomes visible again. Whoever
# provisions the Redis instance must set this.
#
# Two things this Service does NOT fix, both load-bearing on how it's exposed:
#   - loadBalancerSourceRanges below MUST be restricted to Cloudflare's published ranges, or the
#     WAF/rate-limiting in front of it is one direct `curl` to the LB IP away from irrelevant.
#   - SSH (port 2222, on the rustic-git-lb Service above) does not go through Cloudflare at all —
#     it is unrated and unshielded on the LoadBalancer regardless of this restriction.
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-api
  namespace: rustic-git
spec:
  # ClusterIP until Cloudflare fronts this tier. Switching to LoadBalancer without the WAF in
  # front of it exposes the browse API with no rate limiting at all; restore `type: LoadBalancer`
  # together with the real loadBalancerSourceRanges below, not before.
  type: ClusterIP
  # NOT A CIDR, ON PURPOSE. The API server validates every entry of loadBalancerSourceRanges as a
  # CIDR (pkg/apis/core/validation/validation.go, IsValidCIDRForLegacyField) and rejects the object
  # if one doesn't parse — so this placeholder makes `kubectl apply` fail closed with a clear
  # error instead of silently applying with the field empty, which would open this LoadBalancer to
  # 0.0.0.0/0 and make the Cloudflare WAF above bypassable by anyone who curls the LB IP directly.
  # Replace with Cloudflare's published ranges (https://www.cloudflare.com/ips/) before applying.
  # Do not delete this field to "fix" the apply error — an absent field is silently open, which is
  # worse than a loud rejection.
  # loadBalancerSourceRanges: ["<cloudflare-cidrs>"]   # required when type becomes LoadBalancer
  selector: { app: rustic-git-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The registry gets a hostname of its own rather than a path on the app's.
#
# A registry client owns the whole host: it asks for `/v2/` and follows `Location`
# headers the server writes, so sharing a host with an app means every one of those
# paths has to be carved out of the app's namespace and kept carved. A separate name
# also means the app's ingress annotations — body limits, buffering, timeouts — stay
# tuned for an app, while these stay tuned for pushing layers.
#
# TLS is terminated HERE, by a cert-manager certificate, and cr.khost.dev is a DNS-only
# record — deliberately NOT behind Cloudflare's proxy. It was proxied at first, and the
# edge refused what real clients send: buildx/containerd stream blobs over HTTP/2 with
# no declared length, which the free plan answers with 413 before this ingress ever
# sees the request, and anything over 100MB dies the same way. docker's own pushes
# (HTTP/1.1, Content-Length) worked, which is what made the gap easy to miss.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustic-git-registry
  namespace: rustic-git
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # No origin-side HTTPS redirect: when the Cloudflare proxy is in front in Flexible
    # mode it fetches this origin over plain HTTP, and a redirect here loops it. The
    # cert above still serves direct HTTPS; this just stops the origin insisting.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # A layer is one request. The default 1m ceiling turns any real image into a 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # A large layer takes longer than 60s to receive.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Buffering a layer in nginx before passing it on doubles the disk it touches and
    # delays the first byte the registry sees.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cr.khost.dev]
      secretName: rustic-git-registry-tls
  rules:
    - host: cr.khost.dev
      http:
        paths:
          # The whole host belongs to the registry, so there is nothing to match around.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustic-git-lb
                port:
                  number: 80
