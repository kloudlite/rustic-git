# /etc/tmux.conf — every named terminal in a workspace runs inside this tmux server
# (`tmux -L kl`, spawned by the tool servers `/stream/pty?session=`). The desktop draws the tabs,
# the scrollback and the status line, so tmux draws none of its own: what is wanted here is the
# session that outlives a socket, not a second UI.
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
# The desktop already has a tab row; tmuxs would be a second one.
set -g status off
# A terminal that waits 500 ms after Escape feels broken in vim over a tunnel.
set -g escape-time 0
set -g focus-events on
# The pane follows the attached client, not the largest one that ever attached: every client here
# is one desktop tab, and the PTYs TIOCSWINSZ is what it resizes.
setw -g aggressive-resize on
# A detached session is the whole point: a dropped socket must not end a shell.
set -g destroy-unattached off
# An empty server exits rather than lingering with nothing in it.
set -g exit-empty on

# Saved state lives in the WORKSPACE, not the pod: it is snapshotted, replicated, cloned and
# restored with the tree like every other cache. The path carries `$KL_WORKSPACE`, so it is set
# through the shell rather than as a literal — tmux does not expand environment variables in a
# config value, but `run-shell` is `sh`.
run-shell "tmux set -g @resurrect-dir \"$KL_WORKSPACE/.cache/tmux/resurrect\""
# Pane text is the part a person actually misses after a pod restart; the processes cannot come
# back, and no tool can bring them.
set -g @resurrect-capture-pane-contents "on"
# Every minute: a workspace stop is seconds, so a 15-minute default would save nothing worth
# restoring. `kl ide serve` runs the restore itself at start.
set -g @continuum-save-interval "1"
run-shell "$NIX_PROFILE/share/tmux-plugins/resurrect/resurrect.tmux"
run-shell "$NIX_PROFILE/share/tmux-plugins/continuum/continuum.tmux"
