# The web UI. A stateless Next.js server: no volumes, no leader, scale by replicas.
#
# Sign-in: until an OAuth provider is configured, email + password is available to
# the addresses in AUTH_ALLOWED_EMAILS. That is real authentication on the
# production build — not the development bypass, which by design cannot run here.
#
# It is NOT exposed publicly here. Two reasons, both worth clearing before adding an
# Ingress: no OAuth provider is configured yet (nothing can sign in), and the browse
# API it will read from is itself still ClusterIP pending the Cloudflare restriction
# noted in rustic-git.yaml. Reach it with:
#   kubectl -n rustic-git port-forward svc/rustic-git-web 3000:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-web
  namespace: rustic-git
spec:
  replicas: 2
  selector:
    matchLabels: { app: rustic-git-web }
  template:
    metadata:
      labels: { app: rustic-git-web }
    spec:
      # No imagePullSecrets: the package is public, and ghcr-secret's token is not
      # scoped to it — supplying a credential that is refused makes the pull 403
      # rather than falling back to anonymous. Add one back only alongside a token
      # that can actually read ghcr.io/kloudlite/rustic-git-web.
      containers:
        - name: web
          image: ghcr.io/kloudlite/rustic-git-web:be5bb10935517c784f5d53510e3f258ebe67d51f
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # V8 sizes its heap from HOST memory, so the pod OOMKills instead of
            # GC'ing. 384 leaves the rest of the 512Mi limit for buffers and stack.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: auth-secret } }
            # Auth.js builds provider callback URLs from this; it must match the address
            # the browser actually used, or the OAuth round trip returns to the wrong host.
            - name: AUTH_URL
              value: https://dev.kloudlite.io
            - name: AUTH_TRUST_HOST
              value: "true"
            # The api server owns the database and the signing key; the web app
            # holds neither. The peer secret is used once per session, at sign-in,
            # to assert who just authenticated; every later call carries the
            # user's own token.
            # The addresses the Clone menu prints. Read on the server and passed
            # to the browser as props, so changing them here is enough — no
            # rebuild, unlike a NEXT_PUBLIC_ value.
            # HTTPS is served by the ingress, so this must be a hostname whose
            # DNS lands here. Becomes kloudlite.io once that name points at this
            # cluster — today it resolves to a different origin and 404s.
            - name: RUSTIC_GIT_CLONE_HOST
              value: dev.kloudlite.io
            # The registry is a different hostname from the app: docker pull lines on the
            # Container Images pages must name it, while clone URLs keep the app's host.
            - name: RUSTIC_GIT_REGISTRY_HOST
              value: cr.khost.dev
            # SSH cannot go through Cloudflare's proxy, so it has its own name,
            # DNS-only, straight at the git load balancer.
            - name: RUSTIC_GIT_SSH_HOST
              value: git.khost.dev
            - name: RUSTIC_GIT_SSH_PORT
              value: "22"
            - name: RUSTIC_GIT_API_URL
              value: http://rustic-git-api
            - name: RUSTIC_GIT_PEER_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-peer, key: secret } }
            # Team invitations go out through Resend. Both optional: unset, the invite is still
            # created and the inviter is shown the link to pass on by hand, rather than the app
            # pretending an email went out. `from` must be on a domain verified in Resend.
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: rustic-git-mail, key: resend-api-key, optional: true } }
            - name: RESEND_FROM
              valueFrom: { secretKeyRef: { name: rustic-git-mail, key: from, optional: true } }
            # Email + password sign-in exists only while both of these are set.
            - name: AUTH_ALLOWED_EMAILS
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: allowed-emails, optional: true } }
            - name: AUTH_SHARED_PASSWORD
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: shared-password, optional: true } }
            # Providers are registered only when both halves are present, so with these
            # unset the sign-in page simply offers none rather than erroring.
            - name: AUTH_GITHUB_ID
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: github-id, optional: true } }
            - name: AUTH_GITHUB_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: github-secret, optional: true } }
            - name: AUTH_GOOGLE_ID
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: google-id, optional: true } }
            - name: AUTH_GOOGLE_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: google-secret, optional: true } }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          # Same split as the git server: startup gets its own allowance so liveness never kills a
          # process that is still coming up. /api/health is a route handler that returns 204 with
          # no render — /login used to be probed, which cost a full page render per probe.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-web
  namespace: rustic-git
spec:
  selector: { app: rustic-git-web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Public entry point. Cloudflare fronts this host and terminates TLS, so the origin
# serves plain HTTP and must NOT redirect to HTTPS itself: Cloudflare's SSL mode
# here is Flexible, meaning it fetches the origin over HTTP, and an origin-side
# redirect to HTTPS sends it straight back — ERR_TOO_MANY_REDIRECTS.
#
# The app still believes it is on https://dev.kloudlite.io: AUTH_URL says so, and
# AUTH_TRUST_HOST lets Auth.js trust Cloudflare's X-Forwarded-Proto, so OAuth
# callbacks are built with the public scheme rather than the origin's.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustic-git-web
  namespace: rustic-git
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Git paths are matched as regexes so they can be told apart from app routes.
    nginx.ingress.kubernetes.io/use-regex: "true"
    # A push is one request carrying every object. The default 1m body limit turns
    # any real first push into a 413; 0 means "no limit here" and leaves the size
    # question to the git server, which already caps it.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # A large push takes longer than the 60s default to receive and index.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Per client IP (real IP via deploy/ingress-nginx-config.yaml): a page load is ~10 requests,
    # the shell's 2 s polls are one each, so 30 r/s with a 5x burst is invisible to a person and
    # a wall to a loop.
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    # Git streams: buffering a pack in nginx before passing it on delays every
    # byte and is what makes a clone appear to hang before it starts.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.kloudlite.io
      http:
        paths:
          # Smart HTTP, on the same hostname as the app. `/{owner}/{repo}.git/...`
          # cannot collide with an app route: the app has no `.git` in any path,
          # and git clients always ask for one. Without this the ingress sends a
          # clone to Next.js, which answers 404 in HTML and looks like a missing
          # repo rather than a missing route.
          - path: /[^/]+/[^/]+\.git(/.*)?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: rustic-git-http
                port:
                  number: 80
          # `/v1/...` is the api server's own surface, and the CLI talks to it directly —
          # it holds no session cookie, so it cannot go through the Next.js server the way
          # the browser does. Before `/`, or the app swallows it and answers 404 in HTML.
          # The rate-limit annotations above are ingress-wide and cover this path too.
          - path: /v1/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: rustic-git-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustic-git-web
                port: { name: http }
