# The web UI, running as a PREVIEW: the `dev` image (`next dev`) with the sign-in
# bypass on, so the app is usable before an OAuth provider is configured.
#
# What that means, plainly: every visitor to this host is signed in as the dev
# user. It is only defensible while the app serves mock data. Before it reads the
# real API, switch back to the production image and configure a provider:
#   image: ghcr.io/kloudlite/rustic-git-web:<sha>, drop NODE_ENV/AUTH_DEV_*,
#   restore replicas: 2 and readOnlyRootFilesystem: true.
#
# It is NOT exposed publicly here. Two reasons, both worth clearing before adding an
# Ingress: no OAuth provider is configured yet (nothing can sign in), and the browse
# API it will read from is itself still ClusterIP pending the Cloudflare restriction
# noted in rustic-git.yaml. Reach it with:
#   kubectl -n rustic-git port-forward svc/rustic-git-web 3000:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustic-git-web
  namespace: rustic-git
spec:
  replicas: 1   # a dev server holds compile state; one is simpler and enough
  selector:
    matchLabels: { app: rustic-git-web }
  template:
    metadata:
      labels: { app: rustic-git-web }
    spec:
      # No imagePullSecrets: the package is public, and ghcr-secret's token is not
      # scoped to it — supplying a credential that is refused makes the pull 403
      # rather than falling back to anonymous. Add one back only alongside a token
      # that can actually read ghcr.io/kloudlite/rustic-git-web.
      containers:
        - name: web
          image: ghcr.io/kloudlite/rustic-git-web:dev
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          env:
            # NODE_ENV=development is what lets the bypass work at all: the guard
            # in src/lib/dev-auth.ts throws if AUTH_DEV_BYPASS is set in a
            # production build, so this cannot leak into the production image.
            - name: NODE_ENV
              value: development
            - name: AUTH_DEV_BYPASS
              value: "1"
            - name: AUTH_DEV_EMAIL
              value: karthik@kloudlite.io
            - name: AUTH_DEV_NAME
              value: Karthik Thirumalasetti
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: auth-secret } }
            # Auth.js builds provider callback URLs from this; it must match the address
            # the browser actually used, or the OAuth round trip returns to the wrong host.
            - name: AUTH_URL
              value: https://dev.kloudlite.io
            - name: AUTH_TRUST_HOST
              value: "true"
            # Providers are registered only when both halves are present, so with these
            # unset the sign-in page simply offers none rather than erroring.
            - name: AUTH_GITHUB_ID
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: github-id, optional: true } }
            - name: AUTH_GITHUB_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: github-secret, optional: true } }
            - name: AUTH_GOOGLE_ID
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: google-id, optional: true } }
            - name: AUTH_GOOGLE_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: google-secret, optional: true } }
            - name: AUTH_MICROSOFT_ENTRA_ID_ID
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: microsoft-id, optional: true } }
            - name: AUTH_MICROSOFT_ENTRA_ID_SECRET
              valueFrom: { secretKeyRef: { name: rustic-git-web, key: microsoft-secret, optional: true } }
          # A dev server compiles the route on first hit, so give it room before
          # the probes call it dead.
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }   # a dev server compiles in-process
          securityContext:
            allowPrivilegeEscalation: false
            # `next dev` compiles on demand and writes to .next; a read-only root
            # filesystem is for the production image, which does not.
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: rustic-git-web
  namespace: rustic-git
spec:
  selector: { app: rustic-git-web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Public entry point. Cloudflare fronts this host and terminates TLS, so the origin
# serves plain HTTP and must NOT redirect to HTTPS itself: Cloudflare's SSL mode
# here is Flexible, meaning it fetches the origin over HTTP, and an origin-side
# redirect to HTTPS sends it straight back — ERR_TOO_MANY_REDIRECTS.
#
# The app still believes it is on https://dev.kloudlite.io: AUTH_URL says so, and
# AUTH_TRUST_HOST lets Auth.js trust Cloudflare's X-Forwarded-Proto, so OAuth
# callbacks are built with the public scheme rather than the origin's.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustic-git-web
  namespace: rustic-git
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # `next dev` opens an HMR websocket. It is useless here — the source is baked
    # into the image and never changes — but without these it fails on a loop and
    # fills the browser console. Harmless either way; the real fix is to stop
    # running a dev server on a server.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: dev.kloudlite.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rustic-git-web
                port: { name: http }
