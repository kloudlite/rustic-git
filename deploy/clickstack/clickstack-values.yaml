# ClickStack, step 2 of 2: ClickHouse, the gateway OTel collector, HyperDX and HyperDX's MongoDB.
#
# Keys verified against `helm show values clickstack/clickstack --version 3.2.0` and, for the
# `otel-collector` block, `helm show values open-telemetry/opentelemetry-collector` (the subchart
# this chart aliases). Anything still unverified carries a `# verify:` comment.
#
# ONE ClickHouse replica, deliberately (design §"Not doing": no multi-node ClickHouse). This is
# telemetry, not the platform's record of anything a user owns — the git repos and the workspaces
# survive its loss entirely, and the console degrades to "history unavailable". A second replica
# would double the cost of the one component here whose outage is survivable.

clickhouse:
  enabled: true
  cluster:
    # Rendered verbatim into the ClickHouseCluster CR, so these are the operator's field names,
    # not the chart's.
    spec:
      replicas: 1
      shards: 1
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 100Gi
  keeper:
    spec:
      replicas: 1
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
  # No `service:` key exists on this chart — the operator owns the Service and defaults it to
  # ClusterIP, which is what we want: nothing outside the cluster speaks the native protocol to
  # this, and the collector's ingress below is the one door in. Do NOT add a LoadBalancer here.

global:
  otelCollector:
    # Merged on top of the collector image's built-in config. The only thing we change is the
    # exporter's retention: 30 days of raw metrics, which is exactly what `kloudlite.metrics_5m`
    # (400 d, written by the admin process) exists to outlive.
    # verify: the built-in exporter is named `clickhouse` and takes a `ttl` duration — confirm with
    # `kubectl -n clickstack exec deploy/clickstack-otel-collector -- cat /etc/otelcol-contrib/config.yaml`
    # before trusting a fresh chart version.
    customConfig: |
      exporters:
        clickhouse:
          ttl: 720h

otel-collector:
  # The GATEWAY collector: it receives OTLP from every cluster's agent collector and writes
  # ClickHouse. The agents are ours (deploy/k3s/otel-agent.yaml), not this chart's.
  enabled: true
  mode: deployment
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      # Cloudflare fronts this host in Flexible mode and fetches the origin over plain HTTP, so
      # nginx's default redirect-to-https loops (308 to itself) — the same trap the registry
      # ingress in deploy/kloudlite.yaml documents. TLS is the edge's; the origin cert only
      # exists so the record can go Full later without a second change.
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      # OTLP/HTTP on 4318 — the protocol every agent collector in this repo exports with
      # (`otlphttp`). nginx already serves HTTP/2 to clients on a TLS listener, so an agent's
      # exports are multiplexed over one connection without any annotation.
      - host: otel-dev.kloudlite.io
        paths:
          - path: /
            pathType: Prefix
            port: 4318
    tls:
      - secretName: otel-tls
        hosts: [otel-dev.kloudlite.io]
    # OTLP/gRPC gets its OWN hostname rather than a path on the one above: nginx's
    # `backend-protocol` annotation applies to the whole server block, so a GRPC rule and an HTTP
    # rule on one host would break whichever came second. Nothing of ours uses this door yet — it
    # exists for a third-party exporter that only speaks gRPC.
    additionalIngresses:
      - name: grpc
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          # Cloudflare fronts this host in Flexible mode and fetches the origin over plain HTTP, so
          # nginx's default redirect-to-https loops (308 to itself) — the same trap the registry
          # ingress in deploy/kloudlite.yaml documents. TLS is the edge's; the origin cert only
          # exists so the record can go Full later without a second change.
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
          # Without this nginx downgrades the connection and every export fails with a protocol
          # error that reads like a TLS problem.
          nginx.ingress.kubernetes.io/backend-protocol: GRPC
        hosts:
          - host: otel-grpc-dev.kloudlite.io
            paths:
              - path: /
                pathType: Prefix
                port: 4317
        tls:
          - secretName: otel-grpc-tls
            hosts: [otel-grpc-dev.kloudlite.io]

hyperdx:
  config:
    # The chart's default is http://localhost:3000, which is where every post-login redirect
    # lands otherwise.
    FRONTEND_URL: https://hyperdx-dev.kloudlite.io
  deployment:
    # Requests are what keep this pod off ClickHouse's node: without them the scheduler put it on
    # the node ClickHouse already fills (2.8 GiB allocatable, 1.7 GiB ClickHouse), and the kernel
    # killed the app at every boot (exit 137, 118 restarts) with nothing in its log. The chart has
    # no affinity key for this deployment, so the request IS the anti-affinity — the full node
    # cannot admit 768 MiB. The limit stops a leak taking a second node down the same way.
    resources:
      requests: { cpu: 100m, memory: 768Mi }
      limits: { memory: 1536Mi }
    env:
      # A container's own `env` beats the chart's envFrom ConfigMap, so this overrides the
      # in-cluster MONGO_URI the chart still renders there.
      - name: MONGO_URI
        valueFrom: { secretKeyRef: { name: hyperdx-mongo, key: MONGO_URI } }
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      # Cloudflare fronts this host in Flexible mode and fetches the origin over plain HTTP, so
      # nginx's default redirect-to-https loops (308 to itself) — the same trap the registry
      # ingress in deploy/kloudlite.yaml documents. TLS is the edge's; the origin cert only
      # exists so the record can go Full later without a second change.
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      # No basic auth in front: HyperDX's own login is the gate. The first account was created
      # right after the install (the sign-up form is open only until then), and a second prompt
      # on every visit was judged not worth its cost.
    # Passed through verbatim as the Ingress `spec`, so this is Kubernetes' schema, not the
    # chart's — hence `ingressClassName` here rather than beside the annotations.
    spec:
      ingressClassName: nginx
      rules:
        - host: hyperdx-dev.kloudlite.io
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    # The chart's fullname helper, and it embeds the RELEASE name: this is right
                    # only for `helm install clickstack …` as the README's command spells it.
                    # Verified with `helm template clickstack …`.
                    name: clickstack-app
                    port:
                      number: 3000
      tls:
        - secretName: hyperdx-tls
          hosts: [hyperdx-dev.kloudlite.io]

mongodb:
  # HyperDX's own state (saved searches, dashboards, alert definitions) lives in a `hyperdx`
  # database on the platform's existing Cosmos DB for MongoDB account (`kloudlite-kloudlite`,
  # MongoDB API 7.0, serverless) rather than in the chart's in-cluster MongoDBCommunity: the AKS
  # nodes are Standard_B2s and the mongod pod plus its agent sidecar was the 800 MB that kept
  # ClickHouse from scheduling. Same account as the directory, separate database — nothing in
  # HyperDX reads or writes the directory's collections. The URI comes from the `hyperdx-mongo`
  # Secret (deploy/clickstack/README.md), never from this file.
  enabled: false
