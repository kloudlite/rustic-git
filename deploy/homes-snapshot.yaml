# Daily Azure Files share snapshot of the region's homes export (owner's yes, 2026-09-17 04:05 IST,
# after the bench-folder loss of 2026-09-16 showed the share had none). Management plane only
# (`share-rm`), so it runs on AKS under the kubelet's user-assigned identity, which holds
# "Storage Account Contributor" on the one account; no storage key exists anywhere in the cluster.
# Keeps 14 days: NFS shares have no file soft-delete, and a snapshot is the only undo for a rename
# or a finalizer that ran a delete. Restore = mount the snapshot on a node
# (`mount -t nfs ... :/homes/.snapshot/<ts>` or the portal's "Restore") and copy back.
# Suspended 2026-09-24: since the home-is-the-workspace-volume ruling (2026-09-22) nothing mounts
# the share; its data and snapshots stay for a human to retire.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: homes-snapshot
  namespace: kloudlite
spec:
  schedule: "0 21 * * *"            # 02:30 IST
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: snapshot
              image: mcr.microsoft.com/azure-cli:2.75.0
              command: ["/bin/bash", "-ceu"]
              args:
                - |
                  # The identity holds a role on ONE storage account and none on the subscription, so
                  # every subscription-aware CLI verb (and az rest, which resolves the URL's
                  # subscription against the account list) refuses it. Plain curl with the identity's
                  # ARM token needs nothing but the role. Share snapshot = PUT the share with
                  # x-ms-snapshot: true.
                  az login --identity --allow-no-subscriptions -o none
                  TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
                  BASE="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Storage/storageAccounts/$ACCOUNT/fileServices/default/shares"
                  API="api-version=2023-05-01"
                  H="Authorization: Bearer $TOKEN"
                  out=$(curl -sS -w '\n%{http_code}' -X PUT "$BASE/homes?$API" -H "$H" -H "x-ms-snapshot: true" -H "Content-Type: application/json" -d '{}')
                  code=${out##*$'\n'}; body=${out%$'\n'*}
                  case "$code" in 200|201) echo "snapshot taken ($code): $(printf '%s' "$body" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("properties",{}).get("snapshotTime","?"))' 2>/dev/null || echo '?')";; *) echo "snapshot PUT failed ($code): $body" >&2; exit 1;; esac
                  # Prune: keep 14 days.
                  cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
                  curl -fsS "$BASE?$API&\$expand=snapshots" -H "$H" \
                    | python3 -c "import sys,json; [print(v['properties']['snapshotTime']) for v in json.load(sys.stdin)['value'] if v['name']=='homes' and v['properties'].get('snapshotTime') and v['properties']['snapshotTime'] < '$cutoff']" \
                    | while read -r ts; do [ -n "$ts" ] && curl -fsS -X DELETE "$BASE/homes?$API&\$include=snapshots" -H "$H" -H "x-ms-snapshot: $ts" && echo "pruned $ts"; done
              env:
                - name: CLIENT_ID
                  value: "a083e811-c4cb-4d9d-884f-97aa1bc5f261"
                - name: ACCOUNT
                  value: kloudlitegithomes
                - name: RG
                  value: rustic-git-k3s
                - name: SUB
                  value: 9941afe7-e220-492f-bfab-63f539dc0b69
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
