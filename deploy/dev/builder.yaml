# The in-cluster dev loop: one pod on the tainted `builder` node pool (Standard_D16s_v5) with a
# premium disk holding the checkout and the cargo target, so a change is rsync + incremental build +
# run the binary, with no image, registry or CI in the loop. It carries the SLO probe's own
# ServiceAccount, Secrets and ConfigMap so `kloudlite-slo run --suite …` runs here exactly as the
# CronJobs run it. Traffic-serving tiers are tested by editing a Service selector to point at this
# pod (label it `app: <tier>` by hand), then reverting. Dev only — nothing here is a deployment.
#
# Images are built HERE too: a privileged `buildkitd` sidecar (its cache on the same disk) runs the
# Dockerfile for `deploy/dev/ship.sh`, which pushes CI-shaped tags (`ghcr.io/kloudlite/<image>:<sha>`)
# so `deploy/pin.sh` and `deploy/roll.sh` work unchanged — minutes on a warm target instead of a
# CI queue. The push needs a token with `write:packages` (`gh auth refresh -s write:packages`
# in the pod, then `crane auth login ghcr.io`).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-work
  namespace: kloudlite
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi-premium
  resources:
    requests:
      storage: 256Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev
  namespace: kloudlite
  labels: { app: dev }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: dev }
  template:
    metadata:
      labels: { app: dev }
    spec:
      serviceAccountName: kloudlite-slo
      nodeSelector: { builder: "true" }
      tolerations:
        - { key: builder, operator: Equal, value: "true", effect: NoSchedule }
      containers:
        - name: dev
          image: rust:1-bookworm
          # Tools the probe image carries (Dockerfile `slo` target), installed on first start and
          # kept on the disk's PATH after that; then wait for work.
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq --no-install-recommends \
                bash ca-certificates git rsync openssh-client curl openssl bind9-dnsutils \
                pkg-config libssl-dev clang cmake python3 tini procps jq tmux lnav less nodejs npm gdb >/dev/null
              rustup component add clippy rustfmt 2>&1 | tail -1
              rustup target add x86_64-unknown-linux-musl 2>&1 | tail -1
              # HOME on the disk: gh's login, the git identity, safe.directory and ssh known_hosts
              # all live under it and must outlive a pod restart.
              mkdir -p /work/home /work/bin
              if [ ! -x /work/bin/gh ]; then
                curl -fsSL -o /tmp/gh.tgz https://github.com/cli/cli/releases/download/v2.86.0/gh_2.86.0_linux_amd64.tar.gz
                tar -xzf /tmp/gh.tgz -C /tmp && install -m 755 /tmp/gh_2.86.0_linux_amd64/bin/gh /work/bin/gh
              fi
              git config --global --add safe.directory /work/src || true
              # pm2 on the disk: `pm2 logs <suite>` / `pm2 monit` are the interactive view of a run;
              # its state and logs live under PM2_HOME=/work/home/.pm2 and outlive a restart.
              if [ ! -x /work/npm/bin/pm2 ]; then npm install -g --prefix /work/npm pm2 >/dev/null 2>&1; fi
              # Bring back whatever `pm2 save` recorded (a tier served from here); probe runs are
              # one-shot and are not saved, so a restart never resumes one.
              /work/npm/bin/pm2 resurrect >/dev/null 2>&1 || true
              if [ ! -x /work/bin/buildctl ]; then
                curl -fsSL -o /tmp/buildkit.tgz https://github.com/moby/buildkit/releases/download/v0.18.2/buildkit-v0.18.2.linux-amd64.tar.gz
                tar -xzf /tmp/buildkit.tgz -C /tmp bin/buildctl && install -m 755 /tmp/bin/buildctl /work/bin/buildctl
              fi
              if [ ! -x /work/bin/crane ]; then
                mkdir -p /work/bin
                curl -fsSL -o /tmp/crane.tgz https://github.com/google/go-containerregistry/releases/download/v0.20.3/go-containerregistry_Linux_x86_64.tar.gz
                echo "36c67a932f489b3f2724b64af90b599a8ef2aa7b004872597373c0ad694dc059  /tmp/crane.tgz" | sha256sum -c - >/dev/null
                tar -xzf /tmp/crane.tgz -C /work/bin crane
                curl -fsSL -o /work/bin/kubectl https://dl.k8s.io/release/v1.31.5/bin/linux/amd64/kubectl
                echo "fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af  /work/bin/kubectl" | sha256sum -c - >/dev/null
                chmod +x /work/bin/crane /work/bin/kubectl
              fi
              # tini as PID 1: a bare `sleep` never reaps, so every finished probe run stayed a
              # zombie and the runner kept seeing "a suite is already running".
              echo ready; exec /usr/bin/tini -- sleep infinity
          env:
            - { name: CARGO_HOME, value: /work/cargo }
            - { name: CARGO_TARGET_DIR, value: /work/target }
            - { name: PATH, value: /work/node/bin:/work/bun/bin:/work/bin:/work/npm/bin:/work/target/dev-image:/work/target/debug:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin }
            - { name: PM2_HOME, value: /work/home/.pm2 }
            - { name: HOME, value: /work/home }
            - { name: DOCKER_CONFIG, value: /work/home/.docker }
            - { name: BUILDKIT_HOST, value: unix:///run/buildkit/buildkitd.sock }
            - { name: KUBECONFIG, value: /etc/kloudlite/k3s/config }
            - name: KLOUDLITE_JWT_SECRET
              valueFrom: { secretKeyRef: { name: kloudlite-jwt, key: secret } }
          envFrom:
            - configMapRef: { name: kloudlite-slo-env }
          resources:
            requests: { cpu: "10", memory: 24Gi }
            limits: { cpu: "15", memory: 52Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: buildkit-sock, mountPath: /run/buildkit }
            - { name: k3s-kubeconfig, mountPath: /etc/kloudlite/k3s, readOnly: true }
            - { name: ssh-fast, mountPath: /etc/slo-ssh-fast, readOnly: true }
            - { name: ssh-hourly, mountPath: /etc/slo-ssh-hourly, readOnly: true }
            - { name: ssh-drill, mountPath: /etc/slo-ssh-drill, readOnly: true }
        # The image builder. Privileged because the Dockerfile's apt layers need a real overlay
        # snapshotter; its state (layer cache, pulled bases) lives on the same disk as the target
        # dir so a rebuild after a pod restart is as warm as the cargo build is.
        - name: buildkitd
          image: moby/buildkit:v0.18.2
          args: ["--addr", "unix:///run/buildkit/buildkitd.sock", "--root", "/work/buildkit"]
          securityContext: { privileged: true }
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "8", memory: 8Gi }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: buildkit-sock, mountPath: /run/buildkit }
      volumes:
        - name: buildkit-sock
          emptyDir: {}
        - name: work
          persistentVolumeClaim: { claimName: dev-work }
        - name: k3s-kubeconfig
          secret: { secretName: kloudlite-slo-k3s-kubeconfig }
        - name: ssh-fast
          secret: { secretName: kloudlite-slo, defaultMode: 0400, items: [{ key: ssh_key, path: id_ed25519 }] }
        - name: ssh-hourly
          secret: { secretName: kloudlite-slo-hourly, defaultMode: 0400, items: [{ key: ssh_key, path: id_ed25519 }] }
        - name: ssh-drill
          secret: { secretName: kloudlite-slo-drill, defaultMode: 0400, items: [{ key: ssh_key, path: id_ed25519 }] }
