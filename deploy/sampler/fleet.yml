# Fleet health in the terminal: `sampler -c deploy/sampler/fleet.yml`
# (https://github.com/sqshq/sampler).
#
# Every chart reads the ClickStack tables directly over ClickHouse's HTTP interface. Nothing here
# is ours to compute: the collectors write `default.otel_logs`/`otel_metrics_*` and each tile is
# one SQL count over them. Credentials come from the environment and never live in this file:
#   export CH_URL=https://<clickhouse-host>:8443 CH_USER=<reader> CH_PASSWORD=<password>
# The reader needs SELECT on default.otel_logs only.
#
# Log events are matched on `Body`, which is exactly the tracing event name our binaries log
# (`kube.timeout`, `http.failed`, ...), so a rename in code is a rename here.

variables:
  q: >-
    curl -sS --fail --max-time 20 --user "$CH_USER:$CH_PASSWORD" "$CH_URL/?default_format=TSV"
    --data-binary

runcharts:
  - title: API 5xx and slow requests (per 5 min)
    position: [[0, 0], [40, 13]]
    rate-ms: 30000
    scale: 0
    legend:
      enabled: true
      details: false
    items:
      - label: 5xx api
        color: 196
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'http.failed' AND ServiceName = 'kloudlite-api'"
      - label: 5xx server
        color: 208
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'http.failed' AND ServiceName = 'kloudlite-srv'"
      - label: slow api
        color: 45
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'http.slow' AND ServiceName = 'kloudlite-api'"
      - label: slow admin
        color: 111
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'http.slow' AND ServiceName = 'kloudlite-admin'"

  - title: Kube API stalls (per 5 min)
    position: [[40, 0], [40, 13]]
    rate-ms: 30000
    scale: 0
    legend:
      enabled: true
      details: false
    items:
      # Baseline before the 15 Sep stall fixes was ~600/day (~2 per 5 min); anything sustained
      # above that is the stall coming back.
      - label: kube.timeout
        color: 196
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'kube.timeout'"
      - label: event.late
        color: 214
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'event.late'"
      - label: reconcile.slow
        color: 45
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 5 MINUTE AND Body = 'reconcile.slow'"

sparklines:
  - title: Removal GC — would delete (switch off, last hour)
    position: [[0, 13], [27, 9]]
    rate-ms: 60000
    scale: 0
    sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 1 HOUR AND Body = 'gc.would_delete'"
  - title: Removal GC — deleted (last hour)
    position: [[27, 13], [26, 9]]
    rate-ms: 60000
    scale: 0
    sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 1 HOUR AND Body = 'gc.deleted'"
  - title: Removal GC — delete failed (last hour)
    position: [[53, 13], [27, 9]]
    rate-ms: 60000
    scale: 0
    sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 1 HOUR AND Body IN ('gc.delete.failed', 'gc.listing.failed')"

barcharts:
  - title: Errors by service (last 15 min)
    position: [[0, 22], [80, 10]]
    rate-ms: 60000
    scale: 0
    items:
      - label: api
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('error', 'fatal') AND ServiceName = 'kloudlite-api'"
      - label: admin
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('error', 'fatal') AND ServiceName = 'kloudlite-admin'"
      - label: server
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('error', 'fatal') AND ServiceName = 'kloudlite-srv'"
      - label: worker
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('error', 'fatal') AND ServiceName = 'kloudlite-worker'"
      - label: agent
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('error', 'fatal') AND ServiceName = 'kloudlite-agent'"
      - label: gateway
        sample: $q "SELECT count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('error', 'fatal') AND ServiceName = 'kloudlite-gateway'"

textboxes:
  - title: Latest warnings / errors
    position: [[0, 32], [80, 8]]
    rate-ms: 30000
    sample: $q "SELECT concat(formatDateTime(Timestamp, '%H:%i:%S', 'Asia/Kolkata'), '  ', ServiceName, '  ', Body) FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 15 MINUTE AND lower(SeverityText) IN ('warn', 'warning', 'error', 'fatal') AND ServiceName LIKE 'kloudlite-%' AND Body NOT IN ('http.slow') ORDER BY Timestamp DESC LIMIT 6"
