[package]
name = "kloudlite-server"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]                      # thin lib so the workspace test host (Task 11) can drive the router
name = "kloudlite_server"
path = "src/lib.rs"

[[bin]]
name = "kloudlite"        # binary name unchanged
path = "src/main.rs"

[dependencies]
tracing = { workspace = true }
metrics = { workspace = true }
kloudlite-core = { path = "../../crates/core", features = ["ssh"] }
kloudlite-storage = { path = "../../crates/storage" }
kloudlite-gitbase = { path = "../../crates/gitbase" }
kloudlite-pulls = { path = "../../crates/pulls", features = ["check"] }
kloudlite-app = { path = "../../crates/app" }
kloudlite-vcs = { path = "../../crates/git" }
kloudlite-registry = { path = "../../crates/registry" }
kloudlite-workspaces = { path = "../../crates/workspaces" }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
russh = { workspace = true }
ssh-key = { workspace = true }
flate2 = { workspace = true }          # gzip request bodies in the router
futures = { workspace = true }
tokio-util = { workspace = true }   # SyncIoBridge/StreamReader: the git handlers stream bodies
tempfile = { workspace = true }      # receive-pack's replay spool
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
gix-hash = { workspace = true }        # ObjectId, named directly in the router/browse_api
# The browse API's odb-reading handlers name `gix_odb::Handle` and call `gix_object::FindExt`
# directly (not just through gitbase/git's own APIs), so both are direct deps here too.
gix-odb = { workspace = true }
gix-object = { workspace = true }
# The `admin ownership-gc` diagnostic and the browse API's object-store housekeeping
# (`ObjectStoreExt::{get,delete}`, upload-session reads) name `slatedb`/`slatedb::object_store`
# directly, so it is a real dependency, not just a dev one for the test host.
slatedb = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
tower = { workspace = true }
