[package]
name = "rustic-git-agent-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_agent"
path = "src/lib.rs"

[[bin]]
name = "rustic-git-agent"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
rustic-git-core = { path = "../../crates/core" }
# For `install_crypto_provider` only: this binary opens TLS to the API server through kube.
rustic-git-storage = { path = "../../crates/storage" }
rustic-git-workspaces = { path = "../../crates/workspaces" }
kube = { workspace = true }
# Not used directly — it is where the `reconcile_on` feature gate lives; see the workspace manifest.
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
object_store = { workspace = true }
sha2 = { workspace = true }
# The replica-receive listener (`peer.rs`); already in the tree via crates/workspaces.
axum = { workspace = true }
# The replica-SEND half of `peer.rs`: streams a `btrfs send` child's stdout as the POST body to
# another node's peer listener.
reqwest = { workspace = true }
# The workspace host keypair, generated in-process (see `sshkeys.rs`).
ssh-key = { workspace = true }

[dev-dependencies]
# Tests only: every fs test gets its own pool/profiles root.
tempfile = { workspace = true }
async-trait = { workspace = true }
# The mocked `kube::Client` reconcile.rs drives the controller against — no cluster in `cargo test`.
rustic-git-workspaces = { path = "../../crates/workspaces", features = ["testkit"] }
base64 = { workspace = true }
# In the tree already via axum; peer.rs's router is driven directly with `oneshot`.
tower = { workspace = true }
