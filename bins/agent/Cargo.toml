[package]
name = "rustic-git-agent-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_agent"
path = "src/lib.rs"

[[bin]]
name = "rustic-git-agent"
path = "src/main.rs"

[dependencies]
# For `install_crypto_provider` only: this binary opens TLS to the API server through kube.
rustic-git-storage = { path = "../../crates/storage" }
rustic-git-workspaces = { path = "../../crates/workspaces" }
kube = { workspace = true }
k8s-openapi = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
object_store = { workspace = true }

[dev-dependencies]
# The mocked `kube::Client` reconcile.rs drives the controller against — no cluster in `cargo test`.
rustic-git-workspaces = { path = "../../crates/workspaces", features = ["testkit"] }
tempfile = { workspace = true }
