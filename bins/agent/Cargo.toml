[package]
name = "kloudlite-git-agent-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "kloudlite_git_agent"
path = "src/lib.rs"

[[bin]]
name = "kloudlite-git-agent"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
kloudlite-git-core = { path = "../../crates/core" }
# For `install_crypto_provider` only: this binary opens TLS to the API server through kube.
kloudlite-git-storage = { path = "../../crates/storage" }
kloudlite-git-workspaces = { path = "../../crates/workspaces" }
kube = { workspace = true }
# The guarded pin-clear patch in peer.rs's `release_dead_volumes` (test-then-replace, so a
# survivor's takeover landing between list and patch is refused rather than clobbered) — already
# in the tree transitively via kube-client, pinned at the same version here.
json-patch = "4.2.0"
# Not used directly — it is where the `reconcile_on` feature gate lives; see the workspace manifest.
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The replica-receive listener (`peer.rs`); already in the tree via crates/workspaces.
axum = { workspace = true }
# The replica-SEND half of `peer.rs`: streams a `btrfs send` child's stdout as the POST body to
# another node's peer listener.
reqwest = { workspace = true }
# The workspace host keypair, generated in-process (see `sshkeys.rs`).
ssh-key = { workspace = true }

[dev-dependencies]
# `tokio::time::pause`/`advance`, for the fake-clock beat-interval tests — production never
# builds with this, so a beat can never accidentally rely on virtual time.
tokio = { workspace = true, features = ["test-util"] }
# Tests only: every fs test gets its own pool/profiles root.
tempfile = { workspace = true }
async-trait = { workspace = true }
# The mocked `kube::Client` reconcile.rs drives the controller against — no cluster in `cargo test`.
kloudlite-git-workspaces = { path = "../../crates/workspaces", features = ["testkit"] }
base64 = { workspace = true }
# In the tree already via axum; peer.rs's router is driven directly with `oneshot`.
tower = { workspace = true }
