[package]
name = "rustic-git-agent-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_agent"
path = "src/lib.rs"

[[bin]]
name = "rustic-git-agent"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
rustic-git-core = { path = "../../crates/core" }
# For `install_crypto_provider` only: this binary opens TLS to the API server through kube.
rustic-git-storage = { path = "../../crates/storage" }
rustic-git-workspaces = { path = "../../crates/workspaces" }
kube = { workspace = true }
# Not used directly — it is where the `reconcile_on` feature gate lives; see the workspace manifest.
kube-runtime = { workspace = true }
k8s-openapi = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
object_store = { workspace = true }
# `ssh-keygen` writes to a path, so a host key is made in a tempdir and read back.
tempfile = { workspace = true }

[dev-dependencies]
# The mocked `kube::Client` reconcile.rs drives the controller against — no cluster in `cargo test`.
rustic-git-workspaces = { path = "../../crates/workspaces", features = ["testkit"] }
