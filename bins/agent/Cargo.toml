[package]
name = "rustic-git-agent-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_agent"
path = "src/lib.rs"

[[bin]]
name = "rustic-git-agent"
path = "src/main.rs"

[dependencies]
rustic-git-workspaces = { path = "../../crates/workspaces" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
object_store = { workspace = true }

[dev-dependencies]
rustic-git-core = { path = "../../crates/core" }
# loop.rs drives the server's vol-agent router (Task 14 moved register/work/done/failed there)
# in-process with MemStore, mirroring the root test host's use of the same crate.
rustic-git-server = { path = "../server" }
axum = { workspace = true }
tempfile = { workspace = true }
