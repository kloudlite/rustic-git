[package]
name = "kloudlite-slo-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "kloudlite_slo"
path = "src/lib.rs"

[[bin]]
name = "kloudlite-slo"
path = "src/main.rs"

[dependencies]
kloudlite-core = { path = "../../crates/core" }
# The catalogue and the wire types are the workspaces crate's: the probe reports what the admin
# process validates, so both sides must read one definition of `RunReport`, never two copies.
kloudlite-workspaces = { path = "../../crates/workspaces" }
clap = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
# `BoxFuture` is what lets a stage be a plain `fn` pointer in a table, and `catch_unwind` is how
# teardown still runs after a stage panics.
futures = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
# The drills exec into pods and taint nodes; the client is on `Ctx` so every stage shares one
# connection rather than building its own.
# `ws`: `Api::<Pod>::exec` is a websocket subresource, and `ws.exec.ok`/`homes.rw.p95`/`env.dns`
# are all questions only answerable from inside a pod.
kube = { workspace = true, features = ["ws"] }
k8s-openapi = { workspace = true }
# `reqwest` is pinned `rustls-no-provider` workspace-wide, so main() must install a provider
# explicitly — with `ring` and `aws-lc-rs` both reachable rustls 0.23 refuses to choose.
rustls = { workspace = true }
# The probe builds its own OCI layouts: a digest over the bytes it wrote, a Basic header for
# `/v2/token`, and one random layer. `crates/registry`'s `Digest` would do the first, but taking
# that crate as a dependency would pull SlateDB into a client that must never open a database.
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
# The drills' three cluster mutations sit behind one trait so `drills_always_undo` can record them
# with a fake; `async-trait` is what makes that trait object-safe with async methods.
async-trait = { workspace = true }
# `bak.*` lists the backup container with the storage account key the monthly CronJob mounts.
# `object_store` directly, NOT `crates/storage`: that crate would pull SlateDB into a client whose
# whole contract is that it never opens a database.
object_store = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
serde_json = { workspace = true }
