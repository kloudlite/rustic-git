[package]
name = "kl"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"
description = "kloudlite workspace CLI: build on the owner's builder, push to the owner's registry"
repository = "https://github.com/kloudlite/rustic-git"

[[bin]]
name = "kl"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kloudlite-ide = { path = "../../crates/ide" }
# `kl pkg`/`kl env` call `/v1`, which is HTTPS behind Cloudflare — hence rustls here and in the
# trace exporter's sibling below. Worth ~1.5 MB in the musl binary.
kloudlite-trace = { path = "../../crates/trace", default-features = false }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The buildx metadata file: created, not named and hoped for — see `Cmd::Build` in main.rs.
tempfile = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde_json = { workspace = true }
