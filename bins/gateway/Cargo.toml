[package]
name = "kloudlite-gateway-bin"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "kloudlite_gateway"
path = "src/lib.rs"

[[bin]]
name = "kloudlite-gateway"
path = "src/main.rs"

[dependencies]
tracing = { workspace = true }
metrics = { workspace = true }
kloudlite-core = { path = "../../crates/core" }
kloudlite-workspaces = { path = "../../crates/workspaces" }
# The one place this binary touches the object store: a minimal, read-only GET of
# `cluster/settings` on the refresh beat (`crates/storage::config::{object_store_views,
# get_central, central_fetch}`) — nothing else here needs `Store`'s SlateDB pool machinery.
kloudlite-storage = { path = "../../crates/storage" }
kube = { workspace = true }
k8s-openapi = { workspace = true }
# `ws` is what this binary is: the tunnel is a WebSocket upgrade and nothing else.
axum = { workspace = true, features = ["ws"] }
axum-server = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The tunnel's read buffer: a frame is split out of a `BytesMut` rather than copied into a `Vec`.
bytes = { workspace = true }
# `term.rs`'s ttyd-side socket: axum's `ws` feature is the client side of the SAME library, so this
# pins one version for both halves of the pump.
tokio-tungstenite = { workspace = true }

[dev-dependencies]
kloudlite-workspaces = { path = "../../crates/workspaces", features = ["testkit"] }
# `tests/term.rs`'s client for the plain-HTTP half of the proxy; the WS half reuses
# tokio-tungstenite, already a dependency above.
reqwest = { workspace = true }
# Minting an ALREADY-EXPIRED token: `Jwt::mint_ssh_session` always signs 60s into the future, and
# a test that waits out a real TTL is a minute of CI for one assertion.
jsonwebtoken = { workspace = true }
serde_json = { workspace = true }
