# A hung test fails the run in two minutes instead of holding the gate for hours.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# The root package's integration tests (tests/*.rs) run real listeners and elections on wall
# clocks; on 2026-09-15 routing and api_server each failed the ship gate once and passed on the
# rerun. One retry keeps a scheduling blip from costing a re-ship; nextest marks the pass FLAKY
# and counts it in the Summary, and ship.sh echoes those lines, so a flake stays visible.
# What it MASKS today, named so the blast radius is not a mystery: the two wall-clock suites
# `tests/routing.rs` and `tests/api_server.rs` — the election/routing tests, which is precisely
# where a masked retry costs the most. Every other test in the package gets a retry none has
# needed.
# ponytail: whole-package retry. Narrow `filter` to those two binaries, then to the individual
# test names, as each flake is pinned; the retry is an allowance for a scheduling blip, never
# cover for a real intermittent failure.
[[profile.default.overrides]]
filter = 'package(kloudlite-tests)'
retries = 1
