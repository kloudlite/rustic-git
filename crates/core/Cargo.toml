[package]
name = "kloudlite-core"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "kloudlite_core"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
schemars = { workspace = true }
# Pulled in transitively via metrics-exporter-prometheus already; promoted to direct because
# `LiveSettings<T>` (settings.rs) is core's own hot-path handle, not borrowed from a dependency.
arc-swap = "1"
# Only for `sshkeys`: two crates (the server binary and the api) both need the fingerprint of an
# OpenSSH public key, and a hand-mirrored copy of a security-relevant parse drifts. Optional so
# `storage`, which depends on core and must stay free of ssh parsing, does not pull it in.
russh = { workspace = true, optional = true }

[features]
ssh = ["dep:russh"]

[dev-dependencies]
rustls = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
