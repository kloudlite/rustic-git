[package]
name = "rustic-git-pulls"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_pulls"

[features]
# The mergeability check is a gix graph walk; the worker never runs it and must not link gix
# to have the pull-request model. The server and the facade turn it on.
check = ["dep:gix-hash", "dep:rustic-git-gitbase"]

[dependencies]
tracing = { workspace = true }
rustic-git-core = { path = "../core" }
rustic-git-storage = { path = "../storage" }
rustic-git-gitbase = { path = "../gitbase", optional = true }
gix-hash = { workspace = true, optional = true }
slatedb = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
mongodb = { workspace = true }
libc = { workspace = true }         # merge_worker: kill a timed-out git's whole process group

[dev-dependencies]
tempfile = { workspace = true }
