[package]
name = "rustic-git-workspaces"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_workspaces"

[dependencies]
kube = { workspace = true }
k8s-openapi = { workspace = true }
schemars = { workspace = true }
rustic-git-core = { path = "../core" }
rustic-git-storage = { path = "../storage" }
slatedb = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
azure_data_cosmos = { workspace = true, features = ["key_auth"] }
azure_core = "0.31"
futures = { workspace = true }
object_store = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
# Only `kube_test` needs these — it is compiled into the library (not behind `#[cfg(test)]`)
# because the `/v1` integration tests in tests/ build an `ApiState` around a mocked client.
tower = { workspace = true, optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
# Mock kube client for tests. Off by default so the harness and its HTTP plumbing stay out of
# every binary that links this crate; the dev-dependency below turns it on for our own tests.
testkit = ["dep:tower", "dep:http", "dep:http-body-util"]

[dev-dependencies]
rustic-git-workspaces = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Cyclic dev-dependency (bins/server depends on this crate normally) — fine in Cargo, dev-deps
# aren't part of the graph used to build the library itself. Lets engine_ops.rs boot the real
# vol-agent router in-process as the registry, same as bins/agent/tests/loop.rs does.
rustic-git-server = { path = "../../bins/server" }
