[package]
name = "rustic-git-workspaces"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_workspaces"

[dependencies]
tracing = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
schemars = { workspace = true }
rustic-git-core = { path = "../core" }
rustic-git-storage = { path = "../storage" }
slatedb = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
azure_data_cosmos = { workspace = true, features = ["key_auth"] }
# default-features off: the default set is `reqwest_native_tls`, which is the OpenSSL stack —
# a third TLS implementation next to ring and object_store's aws-lc-rs, and the one the root
# Cargo.toml's `rustls` comment exists to keep out. Nothing here names a client type; the SDK
# builds its own reqwest 0.12 client, so the TLS it gets is whatever that crate's features say.
azure_core = { version = "1.1", default-features = false, features = ["reqwest", "reqwest_gzip", "reqwest_deflate"] }
# Never imported. With native-tls gone, `typespec_client_core`'s reqwest 0.12 has NO TLS feature
# at all and every https call to Cosmos fails with "error sending request" — the same trap the
# root `reqwest` comment records for 0.13. Naming the crate here with the rustls feature is how a
# feature reaches a transitive dependency: Cargo unions features per package, so this edge turns
# rustls on for the SDK's copy. `-no-provider`: the process provider is ring, installed by every
# binary's main() (`config::install_crypto_provider`), never a second aws-lc-rs.
# Delete when azure_core grows a `reqwest_rustls` feature (0.31 has none).
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
futures = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
zstd = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
# Only `kube_test` needs these — it is compiled into the library (not behind `#[cfg(test)]`)
# because the `/v1` integration tests in tests/ build an `ApiState` around a mocked client.
tower = { workspace = true, optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
# Mock kube client for tests. Off by default so the harness and its HTTP plumbing stay out of
# every binary that links this crate; the dev-dependency below turns it on for our own tests.
testkit = ["dep:tower", "dep:http", "dep:http-body-util"]

[dev-dependencies]
rustic-git-workspaces = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Cyclic dev-dependency (bins/server depends on this crate normally) — fine in Cargo, dev-deps
# aren't part of the graph used to build the library itself. Lets engine_ops.rs boot the real
# vol-agent router in-process as the registry, same as bins/agent/tests/loop.rs does.
rustic-git-server = { path = "../../bins/server" }
