[package]
name = "kloudlite-workspaces"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "kloudlite_workspaces"

[dependencies]
tracing = { workspace = true }
metrics = { workspace = true }
kube = { workspace = true }
k8s-openapi = { workspace = true }
schemars = { workspace = true }
kloudlite-core = { path = "../core" }
kloudlite-storage = { path = "../storage" }
slatedb = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The `test`-op CAS `/v1` guards `spec.intercepts` with — same version the agent pins.
json-patch = "4.2.0"
libc = { workspace = true }
reqwest = { workspace = true }
# `kube_bound`'s layer is in every binary that builds a kube client, so these two are not
# optional. `http-body-util` is `kube_test`'s alone — it is compiled into the library (not behind
# `#[cfg(test)]`) because the `/v1` integration tests in tests/ build an `ApiState` around a
# mocked client.
tower = { workspace = true, features = ["retry"] }
http = { version = "1" }
# `k8s::client::bounded_client` rebuilds kube's client stack to put keepalive on the connector;
# these are the exact crates and versions kube-client 4.2 builds it from.
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
hyper-timeout = "0.5.2"
http-body-util = { version = "0.1", optional = true }

[features]
# Mock kube client for tests. Off by default so the harness and its HTTP plumbing stay out of
# every binary that links this crate; the dev-dependency below turns it on for our own tests.
testkit = ["dep:http-body-util"]

[dev-dependencies]
kloudlite-workspaces = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
# Cyclic dev-dependency (bins/server depends on this crate normally) — fine in Cargo, dev-deps
# aren't part of the graph used to build the library itself. Lets engine_ops.rs boot the real
# vol-agent router in-process as the registry, same as bins/agent/tests/loop.rs does.
kloudlite-server = { path = "../../bins/server" }
