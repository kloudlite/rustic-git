[package]
name = "rustic-git-api"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"

[lib]
name = "rustic_git_api"

[dependencies]
tracing = { workspace = true }
rustic-git-core = { path = "../core" }
rustic-git-storage = { path = "../storage" }
rustic-git-pulls = { path = "../pulls" }
rustic-git-workspaces = { path = "../workspaces" }
tokio = { workspace = true }
slatedb = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
pgp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
form_urlencoded = { workspace = true }
rand = { workspace = true }
mongodb = { workspace = true }
# Only `ssh_fingerprint` (in `credentials.rs`) needs this — computing an OpenSSH key's
# fingerprint before it is stored. Not in the brief's dependency list; added because that one
# function has no `russh`-free way to do it.
russh = { workspace = true }
# `ssh-keygen` writes a key to a PATH, so generating one needs a private scratch directory that is
# removed even if the process dies mid-call.
tempfile = { workspace = true }
# Invitation tokens are stored by hash — already in the graph via storage.
sha2 = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
