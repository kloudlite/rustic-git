[package]
name = "kloudlite-ide"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"
description = "The workspace tool server behind `kl ide serve`: files, exec, watch and graft over MCP on loopback"
repository = "https://github.com/kloudlite/rustic-git"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws", "json"] }
bytes = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }
regex = { workspace = true }
gix = { version = "0.87", default-features = false, features = ["sha1", "status", "blob-diff", "dirwalk", "revision", "index", "worktree-mutation"] }
# The hash kind lives in gix-hash's features; the workspace pin carries `sha1`.
gix-hash = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
