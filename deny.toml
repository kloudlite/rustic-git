# `rustsec/audit-check` in .github/workflows/image.yml already covers advisories. This file is
# for the three things it does not do: banned/duplicate crates, licence policy, and where code is
# allowed to come from — the checks worth having on a tree with this much crypto surface (JWT,
# ssh, pgp, registry auth).

[advisories]
# A yanked crate is a decision someone upstream already made; inheriting it silently is not an
# option we want.
yanked = "deny"
# Unmaintained is a signal about crates we CHOSE, not about the graph underneath them. Scoped to
# the workspace's own dependencies, it is actionable; across every transitive crate it is noise
# that nobody can act on (bincode, paste and rustls-pemfile all arrive under redis and slatedb),
# and a check nobody can act on is a check that gets ignored wholesale.
unmaintained = "workspace"
ignore = [
    # Marvin timing sidechannel in `rsa`, with no fixed version published. Both `rsa` lines here
    # are pulled by russh's ssh-key, not by us — see the root Cargo.toml `rand` comment for the
    # same upstream pin. Nothing in this tree performs RSA private-key operations an attacker can
    # time: `rsa` is reachable only for verifying client SSH keys and PGP signatures.
    { id = "RUSTSEC-2023-0071", reason = "transitive via russh/ssh-key; no fix published; no attacker-timed private-key op here" },
]

[bans]
# Warn, not deny: the duplicates below are pinned by upstream crates, not by us.
multiple-versions = "warn"
# The `rand` and `rsa` lines the root Cargo.toml's `rand` comment explains — each is held by an
# upstream crate, so bumping ours alone would not collapse them. That comment is the record of
# when this list can shrink; delete entries here as it does.
skip = [
    { crate = "rand" },
    { crate = "rand_core" },
    { crate = "rand_chacha" },
    { crate = "rsa" },
]

[licenses]
# Permissive only. Anything not on this list fails the check rather than needing a reviewer to
# notice it — a copyleft dependency arriving transitively is exactly the case this catches.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Ours, not a dependency: every crate in this workspace is SSPL-1.0. `private.ignore` would be
    # the narrower knob, but it only exempts crates marked `publish = false`, which these are not.
    # The cost is that a third-party SSPL crate would also pass — none exists in the graph today,
    # and `cargo deny list | grep SSPL` is the check if that ever needs confirming.
    "SSPL-1.0",
]
exceptions = [
    # Public-domain dedication, permissive in every way that matters, but not an SPDX licence we
    # want to accept blanket-wide.
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
