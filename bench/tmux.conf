# Read once by the foreground server (bench/sv/tmux/run): the session every login attaches to.
new-session -d -s kl claude --messaging-socket-path /tmp/kl/kl.sock
# The bench terminal is the agent CLI only, no other shell (final review I3): the default prefix
# bindings include `C-b c` (new window running $SHELL) and `C-b :` (run-shell), both of which
# would hand out bash. Dropping the prefix removes every one of them at once.
set -g prefix None
unbind -a -T prefix
set -g mouse on
# The agent CLI dims and redraws on focus change; without this tmux swallows the focus events.
set -g focus-events on
