# Azure Pipelines mirror of .github/workflows/{image,web}.yml.
#
# Same jobs, same images, same tags — a commit built here is indistinguishable from one built on
# GitHub, so deploy manifests pin the SHA and never care which ran. This exists so a GitHub Actions
# outage (26 Aug 2026: 3h+ of `major_outage` with runs queued and no jobs) cannot stop a deploy.
#
# Differences from the GitHub side, all forced by the platform:
#   - Docker layer cache is `type=registry` (a `:buildcache` tag on GHCR) rather than `type=gha`.
#     Same `mode=max`, so cargo-chef's dependency cook is cached across runs here too.
#   - GHCR login is a pipeline secret, not an ambient token: set `GHCR_USER` and `GHCR_TOKEN`
#     (a PAT with write:packages) as secret variables on the pipeline. Nothing here echoes them.
#   - `audit-check` posts a GitHub check run and has no Azure equivalent; `cargo audit` runs inline
#     and fails the job on an advisory instead. `cargo-deny` is the same binary either side.
#
# Runs on the self-hosted `build-0` pool — the build VM deploy/k3s/dev-push.sh already uses —
# not Microsoft-hosted agents: a new org has no hosted parallelism until Microsoft grants it.
# Self-hosted is fine HERE where it was not on GitHub, because this repo is private: no
# stranger's pull request can reach the agent. Registration: deploy/azure-agent-register.sh.
# The rustup and bun installs below land in the agent user's home, so after the first run they
# are no-ops.
#
# Tests gate the DEPLOY, not the build, exactly as on GitHub: the image job does not depend on the
# test job, because an image from a commit whose tests fail is tagged by SHA and simply never
# rolled out.

trigger:
  branches:
    include: [master]

pr: none

variables:
  REG: ghcr.io/kloudlite
  # `Build.SourceVersion` is the full SHA — the same value GitHub tags with.
  SHA: $(Build.SourceVersion)
  DOCKER_BUILDKIT: 1

stages:
  - stage: rust
    displayName: rust
    jobs:
      - job: test
        displayName: clippy · test · audit · deny
        pool: { name: build-0 }
        steps:
          - checkout: self
          - task: Cache@2
            displayName: cargo cache
            inputs:
              key: 'cargo | "$(Agent.OS)" | Cargo.lock'
              restoreKeys: |
                cargo | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/cargo
          - script: |
              set -euo pipefail
              # Cache@2 restores into a directory; point cargo's home and target at it so both the
              # registry and the compiled deps survive between runs.
              echo "##vso[task.setvariable variable=CARGO_HOME]$(Pipeline.Workspace)/cargo/home"
              echo "##vso[task.setvariable variable=CARGO_TARGET_DIR]$(Pipeline.Workspace)/cargo/target"
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
              echo "##vso[task.prependpath]$HOME/.cargo/bin"
            displayName: toolchain
          - script: cargo clippy --workspace -- -D warnings
            displayName: clippy
          - script: cargo test
            displayName: test
          - script: |
              set -euo pipefail
              cargo install --locked cargo-audit cargo-deny
              cargo audit
              cargo deny check
            displayName: audit · deny

      - job: image
        displayName: image
        pool: { name: build-0 }
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              docker buildx create --use --name ci
              # Same rule as deploy/k3s/dev-push.sh: --password-stdin, never in argv.
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$(GHCR_USER)" --password-stdin
            displayName: buildx + login
            env:
              GHCR_TOKEN: $(GHCR_TOKEN)
          # Both images from ONE builder stage — the second build reuses the first's compile via
          # the shared registry cache, as on GitHub via the shared gha scope.
          - script: |
              set -euo pipefail
              docker buildx build . --target server --platform linux/amd64 --push \
                -t $(REG)/rustic-git:latest -t $(REG)/rustic-git:$(SHA) \
                --cache-from type=registry,ref=$(REG)/rustic-git:buildcache \
                --cache-to   type=registry,ref=$(REG)/rustic-git:buildcache,mode=max
              docker buildx build . --target agent --platform linux/amd64 --push \
                -t $(REG)/rustic-git-agent:latest -t $(REG)/rustic-git-agent:$(SHA) \
                --cache-from type=registry,ref=$(REG)/rustic-git:buildcache \
                --cache-to   type=registry,ref=$(REG)/rustic-git:buildcache,mode=max
            displayName: build + push server, agent

  - stage: web
    displayName: web
    dependsOn: []
    jobs:
      - job: check
        displayName: typecheck · lint · test · build
        pool: { name: build-0 }
        steps:
          - checkout: self
          - task: Cache@2
            displayName: turbo cache
            inputs:
              key: 'turbo | "$(Agent.OS)" | web/bun.lock'
              restoreKeys: |
                turbo | "$(Agent.OS)"
              path: web/.turbo
          - script: |
              set -euo pipefail
              curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: bun
          - script: bun install --frozen-lockfile
            workingDirectory: web
            displayName: install
          - script: bun run typecheck && bun run lint && bun run test
            workingDirectory: web
            displayName: typecheck · lint · test
          - script: bun run build
            workingDirectory: web
            displayName: build
            env:
              NEXT_TELEMETRY_DISABLED: 1

      - job: image
        displayName: image
        dependsOn: check
        pool: { name: build-0 }
        steps:
          - checkout: self
          - script: |
              set -euo pipefail
              docker buildx create --use --name ci
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$(GHCR_USER)" --password-stdin
            displayName: buildx + login
            env:
              GHCR_TOKEN: $(GHCR_TOKEN)
          - script: |
              set -euo pipefail
              docker buildx build web --platform linux/amd64 --push \
                -t $(REG)/rustic-git-web:latest -t $(REG)/rustic-git-web:$(SHA) \
                --cache-from type=registry,ref=$(REG)/rustic-git-web:buildcache \
                --cache-to   type=registry,ref=$(REG)/rustic-git-web:buildcache,mode=max
            displayName: build + push web
