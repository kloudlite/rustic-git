[workspace]
members = [
    ".",
    "crates/core", "crates/storage", "crates/gitbase", "crates/pulls", "crates/app", "crates/git", "crates/registry", "crates/api", "crates/workspaces",
    "bins/server", "bins/api", "bins/worker", "bins/agent", "bins/gateway", "bins/kl",
]
# This root package is ALSO the workspace root ([workspace] + [package] in one file), which makes
# a bare `cargo build`/`cargo test` here default to building only `.` — a lib with no `[[bin]]`
# any more, so the three binaries would silently not get built. `default-members` restores the
# whole-workspace default so `cargo build --release --locked; ls target/release/rustic-git*`
# (the deploy image's build command) keeps working unchanged.
default-members = [
    ".",
    "crates/core", "crates/storage", "crates/gitbase", "crates/pulls", "crates/app", "crates/git", "crates/registry", "crates/api", "crates/workspaces",
    "bins/server", "bins/api", "bins/worker", "bins/agent", "bins/gateway", "bins/kl",
]
resolver = "2"

# Every shared dependency pinned once. Members say `{ workspace = true }`; a member may add
# features but never a different version. Feature sets live here so two members cannot drift.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
slatedb = { version = "0.15", features = ["aws", "azure"] }
axum = { version = "0.8", features = ["http1", "tokio", "query"] }
russh = "0.62"
gix-odb = { version = "0.83", features = ["parallel"] }
gix-pack = "0.73"
gix-object = "0.63"
gix-hash = { version = "0.26", features = ["sha1"] }
gix-traverse = "0.60"
gix-features = { version = "0.49", features = ["progress"] }
gix-actor = "0.41"
flate2 = "1"
futures = "0.3"
# Three `rand` versions (0.8 here, 0.9 and 0.10 under russh/ssh-key/pgp) and two `rsa` (one a
# release candidate, pulled by russh's ssh-key) are in the lock. Each is pinned by an upstream
# crate; bumping this one alone would not collapse them. Revisit when russh and pgp agree on a
# rand line — `cargo tree -d` is the check.
rand = "0.8"
base64 = "0.22"
bytes = "1"
sha2 = "0.10"
# Direct dependency purely so main() can install a crypto provider: with both `ring` and
# `aws-lc-rs` reachable in the graph, rustls 0.23 will not pick one on its own.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The Kubernetes API is the reconcile substrate for workspaces/environments (see
# docs/superpowers/specs/2026-08-26-k3s-architecture-design.md). kube 4.2 pins k8s-openapi 0.28
# exactly, and 0.28's oldest version feature is `v1_32` — which is why deploy/k3s installs k3s
# v1.33. A client one minor behind the server is supported; ahead is not.
#
# kube's default features (client, rustls-tls, ring) are kept deliberately: letting it pull
# `aws-lc-rs` instead would put a second TLS stack in the graph, which is exactly what the rustls
# comment above exists to prevent.
kube = { version = "4.2", features = ["derive", "runtime"] }
# Two gated methods. `Controller::reconcile_on` lets a finished btrfs operation wake its own
# reconciler instead of waiting out the agent's 15s requeue (the stable alternative,
# `reconcile_all_on`, re-reconciles every object on the node for one volume's completion).
# `watches_shared_stream`/`for_shared_stream` let the four controllers that need this node's
# Volumes share ONE watch instead of opening four against the API server. `kube` only forwards the
# `unstable-runtime` umbrella — which would also switch on stream-control — so the gates are turned
# on here, on kube-runtime directly, one feature each. A gate is an API-stability promise rather
# than a maturity one, and pins us to this kube minor until the methods stabilise.
kube-runtime = { version = "4.2", features = ["unstable-runtime-reconcile-on", "unstable-runtime-subscribe"] }
k8s-openapi = { version = "0.28", features = ["v1_33", "schemars"] }
schemars = "1"
# `rustls-no-provider`, not `rustls`: the latter drags in aws-lc-rs, a second TLS stack next to
# the ring one pinned below, which each binary pulls in through its own `rustls` dependency.
# Named HERE, not left to unification: `cargo build -p kl` sees only kl's graph, and without this
# it built a client with no TLS at all ("error sending request" on every https URL).
reqwest = { version = "0.13", default-features = false, features = ["stream", "query", "json", "gzip", "rustls-no-provider"] }
# Already in the tree via `url`; named directly because the registry's token endpoint parses a
# query string that may repeat a key, which serde's struct deserialization refuses.
form_urlencoded = "1"
imara-diff = "0.1"
tracing = "0.1"
# The `metrics` facade is a no-op until a recorder is installed (`rustic_git_core::metrics::init`),
# same failure shape as a missing tracing subscriber: silence, not a crash.
metrics = "0.24"
# env-filter for RUST_LOG, fmt for the stderr writer, json for RUSTIC_GIT_LOG_FORMAT=json so a
# log pipeline can index fields instead of grepping text.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
# rust_crypto, not the default: jsonwebtoken otherwise resolves its backend from
# rustls' PROCESS-LEVEL CryptoProvider, so signing works only after main() has
# installed one — and panics anywhere that has not, tests included. Choosing the
# backend at compile time makes the library self-contained.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Already in the tree transitively (object_store's `last_modified`, and SlateDB); declared
# directly because the blob sweep compares it against a grace-window cutoff.
chrono = "0.4"
# OpenPGP, for verifying GPG-signed commits. default-features off: the defaults
# pull bzip2 (a C library) for compressed packets, which a signature never needs.
pgp = { version = "0.20", default-features = false }
# Only the gzip compressor: mounted on the two JSON routers (browse, /v1) and
# nowhere near packs or registry blobs, which are already compressed.
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# dev-only
slatedb-common = { version = "0.15", features = ["test-util"] }
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
# Cosmos DB SQL API client for the workspaces/environments metastore (Task 2). Its HTTP client
# is azure_core's reqwest 0.12 — the second reqwest major in the lock, and the one that carried
# native-tls/openssl-sys until crates/workspaces turned azure_core's defaults off and switched
# that copy to rustls. `cargo tree -i openssl-sys --target x86_64-unknown-linux-gnu` must stay
# empty (on macOS the check is vacuous: native-tls there is Security.framework).
azure_data_cosmos = "0.30"
# Already in the lock via slatedb (its aws/azure features); declared directly for the
# workspaces snapshot engine's layer store (Task 3), pinned to slatedb's version.
#
# This is the one dependency that puts `aws-lc-rs` in the graph, and it cannot be cut from here:
# object_store 0.14 hard-wires `aws = [.., "aws-lc-rs"]` and `azure = [.., "aws-lc-rs"]` (its
# `ring` feature only wins when `aws-lc-rs` is OFF, and slatedb's own `aws`/`azure` features are
# `object_store/aws`, `object_store/azure` — no `-base` variants to reach for). Behaviour is still
# ring: rustls uses the PROCESS provider every main() installs, and object_store's aws-lc-rs use
# is confined to request signing inside that crate. The cost is build time and one C library, not
# a second TLS stack in use. Revisit when slatedb exposes `aws-base`-style features or
# object_store makes the provider a choice — `cargo tree -i aws-lc-rs` is the check.
object_store = { version = "0.14", features = ["aws", "azure"] }
zstd = { version = "0.13", features = ["zstdmt"] }
libc = "0.2"
# The gateway serves TLS itself (a Cloudflare Origin CA certificate on hostPort 443) — axum's own
# `serve` is plaintext only. `tls-rustls-no-provider`, not `tls-rustls`: the latter turns on
# rustls/aws-lc-rs, which is the second TLS stack the `rustls` pin above exists to keep out.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# dev-only: the gateway's tests are its own WebSocket client. Pinned here so it cannot drift from
# the copy axum's `ws` feature pulls in.
tokio-tungstenite = "0.29"
# The `kl` CLI's argument parser.
clap = { version = "4", features = ["derive"] }

[package]
name = "rustic-git-tests"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"
description = "Integration-test host for the rustic-git workspace"
repository = "https://github.com/kloudlite/rustic-git"

[dev-dependencies]
rustic-git-core = { path = "crates/core" }
rustic-git-storage = { path = "crates/storage" }
rustic-git-gitbase = { path = "crates/gitbase" }
rustic-git-pulls = { path = "crates/pulls", features = ["check"] }
rustic-git-app = { path = "crates/app" }
rustic-git-git = { path = "crates/git" }
rustic-git-registry = { path = "crates/registry" }
rustic-git-workspaces = { path = "crates/workspaces" }
rustic-git-api = { path = "crates/api" }
# The integration tests in `tests/` drive the composed server; the router/lanes they exercise
# live in the server binary crate (Task 10 moved them out of the old facade's `http`/lane fns).
rustic-git-server = { path = "bins/server" }
tokio = { workspace = true }
axum = { workspace = true }
russh = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
slatedb = { workspace = true }
gix-hash = { workspace = true }
gix-odb = { workspace = true }
gix-object = { workspace = true }
gix-traverse = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
# Already in the lock via slatedb; the feature is what exposes MockSystemClock, so a test can jump
# the clock past the compactor's 15-minute checkpoint lifetime instead of waiting for it.
slatedb-common = { workspace = true }
# Cosmos DB (Mongo API). rustls, not openssl: the binary already installs a ring
# provider at startup and must not pull a second TLS stack.
mongodb = { workspace = true }
async-trait = { workspace = true }
# In the tree already via axum; declared so tests can drive a Router with oneshot.
tower = { workspace = true }
tempfile = { workspace = true }

# Measured on nothing yet: thin LTO and one codegen unit are the conventional cheap wins for a
# binary that is built once per commit and runs for days; `strip` keeps the image small. Switch
# to `lto = "fat"` only with a benchmark in hand — it roughly doubles the link time for a few
# percent.
[profile.release]
# A panic now exits the pod (no unwinding), dropping its warm repos — deliberate trade for a
# smaller/faster binary; a poison that would otherwise wedge a thread becomes a pod restart.
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true

# Release, minus the two settings that cost the most compile time for the least runtime gain.
#
# For DEV images only — the ones pushed by `deploy/k3s/dev-push.sh` while iterating on the cluster.
# `lto = "thin"` and `codegen-units = 1` are correct for production and slow by design: they exist
# to let the optimizer see across the whole crate graph, which is exactly the work being skipped
# here. Everything that changes BEHAVIOUR (`panic = "abort"`, so a panic exits the pod rather than
# unwinding) is inherited unchanged, so a dev image fails the same way a real one does.
#
# `strip` stays off so a panic in a dev image carries a usable backtrace.
[profile.dev-image]
inherits = "release"
lto = false
codegen-units = 16
strip = false
