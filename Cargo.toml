[package]
name = "rustic-git"
version = "0.1.0"
edition = "2021"
license = "SSPL-1.0"
description = "Git server: packs in object storage, refs in embedded SlateDB, Smart HTTP + SSH"
repository = "https://github.com/kloudlite/rustic-git"

[lib]
name = "rustic_git"
path = "src/lib.rs"

[[bin]]
name = "rustic-git"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
slatedb = { version = "0.15", features = ["aws", "azure"] }
axum = { version = "0.8", features = ["http1", "tokio", "query"] }
russh = "0.62"
gix-odb = { version = "0.83", features = ["parallel"] }
gix-pack = "0.73"
gix-object = "0.63"
gix-hash = { version = "0.26", features = ["sha1"] }
gix-traverse = "0.60"
gix-features = { version = "0.49", features = ["progress"] }
flate2 = "1"
futures = "0.3"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["stream", "query"] }
imara-diff = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
