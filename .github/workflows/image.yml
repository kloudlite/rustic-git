name: image
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    # GitHub's runner, not the self-hosted VM: that VM exists for its docker layer cache and
    # carries no Rust toolchain. The cargo cache below keys on Cargo.lock, so after the first
    # cold build (the C deps: aws-lc-sys, ring, zstd) this is a few minutes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # audit-check posts its findings as a check run on the commit.
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Workspace-wide, not `--all-targets`: the test targets carry pre-existing lints that are not
      # worth a reformat-sized diff (see CLAUDE.md). `cargo fmt --check` is deliberately absent
      # for the same reason — the tree is not rustfmt-shaped and gating it means one repo-wide
      # reformat commit, which is the owner's call, not CI's.
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # `audit-check` above covers advisories only. This adds the three checks a repo with this
      # much crypto surface wants: banned/duplicate crates, licence policy, and source
      # allowlisting. Config lives in deny.toml, next to Cargo.toml.
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

  build:
    needs: test
    # GitHub-hosted, deliberately. This was a self-hosted VM so the Docker daemon's on-disk layer
    # cache could carry the cargo-chef dependency layer between runs. That trade stopped being
    # acceptable when the repository became public: a self-hosted runner holding a GHCR write token
    # executes code from any fork's pull request, and the previous comment here said to revisit it
    # "before this repo accepts pull requests from outside". It also stopped working — the runner
    # was decommissioned, so every build simply queued forever with nothing to claim it.
    #
    # The dependency layer still survives between runs; it just lives in the GitHub Actions cache
    # (`type=gha`) instead of a machine we own and have to defend.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        # Default docker-container driver: required for `type=gha` cache, which the classic
        # `docker` driver cannot export to.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # linux/amd64 only: the cluster is amd64, and a second platform would double a build that
          # is already dominated by compiling aws-lc-sys, ring and zstd-sys from C.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kloudlite/rustic-git:latest
            ghcr.io/kloudlite/rustic-git:${{ github.sha }}
          # `mode=max` caches the intermediate stages too, which is the point: the expensive layer
          # is cargo-chef's dependency cook, and it lives in a stage that never reaches the final
          # image. Without `max` only the runtime layers would be cached and every run would
          # recompile the C dependencies from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
