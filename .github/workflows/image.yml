name: image
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    # GitHub's runner, not the self-hosted VM: that VM exists for its docker layer cache and
    # carries no Rust toolchain. The cargo cache below keys on Cargo.lock, so after the first
    # cold build (the C deps: aws-lc-sys, ring, zstd) this is a few minutes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `--lib`, not `--all-targets`: the test targets carry pre-existing lints that are not
      # worth a reformat-sized diff (see CLAUDE.md). `cargo fmt --check` is deliberately absent
      # for the same reason — the tree is not rustfmt-shaped and gating it means one repo-wide
      # reformat commit, which is the owner's call, not CI's.
      - run: cargo clippy --lib -- -D warnings
      - run: cargo test
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: test
    # Self-hosted VM: its Docker daemon keeps the layer cache on local disk between runs, which is
    # what makes the dependency layer below survive from build to build. `self-hosted, linux, X64`
    # are the labels every self-hosted runner gets automatically, so this needs no custom label.
    #
    # Known trade: a persistent runner with a GHCR write token and a persistent docker cache is a
    # standing target. Acceptable for a single-maintainer repo where only `master` pushes and
    # manual dispatches reach it; revisit before this repo accepts pull requests from outside.
    # The prune step at the end keeps the cache from growing without bound.
    runs-on: [self-hosted, linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # `docker` driver = build through the local daemon, so previous builds' layers on this
          # VM's disk are reused directly. The default docker-container driver runs in its own
          # container and would start cold every run.
          driver: docker
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # No explicit platforms: the runner is linux/amd64 and so is the cluster, so the host
          # build is the right one. The classic docker driver builds for the host arch anyway, and
          # passing a platform list to it is what makes it reach for the container driver.
          push: true
          tags: |
            ghcr.io/kloudlite/rustic-git:latest
            ghcr.io/kloudlite/rustic-git:${{ github.sha }}
          # No cache-from/to: on a persistent runner the daemon's own layer cache is the cache,
          # and type=gha would add a multi-GB upload/download to every run for no gain.
      # Only on a manual dispatch: the layer cache IS the build speed, so pruning it per push would
      # throw that away, and GitHub's expression syntax has no `%` for a "every Nth run" rule.
      # `-f` skips the prompt; no `--all`, so the layers the last build used stay.
      - if: github.event_name == 'workflow_dispatch'
        run: docker builder prune -f --filter until=168h
