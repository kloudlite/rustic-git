name: image
on:
  push:
    branches: [master]
  # PRs get the test job only: a red commit is cheapest to catch before it is on master, and a
  # PR has no business producing a package. `build` and `image` are skipped on this event.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # build-0, the same VM the fast loop builds on: 16 cores and a target dir that persists
    # between runs, so an ordinary commit recompiles only what it touched. Two runner slots are
    # registered there (`build-0`, `build-0-b`) so this job and `build` still run in parallel.
    # A GitHub runner took eleven minutes here, most of it recompiling crates the cache could not
    # keep across commits.
    runs-on: [self-hosted, build-0]
    timeout-minutes: 30
    permissions:
      contents: read
      # audit-check posts its findings as a check run on the commit.
      checks: write
    # The `/v1` handlers sit behind a concrete Mongo struct, so their tests need a real Mongo
    # (tests/common::mongo). This job runs ON the runner rather than in a container, so the
    # service is reached through its published port on localhost — `mongo:27017` would only
    # resolve for a container job. Without the variable the tests keep their gate half and skip
    # the handler half, which is what a laptop gets.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      KLOUDLITE_TEST_MONGO_URI: mongodb://localhost:27017
      # One target dir shared by both runner slots on build-0, so whichever slot takes this job
      # finds the last run's compiled tests instead of starting cold.
      CARGO_TARGET_DIR: /home/azureuser/ci-target-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The VM's own toolchain (rustup in ~/.cargo); the runner service starts with a bare PATH.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # `--all-targets`: the test targets are gated too, so a lint there is fixed in the PR that
      # introduces it instead of accumulating. `cargo fmt --check` is deliberately absent — the
      # tree is not rustfmt-shaped and gating it means one repo-wide reformat commit, which is
      # the owner's call, not CI's.
      # `--locked` on both, like the Dockerfile and the build job: a stale lockfile must fail here,
      # not pass here by rewriting Cargo.lock and then fail differently in `build`.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # A runner without git must FAIL the git-dependent tests, not skip them green.
      - run: cargo test --locked
        env:
          KLOUDLITE_REQUIRE_GIT: "1"
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # `audit-check` above covers advisories only. This adds the three checks a repo with this
      # much crypto surface wants: banned/duplicate crates, licence policy, and source
      # allowlisting. Config lives in deny.toml, next to Cargo.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  build:
    # NOT `needs: test` — the compile and the tests run in parallel, and only `image` below waits
    # for both. Waiting for tests before compiling added their whole duration (5m32s measured) to
    # every image, serially, for nothing; gating the PUSH on them costs nothing extra.
    #
    # Compiled here, on the runner, NOT inside docker. cargo-chef under a `type=gha,mode=max` layer
    # cache cached the dependency cook and nothing else: the workspace crates sat in the layer that
    # also held the source, so every commit rebuilt them from scratch — 342 s of `cargo build` plus
    # 114 s of cache export, per run. rust-cache keeps the whole target dir across commits, so an
    # ordinary commit recompiles only the crates it touched.
    #
    # Inside rust:1-bookworm rather than on ubuntu-24.04 itself: the runtime images are
    # bookworm-slim (glibc 2.36) and a binary linked against the runner's glibc 2.39 would not exec
    # there. The step after the build checks that no newer symbol version crept in.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, build-0]
    timeout-minutes: 30
    # Still inside rust:1-bookworm for the glibc reason above (the VM is Ubuntu 24.04, glibc
    # 2.39). The container is fresh every run, so the target dir and the crate registry live on
    # the HOST and are mounted in: that is the whole reason this runs on build-0.
    container:
      image: rust:1-bookworm@sha256:e70e2eec3d495fd5c8e0be74adda86507dfac7f51a724fbf9813ff59b2b247c7
      # As the runner's own user (azureuser, uid 1000), never root: a root checkout inside the
      # container leaves files the host-side test job cannot delete, and the next run's checkout
      # fails with "permission denied" on .git/index.lock — which is exactly what happened.
      options: --user 1000:1000
      volumes:
        - /home/azureuser/ci-target:/ci-target
        - /home/azureuser/ci-cargo:/usr/local/cargo/registry
    env:
      CARGO_TARGET_DIR: /ci-target
      # The image's HOME is root's; a non-root cargo needs somewhere writable for its own state.
      HOME: /tmp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          cargo build --release --locked
          --bin kloudlite --bin kloudlite-api --bin kloudlite-worker
          --bin kloudlite-agent --bin kloudlite-gateway
          --bin kloudlite-slo --bin kl
      - name: glibc ceiling
        run: |
          set -eu
          for b in kloudlite kloudlite-api kloudlite-worker kloudlite-agent kloudlite-gateway kloudlite-slo kl; do
            need=$(objdump -T "/ci-target/release/$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$b needs $need"
            if [ "$(printf '%s\nGLIBC_2.36\n' "$need" | sort -V | tail -1)" != GLIBC_2.36 ]; then
              echo "::error::$b needs $need, bookworm-slim ships 2.36"; exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bins
          path: |
            /ci-target/release/kloudlite
            /ci-target/release/kloudlite-api
            /ci-target/release/kloudlite-worker
            /ci-target/release/kloudlite-agent
            /ci-target/release/kloudlite-gateway
            /ci-target/release/kloudlite-slo
            /ci-target/release/kl
          if-no-files-found: error
          retention-days: 1

  image:
    # Docker on the plain runner: buildx and the ghcr login have no business inside the rust
    # container, and the artifact hop for five binaries is seconds.
    #
    # `needs: test` as well as `build`: a commit whose tests fail gets NO package — neither
    # `:<sha>` nor `:latest`. The deploy side (`deploy/pin.sh`) can then treat "the tag exists"
    # as "the tests passed", which is the only signal a repin from `git log` ever sees.
    needs: [build, test]
    runs-on: [self-hosted, build-0]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins
          path: target/release
      # upload-artifact drops the mode bits and the Dockerfile COPYs the files as they are.
      - run: chmod +x target/release/kloudlite* target/release/kl
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # The classic driver: the VM's own daemon keeps every layer between runs, which is the
          # cache `type=gha` used to stand in for.
          driver: docker
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No cache options: the VM's daemon caches every layer locally between runs.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: server
          # linux/amd64 only: the cluster is amd64, and so are the binaries above.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kloudlite/kloudlite:latest
            ghcr.io/kloudlite/kloudlite:${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: agent
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kloudlite/kloudlite-agent:latest
            ghcr.io/kloudlite/kloudlite-agent:${{ github.sha }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: gateway
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kloudlite/kloudlite-gateway:latest
            ghcr.io/kloudlite/kloudlite-gateway:${{ github.sha }}
      # The SLO probe. Same commit as the tier it probes, deliberately: a probe pinned behind the
      # fleet reports the previous release's journey and calls it green.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: slo
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kloudlite/kloudlite-slo:latest
            ghcr.io/kloudlite/kloudlite-slo:${{ github.sha }}
      # No binary of ours inside: the default workspace image is alpine plus what sshd and VS
      # Code need. Built here so it is pinned by the same SHA as the agent that renders pods
      # from it.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: workspace
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kloudlite/kloudlite-workspace:latest
            ghcr.io/kloudlite/kloudlite-workspace:${{ github.sha }}
