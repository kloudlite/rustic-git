name: ws-tests
# Build the workspaces crate's test binaries and publish them as an artifact. The btrfs-gated
# tests need root on a Linux VM — CI cannot run them, but it can do the expensive part
# (compilation) so the VM only downloads a few binaries and executes.
on:
  push:
    branches: [workspaces]
    paths: ['crates/workspaces/**', 'bins/agent/**', 'Cargo.*', '.github/workflows/ws-tests.yml']

jobs:
  build-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build test binaries
        run: |
          cargo test -p rustic-git-workspaces -p rustic-git-agent-bin --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.profile.test == true) | .executable // empty' > bins.txt
          mkdir -p ws-test-bins
          cp $(cat bins.txt) ws-test-bins/
          # The e2e script needs the two deployable binaries as well.
          cargo build -q --bin rustic-git-api --bin rustic-git-agent
          cp target/debug/rustic-git-api target/debug/rustic-git-agent ws-test-bins/
          # Debug-info binaries are hundreds of MB; the VM only executes them.
          strip ws-test-bins/*
          ls -la ws-test-bins/
      - uses: actions/upload-artifact@v4
        with:
          name: ws-test-bins
          path: ws-test-bins/
          retention-days: 3
