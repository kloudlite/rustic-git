# Every action, base image and dependency in this repo is pinned by SHA or digest, which is only
# a virtue while something moves the pins. Weekly, grouped, so a Monday brings a handful of PRs
# rather than one per crate.
version: 2
updates:
  # Actions and base images move rarely and each PR costs a full image build; one grouped PR a
  # month is enough. Crates and packages stay weekly — that is where advisories land.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/", "/web"]
    schedule: { interval: monthly }
    groups:
      images: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
